# TEST-ONLY synthetic contract for the envelope/replay harness probes (RT-713). Never real POS evidence.
openapi: 3.0.3
info: { title: synthetic-idem-probe, version: 1.0.0 }
paths:
  /probe/orders:
    post:
      operationId: probeCreateOrder
      x-idempotency: required
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrder" }
      responses:
        "200": { description: duplicate-safe replay under a different key }
        "201": { description: created }
        "400": { $ref: "#/components/responses/Failure" }
        "409": { $ref: "#/components/responses/Failure" }
  /probe/orders/{ref}/cancel:
    post:
      operationId: probeCancelOrder
      x-idempotency: required
      parameters:
        - { name: ref, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelOrder" }
      responses:
        "201": { description: cancelled }
        "404": { $ref: "#/components/responses/Failure" }
        "409": { $ref: "#/components/responses/Failure" }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[\x21-\x7E]{16,128}$' }
  schemas:
    CreateOrder:
      type: object
      additionalProperties: false
      required: [externalId, total]
      properties:
        externalId: { type: string }
        total: { type: string, pattern: '^[0-9]+\.[0-9]{2}$' }
    CancelOrder:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, enum: [customer, cashier] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    Failure:
      description: error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
