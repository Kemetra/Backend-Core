openapi: 3.1.0
info:
  title: Data-Pulse-2 Audit API
  version: "1.1.0-draft"
  description: >
    Read-only access to audit events for the active tenant.
    Tenant-admin or platform-admin scope. Per spec FR-AUDIT-1/2/3.
servers:
  - url: https://api.example.com
paths:
  /api/v1/audit/events:
    get:
      summary: Query audit events for the active tenant.
      operationId: listAuditEvents
      description: >
        Items are ordered newest first: `occurred_at` descending, then `id`
        descending as the tie-breaker. `next_cursor` continues that order and is
        stable under concurrent inserts. A cursor is valid only with the same
        filters (including `kind`) it was issued under.
      parameters:
        - in: query
          name: action
          schema:
            type: string
            minLength: 1
          description: >
            Filter by a literal action-code prefix (e.g. `auth.`). `%`, `_` and
            `\` are matched literally, not as patterns.
        - in: query
          name: kind
          schema:
            type: string
            enum: [read, change]
          description: >
            Return only events of this action kind. `change` excludes read-only
            actions (list/read/pull requests that changed no state); `read` returns
            only those. Omitted: all events, as before. Read-only actions are still
            recorded; this filter changes what the list returns, not what is audited.
            Combines with every other filter (AND). An unknown value is a 400
            `validation_error`.
        - in: query
          name: actor_user_id
          schema: { type: string, format: uuid }
        - in: query
          name: store_id
          schema: { type: string, format: uuid }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: cursor
          schema: { type: string, minLength: 1 }
          description: >
            Opaque pagination cursor from a prior page's `next_cursor`. Do not
            construct or decode it; a malformed value is a 400 `validation_error`.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  next_cursor:
                    type: string
                    nullable: true
        "400":
          description: >
            `validation_error`: a query parameter is invalid (for example an
            unknown `kind`, a malformed `cursor`, an out-of-range `limit`, a
            non-UUID id, or a malformed date-time).
        "401":
          description: No active tenant.
        "403":
          description: Insufficient role.
components:
  schemas:
    AuditEvent:
      type: object
      required: [kind]
      properties:
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        actor_user_id: { type: string, format: uuid, nullable: true }
        actor_label: { type: string, nullable: true }
        tenant_id: { type: string, format: uuid }
        store_id: { type: string, format: uuid, nullable: true }
        action: { type: string }
        kind:
          type: string
          description: >
            Action kind derived by the server from `action` (not stored). Known
            values: `read`, `change`. More values may be added; treat an unknown
            value as `change`. An action the server has not classified is `change`.
        target_type: { type: string, nullable: true }
        target_id: { type: string, format: uuid, nullable: true }
        request_id: { type: string, format: uuid, nullable: true }
        metadata:
          type: object
          additionalProperties: true
security:
  - cookieAuth: []
