openapi: 3.1.0
info:
  title: Data-Pulse-2 — Payer Accounts (settlement) API
  version: "2.0.0"
  description: >
    Spec 035 (sale-settlement-and-receivables-model), narrowed to Option B
    (RT-413; RT-277 comment 11662; decision-record amendment A1). Backend-Core
    keeps only the payer identity facade. The per-sale payer responsibility
    allocation is captured on the sale itself (owner decision R-1, RT-413
    comment 11669): `CaptureSaleRequest.responsibilities[]` in
    `pos-sales/sales.yaml`, carried to the Connector on the posting feed
    (`erpnext-connector/posting-feed.yaml`). ERPNext owns customer and
    third-party A/R balances, cash application, aging, payment terms, credit
    limits, collections and accounting reconciliation (Payment & Receivables
    baseline, Confluence RETAIL 23560196).

    RT-417 (2.0.0; [GATED] approval Jira RT-417 comment 11671, owner,
    2026-10-12): BREAKING, replacing the stale `1.0.0-draft`.

      Kept (Console, cookieAuth):
        1. `consoleCreatePayerAccount` — create a payer account.
        2. `consoleListPayerAccounts`  — tenant-scoped, newest-first, keyset
           pagination.
      Both stay `x-runtime-status: contract-only` until the RT-418 runtime
      ships them; RT-418 removes the marker.

      Removed (listed in `x-retired-operations`):
        `consoleApplyPayment`, `consoleSubmitClaim`,
        `consoleReconcileRemittance`, `posRecordSettlementIntent`,
        `consoleGetReceivable`, `consoleListReceivables`. Cash application,
        claims, remittance and receivable balances leave Backend-Core.

      Changed: `PayerAccountCreate.creditTerms` is removed (ERPNext owns terms
      and credit limits). `PayerAccountCreate` stays `additionalProperties:
      false`, so a client that still sends `creditTerms` gets a 400.
      `externalRef` is now the payer's ERPNext Customer link (see the field).
      The `operatorAuthorization` scheme, the POS 429 response and every
      receivable / claim / remittance schema leave this document with the
      operations that used them.

    RUNTIME DURING THE TRANSITION: the six removed routes are still served by
    the 035 runtime until RT-422 deletes them (RT-418 leaves them in place).
    They are retired from the contract now so that no new consumer is built on
    them. Admin-Console RT-421 removes their callers; POS RT-420 never adopts
    `settlement-intent`. A route served but absent from every contract is not
    a conformance failure (the runtime-route conformance check maps contract
    operations to routes, not the reverse).

    CONSUMERS: Admin-Console 017 payer screens (RT-421: regenerate from this
    version, drop `creditTerms` from the create form, label `externalRef` as
    the ERPNext Customer link) and Admin-Console 018/019 (RT-421: removed).
    POS 020 (RT-420) uses `pos-sales/sales.yaml`, not this contract.

    AUTH: Console routes use the human `cookieAuth` (httpOnly `dp2_session`,
    `DashboardAuthGuard` + `RolesGuard`). 401/403 semantics are owned by 028
    (G10) and are not re-decided here.

    PROJECTIONS (§IV): every response is an explicit wire shape with
    `additionalProperties: false`: no raw DB entity, no `tenant_id` (implicit
    in scope), no `created_by`.

    Error envelope: the canonical `{ error: { code, message, request_id } }`,
    identical to the shared shape (`auth` / `pos-sales` / `sale-sync-ops`).
    Status mapping: 400 validation, 401 unauthenticated, 403 insufficient-role
    or `origin_rejected`, 404 not-found (non-disclosing), 409 conflict, 500
    internal. Tenant isolation is RLS; an out-of-scope id is a non-disclosing
    404 wherever an id is accepted (on create: an out-of-scope `storeId`).

servers:
  - url: https://api.example.com

tags:
  - name: settlement-console
    description: Console-managed payer accounts (035 narrowed to Option B, RT-413).

x-retired-operations:
  # RT-417 (2.0.0): removed from the contract. The runtime keeps serving them
  # until RT-422 deletes the routes; no new consumer may call them.
  - operationId: consoleApplyPayment
    route: POST /api/v1/settlement/receivables/{receivableRef}/apply-payment
    removedRuntimeIn: RT-422
  - operationId: consoleSubmitClaim
    route: POST /api/v1/settlement/claims
    removedRuntimeIn: RT-422
  - operationId: consoleReconcileRemittance
    route: POST /api/v1/settlement/claims/{claimRef}/reconcile-remittance
    removedRuntimeIn: RT-422
  - operationId: posRecordSettlementIntent
    route: POST /api/v1/settlement/settlement-intent
    removedRuntimeIn: RT-422
  - operationId: consoleGetReceivable
    route: GET /api/v1/settlement/receivables/{receivableRef}
    removedRuntimeIn: RT-422
  - operationId: consoleListReceivables
    route: GET /api/v1/settlement/receivables
    removedRuntimeIn: RT-422

paths:
  # ----------------------------------------------------------------------------
  # Console — payer accounts
  # ----------------------------------------------------------------------------
  /api/v1/settlement/payer-accounts:
    post:
      summary: Create a payer account (credit customer / corporate / insurer).
      operationId: consoleCreatePayerAccount
      x-runtime-status: contract-only
      x-runtime-note: >
        The table exists; the route ships in RT-418, which removes this
        marker.
      x-idempotency: required
      tags: [settlement-console]
      security:
        - cookieAuth: []
      description: >
        Create a payer account. `tenant_id` + actor are server-resolved (§XII).
        Idempotent on `Idempotency-Key`. FR-001/002.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayerAccountCreate"
      responses:
        "201":
          description: Payer account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayerAccount"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrOriginRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/SystemFailure"
    get:
      summary: List payer accounts (tenant-scoped, newest-first, keyset paginated).
      operationId: consoleListPayerAccounts
      x-runtime-status: contract-only
      x-runtime-note: >
        The table exists; the route ships in RT-418, which removes this
        marker.
      tags: [settlement-console]
      description: >
        The caller's tenant's payers: tenant-wide payers (`storeId` null) and
        payers of the stores the caller can access; store-scoped payers outside the caller's store access are excluded (the
        same scope create enforces with its non-disclosing 404).
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PayerCategoryQuery"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of payer accounts, newest-first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayerAccountPage"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/SystemFailure"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dp2_session
      description: >
        The human dashboard session cookie (httpOnly `dp2_session`), verified by
        `DashboardAuthGuard` + `RolesGuard` (default deny). The ONLY accepted
        credential on this surface — a machine bearer or POS envelope is
        rejected. 401/403 semantics owned by 028 (G10).

  parameters:
    PayerCategoryQuery:
      name: category
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/PayerCategory"
      description: Optional payer-category filter.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: Opaque keyset cursor from a prior page's `nextCursor`. Omit for the first page.
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Maximum items per page (bounded). The server MAY return fewer.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[\\x21-\\x7E]{16,128}$"
      description: >
        REQUIRED on every write. Reuses the existing IdempotencyInterceptor —
        identical retry replays the stored response; key-reuse with a different
        logical payload returns 409 `idempotency_key_conflict`.

  schemas:
    # ----- vocabularies -----
    PayerCategory:
      type: string
      enum: [credit_customer, corporate, insurer]
      description: >
        Third-party payer category (FR-002). Extensible without hard-coding a
        single vertical; this is the v1 set.

    # ----- payer account -----
    PayerAccountCreate:
      type: object
      additionalProperties: false
      required: [category, displayName]
      description: >
        Create-a-payer-account request. `tenant_id` + actor are server-resolved
        (§XII) and MUST NOT appear here. RT-417 (2.0.0): `creditTerms` is
        removed; ERPNext owns payment terms and credit limits.
      properties:
        category:
          $ref: "#/components/schemas/PayerCategory"
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        externalRef:
          type: [string, "null"]
          minLength: 1
          pattern: '\S'
          description: >
            The payer's ERPNext Customer link (RT-413 §2): the identifier the
            Connector resolves to the ERPNext Customer that a sale's
            responsibility is posted against (RT-419). Opaque to Backend-Core
            (no FK, never looked up here). Null = not yet linked; the
            Connector fails closed for an unlinked or unknown payer and never
            falls back to the store's Customer (see
            `erpnext-connector/posting-feed.yaml`). When present it must contain
            a non-whitespace character: a blank or whitespace-only value is a
            400 `validation_error`, because it could never resolve to a
            Customer (Codex review of #779).
        storeId:
          type: [string, "null"]
          format: uuid
          description: Optional store scope; null = tenant-wide payer.
    PayerAccount:
      type: object
      additionalProperties: false
      required: [payerRef, category, displayName, status, version]
      description: Wire projection of a payer account. No `tenant_id` (implicit in scope), no credit terms.
      properties:
        payerRef:
          type: string
          format: uuid
          description: >
            Stable server-issued payer reference. A sale names its payers by
            this value (`pos-sales/sales.yaml` `SaleResponsibility.payerRef`).
        category:
          $ref: "#/components/schemas/PayerCategory"
        displayName:
          type: string
        externalRef:
          type: [string, "null"]
          description: The payer's ERPNext Customer link (see `PayerAccountCreate.externalRef`).
        status:
          type: string
          enum: [active, suspended]
        storeId:
          type: [string, "null"]
          format: uuid
        version:
          type: integer
          minimum: 0
          description: Optimistic-concurrency version (§III).
    PayerAccountPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/PayerAccount"
        nextCursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; null on the last page.

    # -------------------------------------------------------------------------
    # Canonical Error envelope (mirrors auth / pos-sales / sale-sync-ops)
    # -------------------------------------------------------------------------
    Error:
      type: object
      required: [error]
      description: >
        Canonical error envelope. Cross-tenant / out-of-scope refusals are
        non-disclosing (§II/§XII) — they never enumerate the underlying cause.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
              description: Human-readable summary. No sensitive data, no cause enumeration.
            request_id:
              type: string
              format: uuid
              description: Server-side correlation id; the actual cause is recorded server-side.

  responses:
    ValidationFailure:
      description: validation_error (400) — malformed body/query, unknown key (strict, including a removed `creditTerms`), bad cursor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: >
        Unauthenticated (401) — missing/invalid credential, or a wrong-surface
        credential (a POS envelope or machine bearer) rejected. Non-disclosing.
        401 semantics owned by 028 (G10).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient role (403) — authenticated but lacks the required role. 028 (G10).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ForbiddenOrOriginRejected:
      description: >
        Insufficient role (403) — authenticated but lacks the required role. 028
        (G10). Also `origin_rejected` (RT-430): the request is authenticated by
        the `dp2_session` cookie and its `Origin` header is missing, or is
        neither the API's own origin nor listed in `ALLOWED_ORIGINS`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >
        not_found (404) — an out-of-scope `storeId` on create: a store that
        does not exist, belongs to another tenant, or is outside the caller's
        store scope. Non-disclosing: one body for every cause (§II/§XII).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >
        conflict (409) — a deterministic, side-effect-free refusal:
        `idempotency_key_conflict` (the key reused with a different payload).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SystemFailure:
      description: system_failure (500) — unexpected server error; cause recorded server-side by request_id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
