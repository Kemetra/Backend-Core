# Store time zone (spec 038, RT-401): Store.timezone, StoreCreate.timezone,
# the StoreUpdate time zone change, and the timezone-change-preview route
# implement Confluence RETAIL decisions 212-215 with the owner's option A.
openapi: 3.1.0
info:
  title: Data-Pulse-2 Stores API
  version: "1.1.0-draft"
  description: >
    Store administration within the active tenant. Active tenant must be
    set on the session/token; otherwise endpoints return 401.
servers:
  - url: https://api.example.com
paths:
  /api/v1/stores:
    get:
      summary: List stores in the active tenant.
      operationId: listStores
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Store"
        "401":
          description: No active tenant.
    post:
      summary: Create a store in the active tenant. Tenant-admin or owner only.
      operationId: createStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "400":
          description: >
            `validation_error` (malformed body or time zone shape) or
            `invalid_timezone` (well-formed name PostgreSQL does not know).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No active tenant.
        "403":
          description: >
            Insufficient role. Also `origin_rejected` (RT-430): the request is
            authenticated by the `dp2_session` cookie and its `Origin` header is
            missing, or is neither the API's own origin nor listed in
            `ALLOWED_ORIGINS`.
        "409":
          description: Code conflict within tenant.
  /api/v1/stores/{store_id}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      summary: Read a store. Caller must have access (per membership policy).
      operationId: readStore
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "404":
          description: Not found / no access.
    patch:
      summary: Update store fields. Tenant-admin or owner only.
      description: >
        A time zone change (decision 214, RT-401 option A) is applied only
        when `expected_current_timezone` still matches, the caller asserts
        `timezone_impact_reviewed`, and no server-known shift at the store
        is open. All checks and the write run in one transaction with the
        store row locked; a successful change writes one
        `store.timezone.changed` audit event in that transaction. Business
        dates already persisted on sales, returns and shifts are never
        rewritten (decision 215). Setting `timezone` to its current value is
        a no-op for the zone and is not blocked by an open shift.
      operationId: updateStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "400":
          description: >
            `validation_error` (malformed body, time zone shape, or
            `timezone` sent without `expected_current_timezone` and
            `timezone_impact_reviewed: true`, or either of those sent without
            `timezone`) or `invalid_timezone`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            `origin_rejected` (RT-430): the request is authenticated by the
            `dp2_session` cookie and its `Origin` header is missing, or is
            neither the API's own origin nor listed in `ALLOWED_ORIGINS`.
        "404":
          description: Not found / no access.
        "409":
          description: >
            `timezone_changed_concurrently` (`expected_current_timezone` is
            stale) or `store_has_open_shift` (a shift at this store is open).
            Nothing is written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Soft-delete the store.
      operationId: softDeleteStore
      responses:
        "204":
          description: Soft-deleted.
        "403":
          description: >
            `origin_rejected` (RT-430): the request is authenticated by the
            `dp2_session` cookie and its `Origin` header is missing, or is
            neither the API's own origin nor listed in `ALLOWED_ORIGINS`.
        "404":
          description: Not found / no access.
  /api/v1/stores/{store_id}/timezone-change-preview:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      summary: Preview the impact of changing the store's time zone. Read-only.
      description: >
        Impact review for decision 214. Writes nothing. Tenant-admin or owner
        only; a wrong role, another tenant's store, or an unknown store is a
        non-disclosing 404. The blockers reported here are re-checked when
        the change is applied, so a preview is advisory, not a reservation.
      operationId: previewStoreTimezoneChange
      parameters:
        - in: query
          name: timezone
          required: true
          schema:
            $ref: "#/components/schemas/IanaTimezone"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreTimezoneChangePreview"
        "400":
          description: "`validation_error` or `invalid_timezone`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No active tenant.
        "404":
          description: Not found / no access.
components:
  parameters:
    StoreId:
      in: path
      name: store_id
      required: true
      schema: { type: string, format: uuid }
  schemas:
    IanaTimezone:
      type: string
      description: >
        IANA time zone name, case-sensitive: `UTC` or an `Area/Location[/Sub]`
        name under a canonical IANA area (Africa, America, Antarctica, Arctic,
        Asia, Atlantic, Australia, Europe, Indian, Pacific) that the server's
        PostgreSQL resolves. Abbreviations (`EET`), POSIX strings (`UTC+2`,
        `+02:00`), `Etc/*` and the legacy alias trees (`US/Eastern`,
        `posix/*`, …) are rejected.
      minLength: 3
      maxLength: 64
      pattern: "^(UTC|(Africa|America|Antarctica|Arctic|Asia|Atlantic|Australia|Europe|Indian|Pacific)(/[A-Za-z0-9_+-]+){1,2})$"
      examples: ["Africa/Cairo", "UTC"]
    Store:
      type: object
      # Every response carries the zone (spec 038 plan 1.1). The older fields
      # keep their pre-038 optional declaration.
      required: [timezone]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        timezone:
          $ref: "#/components/schemas/IanaTimezone"
          description: >
            Drives the store-local business date of sales, returns and shifts.
            `UTC` is the draft default (decision 213) and is not evidence of
            production readiness.
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }
    StoreCreate:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1 }
        timezone:
          $ref: "#/components/schemas/IanaTimezone"
          description: Optional. Omitted means `UTC` (decision 213 draft default).
    StoreUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >
        At least one of `name`, `is_active` or `timezone`; an empty body is a
        400. `timezone`, `expected_current_timezone` and
        `timezone_impact_reviewed` travel together: all three or none.
      properties:
        name: { type: string, minLength: 1 }
        is_active: { type: boolean }
        timezone:
          $ref: "#/components/schemas/IanaTimezone"
        expected_current_timezone:
          $ref: "#/components/schemas/IanaTimezone"
          description: >
            The zone the caller previewed from. A mismatch with the stored
            zone is `409 timezone_changed_concurrently`.
        timezone_impact_reviewed:
          type: boolean
          const: true
          description: >
            The caller asserts the impact preview was shown and accepted.
      dependentRequired:
        timezone: [expected_current_timezone, timezone_impact_reviewed]
        expected_current_timezone: [timezone]
        timezone_impact_reviewed: [timezone]
    StoreTimezoneChangePreview:
      type: object
      additionalProperties: false
      required:
        - store_id
        - current_timezone
        - proposed_timezone
        - no_op
        - now
        - utc_offset_minutes_current
        - utc_offset_minutes_proposed
        - business_date_current
        - business_date_proposed
        - business_date_changes_now
        - open_shift_count
        - blockers
        - can_apply
        - caveats
      properties:
        store_id: { type: string, format: uuid }
        current_timezone: { $ref: "#/components/schemas/IanaTimezone" }
        proposed_timezone: { $ref: "#/components/schemas/IanaTimezone" }
        no_op:
          type: boolean
          description: The proposed zone equals the current zone.
        now:
          type: string
          format: date-time
          description: Server time the preview was computed at.
        utc_offset_minutes_current: { type: integer }
        utc_offset_minutes_proposed: { type: integer }
        business_date_current:
          type: string
          format: date
          description: Today's business date under the current zone, at `now`.
        business_date_proposed:
          type: string
          format: date
          description: Today's business date under the proposed zone, at `now`.
        business_date_changes_now:
          type: boolean
          description: "`business_date_current` differs from `business_date_proposed`."
        open_shift_count:
          type: integer
          minimum: 0
          description: Shifts at this store the server knows to be open.
        blockers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, count]
            properties:
              code:
                type: string
                enum: [store_has_open_shift]
              count: { type: integer, minimum: 1 }
        can_apply:
          type: boolean
          description: "`no_op` is false and `blockers` is empty."
        caveats:
          type: array
          description: >
            Limits of what the server can see; always returned.
            `offline_shifts_not_visible`: a shift opened on a POS that has not
            synced is not counted. `uncaptured_sales_use_new_zone`: a sale
            that happened before the change but reaches the server after it
            gets its business date under the new zone.
          items:
            type: string
            enum: [offline_shifts_not_visible, uncaptured_sales_use_new_zone]
    Error:
      type: object
      required: [error]
      description: Canonical error envelope.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >
                Stable machine-readable code. This contract adds
                `invalid_timezone`, `timezone_changed_concurrently` and
                `store_has_open_shift`.
            message: { type: string }
            request_id: { type: string, format: uuid }
security:
  - cookieAuth: []
