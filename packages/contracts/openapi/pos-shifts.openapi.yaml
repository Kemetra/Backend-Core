openapi: 3.1.0
info:
  title: Data-Pulse-2 POS Shifts API
  version: "1.4.0-draft"
  description: >
    POS-Pulse 004 Backend shift-lifecycle surface. Wave 4.1b (stuck-shift
    discovery).


    The endpoint returns shifts that are open past a configurable staleness
    threshold and whose opening cashier has no active pos_operator session
    on the same branch. No internal identifiers (users.id, devices.id,
    Clerk subject, auth-token IDs) are present in any response.


    Authentication: the role-named `operator-identity` scheme — a
    provider-identity JWT bearer (spec 030 / 028 DOC-1; previously `clerkJwt`),
    manager / admin roles only. Identity proof only — NOT business authorization
    (028 §6 CM-1); role eligibility is enforced server-side. Caller must have
    branch access (same store_access_kind rules as sign-in). store_staff is
    refused.


    Cross-cutting conventions live in
    `specs/001-foundation-auth-tenant-store/contracts/README.md`.


    RT-17 (1.1.0-draft; `[GATED]` approval: Jira RT-17 comment 10760, design
    record comment 10919, owner confirmation 2026-10-05): additive. Three new
    POS write operations record a thin, cash-only shift cash-up as immutable
    facts: `openShift`, `recordCashMovement` and `closeShift`. `GET
    /shifts/stuck`, its `operator-identity` scheme and its schemas are
    unchanged. The new operations use camelCase bodies and projections, like
    `pos-sales/sales.yaml`; the stuck-shift projection keeps its snake_case.
    The paragraphs above describe `GET /shifts/stuck` only: the cash-up
    bodies and projections do carry `users.id` values (the opening, closing
    and recording users), as `captureSale` carries `operatorUserId`.


    **Runtime status.** `openShift`, `recordCashMovement` and `closeShift` are
    implemented: the first two in RT-17 slice 2b-1, `closeShift` in slice
    2b-2, on migration `0036_shift_cash_up` from slice 2a. Slice 2b-1 also
    documents what the shared `IdempotencyInterceptor` already answers on
    every operation (the 425 and the two `Idempotency-Key` 400 codes) and the
    `openShift` scoping rule; slice 2b-2 documents the replay order below and
    the variance approver's tenant rule. No request or projection shape
    changed.


    **Model** (10919). A shift is one drawer session on one terminal: at most
    ONE open shift per device. The POS owns the offline lifecycle and is
    authoritative for the cash-up; Backend-Core receives the immutable record.
    Each fact carries a client-generated UUID (UUIDv7 preferred; UUIDv4
    fallback, the platform ID rule) as `shiftId` or `movementId`, so the POS
    can complete a whole shift offline and drain it later, in order:
    open, then movements, then close. The server never closes, edits or
    deletes a shift on its own. It validates the close arithmetic on ingest and
    never rewrites a POS total (Constitution §III); a recompute against the
    recorded sales and returns is a read-side flag (RT-18), never a block. The
    opening and closing users may differ.


    **Authentication** (same model as `captureSale`, RT-224). Each new
    operation accepts either the `operatorAuthorization` envelope or the paired
    terminal's `device` bearer. Tenant, store and device come only from the
    credential (the envelope session's bound device, or the device row), never
    from the request (Constitution §II, §XII). On the device path the body
    carries `operatorUserId`, the `users.id` of the cashier making the change.
    It is a claim the server verifies against a `cashier_admissions` row of the
    same tenant, store, device and user whose window covers the fact's time
    `t` (`openedAt`, `occurredAt` or `closedAt`), with the RT-224 120 s
    clock-skew tolerance: `created_at - 120 s <= t < LEAST(ended_at,
    expires_at) + 120 s`. An admission that has since ended or expired still
    covers the facts inside its window, unless that window ended more than 7
    days ago (back-dating cap); a fact whose time is more than 120 s after the
    server's current time is refused (future-dating cap). The cashier's
    membership, store access and role are re-checked live. A missing, invalid
    or revoked credential, and an envelope request that carries
    `operatorUserId`, is the generic 401. A refused claim from an
    authenticated device is the generic 403 `refused`, with one body for every
    cause; it is never a sign that the device was revoked. A fact made
    offline outside every admission window is refused on the device path; the
    POS dead-letters it and it is repaired on the manager-envelope path
    (10919 decision 4, RT-113 P3/P4).


    **Idempotency** (Constitution §XI). Every new operation REQUIRES the
    `Idempotency-Key` header and reuses the existing `IdempotencyInterceptor`;
    the key is scoped to the verified actor, as on `captureSale`. The facts are
    also deduplicated on their natural key (`shiftId` for the open and the
    close, `movementId` for a movement) with a payload hash: a re-delivery of
    the same fact with a different key is a `200` replay; the same natural key
    with a different payload is 409 `shift_payload_conflict`. The
    `operatorUserId` claim is not part of that payload hash. Every id (`format:
    uuid`, in a body or the `shift_id` path) is case-insensitive: it is
    normalised to lower case before any comparison, de-duplication or hash,
    so an upper-case re-delivery is the same fact. A request whose
    `Idempotency-Key` is still being processed is 425 `idempotency_in_progress`
    (retry with the same key and body after `Retry-After`); a missing key is
    400 `idempotency_key_required` and a malformed one 400
    `idempotency_key_malformed`. On the `operatorAuthorization` path, a
    re-delivery whose payload hash matches the recorded fact is answered as
    that replay before the stated user's live store check (the opening or
    closing user's tenant membership and store access), so a repair retry of
    a fact already recorded still replays after that user's access was
    revoked; nothing is written, and every other request goes through every
    check (RT-17 comment 10931).


    **Money.** Every amount is an exact-decimal string (never a float) in the
    shift's currency, stored as `numeric(19,4)`. A shift has one currency, the
    ISO-4217 `currencyCode` given at open: every amount on its movements and
    its close is in that currency, and those bodies carry no currency field.
    An amount may have at most as many fractional digits as the currency's
    ISO-4217 minor unit (its exponent: JPY 0, EGP 2, OMR 3; never an assumed
    2); more fractional digits than that, or a `currencyCode` with no ISO-4217
    minor unit, is 400 `validation_error`. Cash amounts are net of change
    (RT-160 D-3): cash sales count the cash kept (tendered − change), as the
    sale's cash tender records it. Cash only: card and other tenders are out
    of scope (10919 decision 3).


    **PII.** No request or response carries a PIN, a secret or a contact
    field. The only free text is the optional movement `note` and the forced
    close's `forcedReason`, both short and documented "no PII"; the server
    never logs either.


    RT-384 (1.2.0-draft; `[GATED]`, needs owner approval; AD-CASH-001 D-6 /
    D-7, Kemetra/Orchestrator `e73362b`): strictly additive. The shift
    variance policy (`cash-variance-policy.openapi.yaml`) is frozen per Cash
    Session at open (K-2). `openShift` accepts one OPTIONAL object,
    `frozenPolicy` (`policySource`, `policyRevisionId`, `policyValue`, all
    three required inside it); `Shift` echoes it with the open's policy flags,
    and
    `ShiftClose` gains the derived `approvalRequiredByPolicy`,
    `approvalMissing` and the persisted `approverCheck`. These are accepted
    and emitted from RT-387 (on the RT-385 migration); until then the runtime
    is unchanged. No operation, status, required list or existing field
    changes, so a POS that never sends the new fields is unaffected (the POS
    shift sync client reads only the status and `error.code` of an answer).


    RT-490 (1.3.0-draft; [GATED] owner authorization Jira RT-490 comment
    13211, 2026-10-21; RT-271 R-9, ratified in RT-271 comment 11886): REFUND
    CROSS-CHECK ON CLOSE. From the F-3 runtime, `closeShift` requires every
    claimed non-zero `recordReturn` return to be fully settled in this shift
    by settled cash refund executions (`pos-sales/sales.yaml`
    `recordRefundExecution`, 1.13.0-draft), and `cashRefundsTotal` equal to the sum
    of those executions plus the claimed credit-sale returns' cash refund
    tenders, else 422 `refund_ref_unsettled` or
    `cash_refunds_total_mismatch` (see `closeShift`). No request, projection,
    status or `required` list changes; the change adds two `error.code`
    values to the existing 422 and is NOT additive in behaviour once F-3
    enforces it. ROLLOUT ORDER: the F-2 runtime records executions; the POS
    reports them (F-5) and holds a shift's close until that shift's
    executions are acknowledged; F-3 enforces the rule only after that. Until F-3 the close behaves as in 1.2.0-draft. OPEN for F-3:
    a return paid out before the POS reported executions has none, and so
    has a non-zero return sent without `allocationRef` (a till that
    predates F-5), so a close that claims either could never pass; F-3
    defines that cutover. This version does not decide it.


    RT-742 (1.4.0-draft; [GATED] owner authorization 2026-10-21; RT-554
    follow-up, owner decision 2026-10-19): strictly additive. A NEW operation,
    `forceCloseShift`, lets a manager clear a stuck shift from ANY terminal of
    the same tenant and store, which `closeShift` cannot (it resolves
    `shift_id` only on the caller's own device). It is a separate fact, not a
    cash-up: the manager is on another terminal and has neither that drawer's
    totals nor the POS-authoritative cash-up, and the server never computes or
    rewrites one (Constitution §III), so the shift is closed as NOT COUNTED
    (`cashCount: not_counted`), with no totals, no variance and no
    `ShiftClose`. `GET /shifts/stuck`, `closeShift` (its body, its
    device-scoped 404 and the normal close) and every existing schema are
    unchanged. The only edits to existing operations are description text:
    a new 409 `error.code`, `shift_force_closed`, answers a later `closeShift`
    or `openShift` replay for a shift a manager closed this way; a later NEW
    `recordCashMovement` keeps 409 `shift_closed` (see `forceCloseShift`, Late
    facts). A not-counted close is excluded from every variance flag and from
    the R-9 cash-refund cross-check, and is never a counted zero (see
    `forceCloseShift`, Not counted). The runtime, and the storage for the new
    fact, are a separate ticket and a separate [GATED] change; `forceCloseShift` has no runtime route yet. The Console
    read side (`shift-closes.openapi.yaml`) lists recorded cash-ups only, so
    a force-closed shift is not listed there; surfacing it is a separate
    ticket.
servers:
  - url: https://api.example.com
tags:
  - name: pos-shifts
    description: >
      POS shift lifecycle: stuck-shift discovery (manager query) and the RT-17
      thin cash-up (open, pay-in / pay-out, close).
paths:
  /api/pos/v1/shifts/stuck:
    get:
      summary: List shifts that are open and stale.
      description: >
        Returns all shifts on the requested branch whose `lifecycle_state`
        is `'open'`, whose `opened_at` is older than the server-configured
        staleness threshold (default 15 minutes), and whose opening cashier
        has no active `pos_operator` auth-token row on that branch.


        Only managers and admins may call this endpoint; store_staff
        (cashier) callers receive a generic 401.


        RT-742: a listed `shift_id` is all a manager needs to clear the shift
        with `forceCloseShift`, from any terminal of the store; the list adds
        no field for it (that close takes no totals). One eligible shift this
        list does not show is the caller's own (see `forceCloseShift`,
        Eligibility).
      operationId: posShiftsGetStuck
      tags: [pos-shifts]
      security:
        - operator-identity: []
      parameters:
        - name: branch_id
          in: query
          required: true
          description: UUID of the branch (store) to query.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Stuck shifts retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StuckShiftsResponse"
        "400":
          description: >
            Validation error — `branch_id` is missing or not a valid UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >
            Unauthorized. The caller's JWT is missing, malformed, unmapped,
            refers to a deleted user, or belongs to a role not eligible for
            this endpoint (store_staff). Also returned when the caller does
            not have access to the requested branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/pos/v1/shifts:
    post:
      summary: Open a shift (record the opening float) on this terminal.
      operationId: openShift
      x-idempotency: required
      tags: [pos-shifts]
      security:
        - operatorAuthorization: []
        - device: []
      description: >
        Records the immutable `ShiftOpened` fact for the authenticated
        terminal: the client-generated `shiftId`, the POS-clock `openedAt`, the
        opening cashier, the shift's single currency and the opening float.
        The device is the credential's device (see the info description);
        no tenant, store or device field is accepted.


        At most one open shift per device: if this device already has an open
        shift with a different `shiftId`, the answer is 409
        `shift_already_open` and nothing is recorded. Re-sending the same open
        (same `shiftId`, same payload) is a replay and returns the shift's
        current projection, even after it has been closed. One exception
        (RT-742): a shift a manager closed with `forceCloseShift` has no
        `ShiftClose` to project, so the same open re-delivered under ANOTHER
        `Idempotency-Key` is 409 `shift_force_closed` and nothing is
        recorded; the device is free to open a new shift. The same open under
        the SAME `Idempotency-Key` is answered by the shared
        `IdempotencyInterceptor` with the stored open response and status
        (RT-82 K4, within the replay window) before the handler runs, so it
        is not re-evaluated and cannot carry `shift_force_closed`: the POS
        learns of the force close from its next movement (409
        `shift_closed`) or close (409 `shift_force_closed`), never from an
        open replay.


        **Scope of `shiftId`** (as for `recordCashMovement` and `closeShift`).
        The natural-key replay resolves `shiftId` only within the caller's
        tenant, store and device. A `shiftId` already recorded anywhere else
        (another device, another store or another tenant) is 409
        `shift_payload_conflict`, the same answer as a different payload: it
        never returns that shift's projection and nothing is recorded. One
        exception: an OPEN shift that the audit-ingest `shift.open` event
        already recorded for this same tenant, store and device, with the
        same `openedAt` and opening user, is adopted by this open and answered
        `201` like a first open. Any other audit-ingest shift with this
        `shiftId` is 409 `shift_payload_conflict`.


        Attribution: on the device path `openingUserId` MUST equal the
        verified `operatorUserId`, else 403 `refused`. On the envelope path the
        envelope operator is the actor (a repair of a dead-lettered open), and
        `openingUserId` is recorded as stated; it must be a user of the
        caller's tenant with access to the store, else 403 `refused`.


        **Shift variance policy (RT-384, AD-CASH-001 D-6).** The POS freezes
        the policy it applies to this Cash Session and sends it as one
        optional object, `frozenPolicy`, with `policySource`,
        `policyRevisionId` and `policyValue` (all three or none, by
        construction). A POS that predates the policy, and an open recorded
        before the upgrade, sends no `frozenPolicy`; such a shift's derived
        close values are `unknown`. Backend-Core records it verbatim and never
        refuses an open or a close on policy grounds: an unknown revision, a
        superseded revision and a value that differs from the revision (or,
        for a `limit`, from the shift's currency) are accepted, recorded and
        flagged `policy_revision_unknown`, `policy_revision_superseded` or
        `policy_value_mismatch` (an offline open on an older cached revision
        is normal, DR-8). Only a malformed `frozenPolicy` is a 400
        `validation_error`: a missing member, a `null` `policyRevisionId`
        with source `tenant` or `store`, a non-null one with `system` or
        `fallback`, or a `limit` without its amount or currency.


        **Payload hash.** `frozenPolicy` is part of the open's payload hash
        under one rule: when it is absent it is omitted from the payload hash
        (so a pre-upgrade open re-delivered later hashes byte-identically and
        is never a 409 `shift_payload_conflict`), and inside it a present
        `null` `policyRevisionId` is hashed as `null`. Absent and `null` are
        never conflated. `policyValue.limitAmount` is hashed in the canonical
        money form the hash uses for `openingFloat` (exactly the frozen
        `currencyCode`'s ISO-4217 minor-unit digits, no leading zeros); when
        that currency has no ISO-4217 minor unit, or the amount has more
        significant digits than it, the amount is hashed verbatim, so a frozen
        value is never rejected for its precision.


        **Rollout.** `frozenPolicy` is accepted from RT-387. Until then the
        strict body refuses it with 400 (a dead-letter on the POS), so a POS
        must not send it before the RT-387 runtime is live and past its
        rollback window, or must send it behind a flag it can turn off first.
      parameters:
        - $ref: "#/components/parameters/PosBuildCommit"
        - $ref: "#/components/parameters/PosAppVersion"
        - $ref: "#/components/parameters/PosContractPin"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenShiftRequest"
            examples:
              open:
                summary: A cashier opens a shift with a 500 EGP float (device path).
                value:
                  shiftId: "0192f5a2-3b4c-7d8e-9f01-23456789ab01"
                  openedAt: "2026-10-05T08:00:00Z"
                  openingUserId: "0190f5a2-3b4c-7d8e-9f01-23456789abcd"
                  currencyCode: EGP
                  openingFloat: "500.00"
                  operatorUserId: "0190f5a2-3b4c-7d8e-9f01-23456789abcd"
      responses:
        "200":
          description: >
            Replay. Either the same `Idempotency-Key` again (the stored
            response, with its stored status, normally `201`, RT-82 K4) or the
            same open re-delivered under another key, which returns the
            shift's current projection with `200`. Both carry
            `Idempotent-Replayed: true`; nothing is recorded twice.
          headers:
            X-Device-Token-Rotate-After:
              $ref: "#/components/headers/DeviceTokenRotateAfter"
            X-Device-Token-Rotate-Stage:
              $ref: "#/components/headers/DeviceTokenRotateStage"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
              examples:
                open:
                  $ref: "#/components/examples/ShiftOpen"
        "201":
          description: >
            Shift opened for the first time. A retry with the same
            `Idempotency-Key` replays this stored `201` with
            `Idempotent-Replayed: true`.
          headers:
            X-Device-Token-Rotate-After:
              $ref: "#/components/headers/DeviceTokenRotateAfter"
            X-Device-Token-Rotate-Stage:
              $ref: "#/components/headers/DeviceTokenRotateStage"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
              examples:
                open:
                  $ref: "#/components/examples/ShiftOpen"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Refused"
        "409":
          $ref: "#/components/responses/OpenShiftConflict"
        "425":
          $ref: "#/components/responses/IdempotencyInProgress"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"
  /api/pos/v1/shifts/{shift_id}/cash-movements:
    post:
      summary: Record a pay-in or pay-out on an open shift.
      operationId: recordCashMovement
      x-idempotency: required
      tags: [pos-shifts]
      security:
        - operatorAuthorization: []
        - device: []
      description: >
        Records an immutable `CashMovement` fact on an open shift of this
        device: cash put into the drawer (`pay_in`) or taken out of it
        (`pay_out`), with a reason code. The amount is in the shift's
        currency. A movement is never edited or deleted; a mistake is
        corrected with an opposite movement.


        The shift must be open: a NEW movement on a closed shift, including
        one a manager closed with `forceCloseShift` (RT-742), is 409
        `shift_closed`. Re-sending a movement that is already recorded (same
        `movementId`, same payload) is a replay, even after the close. The
        replay resolves `movementId` only on the path `shift_id`: a
        `movementId` already recorded on any other shift (of this device or
        not) is 409 `shift_payload_conflict` and is never returned. A shift
        that does not resolve to this device is the non-disclosing 404
        `shift_not_found`.


        Attribution: on the device path the verified `operatorUserId` is the
        movement's actor; on the envelope path the envelope operator is.
      parameters:
        - $ref: "#/components/parameters/PosBuildCommit"
        - $ref: "#/components/parameters/PosAppVersion"
        - $ref: "#/components/parameters/PosContractPin"
        - $ref: "#/components/parameters/ShiftId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordCashMovementRequest"
            examples:
              payOut:
                summary: A 120 EGP petty-cash pay-out (device path).
                value:
                  movementId: "0192f5a2-3b4c-7d8e-9f01-23456789ab02"
                  kind: pay_out
                  amount: "120.00"
                  reasonCode: petty_expense
                  note: Cleaning supplies
                  occurredAt: "2026-10-05T11:30:00Z"
                  operatorUserId: "0190f5a2-3b4c-7d8e-9f01-23456789abcd"
      responses:
        "200":
          description: >
            Replay. Either the same `Idempotency-Key` again (the stored
            response with its stored status, RT-82 K4) or the same movement
            re-delivered under another key (`200` with the stored
            projection). Both carry `Idempotent-Replayed: true`.
          headers:
            X-Device-Token-Rotate-After:
              $ref: "#/components/headers/DeviceTokenRotateAfter"
            X-Device-Token-Rotate-Stage:
              $ref: "#/components/headers/DeviceTokenRotateStage"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashMovement"
              examples:
                payOut:
                  $ref: "#/components/examples/CashMovementPayOut"
        "201":
          description: >
            Movement recorded for the first time. A retry with the same
            `Idempotency-Key` replays this stored `201` with
            `Idempotent-Replayed: true`.
          headers:
            X-Device-Token-Rotate-After:
              $ref: "#/components/headers/DeviceTokenRotateAfter"
            X-Device-Token-Rotate-Stage:
              $ref: "#/components/headers/DeviceTokenRotateStage"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashMovement"
              examples:
                payOut:
                  $ref: "#/components/examples/CashMovementPayOut"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Refused"
        "404":
          $ref: "#/components/responses/ShiftNotFound"
        "409":
          $ref: "#/components/responses/CashMovementConflict"
        "425":
          $ref: "#/components/responses/IdempotencyInProgress"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"
  /api/pos/v1/shifts/{shift_id}/close:
    post:
      summary: Close a shift with its cash-up (counted cash and variance).
      operationId: closeShift
      x-idempotency: required
      tags: [pos-shifts]
      security:
        - operatorAuthorization: []
        - device: []
      description: >
        Records the immutable `ShiftClosed` fact and moves the shift from open
        to closed, once. The POS computed the cash-up and is authoritative for
        it; the server records the POS totals verbatim and never rewrites them
        (Constitution §III).


        **Arithmetic invariant**, checked on ingest in exact decimal:
        `expectedCash = openingFloat + cashSalesTotal − cashRefundsTotal + payInTotal − payOutTotal`
        and `variance = countedCash − expectedCash`. `openingFloat` must equal
        the float recorded at open. If any of these does not hold, the answer
        is 422 `shift_cashup_inconsistent` and nothing is recorded. The
        server does not check `cashSalesTotal`, `payInTotal`, `payOutTotal`
        or `saleCount` against the sales and movements it has recorded: a
        movement or a sale can still be on its way, or dead-lettered. That
        comparison is a read-side flag (RT-18), never a block.
        `cashRefundsTotal` is the exception from the F-3 runtime: it is
        checked against the settled refund executions (see below, R-9).


        **Refund references.** `cashRefundReturnRefs` names the returns whose
        cash refund was paid from this drawer during the shift. Each must be a
        return of the caller's tenant and store with a cash refund tender, and
        not already claimed by another shift's close, else 422
        `refund_ref_invalid` (the same answer for an unknown, foreign or
        already-claimed ref). A ref whose refund was paid in a currency other
        than the shift's is 422 `currency_mismatch`.


        **Refund cross-check** (RT-271 R-9, RT-490; normative from the F-3
        runtime). Only a settled cash refund execution (`pos-sales/sales.yaml`
        `recordRefundExecution`) moves cash out of the drawer for a return;
        accepting the return does not (R-1). The rule covers returns
        recorded through `recordReturn`. A credit-sale return
        (`recordCreditSaleReversal`) is outside RT-490: it has no executions,
        so it is not checked against them, and its cash refund counts at its
        recorded refund tenders, as before RT-490. So, after the
        refund-reference checks above:
        1. every claimed `recordReturn` return with a non-zero
           `returnTotal` must be fully SETTLED in this shift: its settled
           cash executions whose `evidence.shiftRef` is this shift's
           `shiftId` sum to its `returnTotal` (its refund obligation is
           `settled`), else 422 `refund_ref_unsettled` (one answer for every
           such ref, naming none). A partly paid return cannot be claimed:
           because every execution of a return carries the same `shiftRef`,
           a payout recorded after the close would otherwise be left out of
           every close. Once claimed, the return is settled, so a further
           execution for it is refused (422
           `refund_execution_exceeds_allocation`). A zero-total return owes
           nothing, has no execution and is exempt;
        2. `cashRefundsTotal` must equal, in exact decimal, the sum of the
           amounts of the settled cash executions of the claimed
           `recordReturn` returns whose `evidence.shiftRef` is this shift,
           plus the recorded cash refund tenders of the claimed credit-sale
           returns, else 422 `cash_refunds_total_mismatch`.
        A settled execution recorded with this shift's `shiftRef` for a
        return the close does not claim is not counted and does not block
        the close (a read-side flag, RT-18). Every execution of one return
        carries the same `shiftRef` (`recordRefundExecution`), so a return is
        never split across two closes.
        ORDERING (normative for the POS, F-5): executions and closes travel
        on different POS outboxes, so the POS MUST NOT send a shift's close
        until every refund execution it recorded with that shift's `shiftId`
        has been acknowledged (201 or a replay). With that rule, both 422s
        are deterministic, like every other 422 here: they mean the close and
        the executions disagree, and the POS dead-letters the close for
        repair instead of retrying it. A replay of a close recorded before
        F-3 is never re-checked.


        **Forced close.** `closeKind: forced` closes a shift the cashier could
        not close (a stuck shift) and requires `forcedReason`. Forced close is
        manager-envelope only: it is accepted on the `operatorAuthorization`
        path only, and a forced close sent with the `device` scheme is the
        generic 403 `refused`. This close is for the terminal that holds the
        drawer's cash-up. A stuck shift opened on ANOTHER terminal is 404
        `shift_not_found` here, as for any shift outside this device; a
        manager clears it with `forceCloseShift` (RT-742), which records no
        cash-up.


        **Variance approval.** `varianceApprovedByUserId` is the manager who
        approved the variance on the terminal. The POS asks for a manager PIN
        according to the shift variance policy frozen on the shift's open
        (RT-384, AD-CASH-001 K-2): under a frozen `limit`, when `|variance| >
        limitAmount`; under `none`, the System default, never. A shift opened
        before the upgrade applies no limit. The server records the approver
        and re-checks that user's manager role for the persisted
        `approverCheck`, but never refuses the close because of that role or
        of the policy. It must name a user of the caller's tenant, else 400
        `validation_error`.


        From RT-387 the close response's `close` carries
        `approvalRequiredByPolicy` and `approvalMissing`, derived from the
        frozen open value (`unknown` for an open with no policy fields), and
        the persisted `approverCheck`.


        Attribution: on the device path `closingUserId` MUST equal the
        verified `operatorUserId`, else 403 `refused`. On the envelope path
        the envelope operator is the actor and `closingUserId` is recorded as
        stated; it must be a user of the caller's tenant with access to the
        store, else 403 `refused`.


        Re-sending the same close (same payload) is a replay. A different
        close for a shift that is already closed is 409
        `shift_payload_conflict`. A shift of this device that a manager closed
        with `forceCloseShift` (RT-742) takes no close: it is 409
        `shift_force_closed` and nothing is recorded, whatever the payload. A
        shift that does not resolve to this device, force-closed or not, is
        the non-disclosing 404 `shift_not_found`; the new code never reaches
        another device.
      parameters:
        - $ref: "#/components/parameters/PosBuildCommit"
        - $ref: "#/components/parameters/PosAppVersion"
        - $ref: "#/components/parameters/PosContractPin"
        - $ref: "#/components/parameters/ShiftId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseShiftRequest"
            examples:
              normal:
                summary: A normal close, 5 EGP short, approved by a manager (device path).
                value:
                  closedAt: "2026-10-05T16:00:00Z"
                  closingUserId: "0190f5a2-3b4c-7d8e-9f01-23456789abcd"
                  closeKind: normal
                  openingFloat: "500.00"
                  cashSalesTotal: "2450.00"
                  cashRefundsTotal: "75.00"
                  payInTotal: "0.00"
                  payOutTotal: "120.00"
                  expectedCash: "2755.00"
                  countedCash: "2750.00"
                  variance: "-5.00"
                  saleCount: 37
                  cashRefundReturnRefs:
                    - "0192f5a2-3b4c-7d8e-9f01-23456789ab03"
                  varianceApprovedByUserId: "0190f5a2-3b4c-7d8e-9f01-23456789abce"
                  operatorUserId: "0190f5a2-3b4c-7d8e-9f01-23456789abcd"
              forced:
                summary: A forced close by a manager (envelope path only).
                value:
                  closedAt: "2026-10-06T09:10:00Z"
                  closingUserId: "0190f5a2-3b4c-7d8e-9f01-23456789abce"
                  closeKind: forced
                  forcedReason: Cashier left without closing; drawer counted by manager
                  openingFloat: "500.00"
                  cashSalesTotal: "0.00"
                  cashRefundsTotal: "0.00"
                  payInTotal: "0.00"
                  payOutTotal: "0.00"
                  expectedCash: "500.00"
                  countedCash: "500.00"
                  variance: "0.00"
                  saleCount: 0
                  cashRefundReturnRefs: []
      responses:
        "200":
          description: >
            Replay. Either the same `Idempotency-Key` again (the stored
            response with its stored status, RT-82 K4) or the same close
            re-delivered under another key (`200` with the shift's
            projection). Both carry `Idempotent-Replayed: true`.
          headers:
            X-Device-Token-Rotate-After:
              $ref: "#/components/headers/DeviceTokenRotateAfter"
            X-Device-Token-Rotate-Stage:
              $ref: "#/components/headers/DeviceTokenRotateStage"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
              examples:
                closed:
                  $ref: "#/components/examples/ShiftClosed"
        "201":
          description: >
            Shift closed for the first time. A retry with the same
            `Idempotency-Key` replays this stored `201` with
            `Idempotent-Replayed: true`.
          headers:
            X-Device-Token-Rotate-After:
              $ref: "#/components/headers/DeviceTokenRotateAfter"
            X-Device-Token-Rotate-Stage:
              $ref: "#/components/headers/DeviceTokenRotateStage"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
              examples:
                closed:
                  $ref: "#/components/examples/ShiftClosed"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Refused"
        "404":
          $ref: "#/components/responses/ShiftNotFound"
        "409":
          $ref: "#/components/responses/CloseShiftConflict"
        "422":
          $ref: "#/components/responses/CloseShiftUnprocessable"
        "425":
          $ref: "#/components/responses/IdempotencyInProgress"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"
  /api/pos/v1/shifts/{shift_id}/forced-close:
    post:
      summary: Force-close a stuck shift of this store from any terminal, as not counted.
      operationId: forceCloseShift
      x-idempotency: required
      x-runtime-status: contract-only
      x-runtime-note: >
        RT-742 contract (RT-554 follow-up). The runtime, and the storage for
        the force-closed fact, ship in a separate ticket on its own [GATED]
        migration.
      tags: [pos-shifts]
      security:
        - operatorAuthorization: []
      description: >
        A manager clears a STUCK shift from any terminal of the same tenant
        and store, without the drawer's cash-up. Terminal B can close a shift
        opened on terminal A; `closeShift` cannot (it resolves `shift_id` only
        on the caller's own device, and needs the cash-up totals only the
        opening terminal holds). RT-554 owner decision, 2026-10-19.


        **Authentication.** The `operatorAuthorization` envelope only; the
        `device` scheme is not accepted (a device token is the generic 401).
        The envelope operator is the actor; the body carries no user id. The
        envelope's live re-check on every request (membership, device, store
        access, expiry and role: the `operatorAuthorization` scheme) is the
        generic 401. The role rule is the manager and admin surface of
        `GET /shifts/stuck`: only `owner`, `tenant_admin` and `store_manager`
        pass, so a `store_staff` operator, an operator demoted since sign-in,
        and a manager whose store access was removed are all the generic 401.
        The operation has no 403: no failure reaches it past that check.
        Tenant and store come only from the envelope, never the request
        (Constitution §II, §XII).


        **Scope.** `shift_id` resolves to a shift of the envelope's tenant and
        store, opened on ANY device of that store, including the caller's own.
        Another store, another tenant and an unknown id are the same
        non-disclosing 404 `shift_not_found`.


        **Eligibility** (its own predicate, evaluated at the call). The shift
        is open, was opened longer ago than the staleness threshold, and its
        opening cashier has no active `pos_operator` session on the store
        other than the caller's own envelope session. Otherwise 409
        `shift_not_stuck`: a manager cannot close a live drawer from another
        terminal. This is the `GET /shifts/stuck` predicate with ONE
        difference: that list counts every active session, the caller's
        included, so it hides a shift whose opening cashier is the manager
        now signed in on another terminal (their fresh session makes the
        drawer look live), while this operation does not. That shift is
        eligible here but not listed: `GET /shifts/stuck` is unchanged and
        does not surface it, so the manager supplies its `shift_id` (their
        own shift). Widening the list is a separate owner decision. A shift
        already closed with a cash-up is 409 `shift_closed`.


        **What it records.** One immutable fact: the closing manager (the
        envelope operator), the server clock as `closedAt`, the terminal the
        request came from, the terminal that opened the shift, and
        `forcedReason`. It records NO cash-up: `cashCount` is `not_counted`,
        and there is no `countedCash`, `expectedCash`, `variance` or other
        total. The server never computes or rewrites a POS cash-up
        (Constitution §III), and the manager's terminal does not hold it.
        This is not a `ShiftClose`: it is never returned by `closeShift`,
        `openShift` or the console reads of recorded cash-ups. When the drawer
        was counted, close the shift on the terminal that holds it with
        `closeShift`, `closeKind: forced`, which records the count.


        **Effect.** The shift is no longer open: `GET /shifts/stuck` stops
        listing it, the store timezone change is no longer refused for it
        (409 `STORE_HAS_OPEN_SHIFT`, RT-544), and its terminal may open a new
        shift. Nothing already recorded for it is edited or deleted: its
        movements, and the sales and refund executions of its terminal, stay
        as recorded. A refund execution whose `evidence.shiftRef` is this
        shift is claimed by no close.


        **Not counted** (normative). The recorded fact is not a counted zero:
        it has no `countedCash`, `expectedCash`, `variance`, total or
        `saleCount` at all, never `"0.00"`, so no reader can mistake it for a
        drawer that balanced. It is EXCLUDED from every variance flag (the
        RT-384 `approvalRequiredByPolicy`, `approvalMissing` and
        `approverCheck`, which exist only on a `ShiftClose`) and from the
        console reads of recorded cash-ups. It is also outside the R-9 cash
        refund cross-check (`closeShift`, Refund cross-check): no close exists
        for the shift, so no return is claimed, `cashRefundsTotal` is not
        checked, and a cash refund execution whose `evidence.shiftRef` is this
        shift stays settled by its execution alone and is claimed by no close.


        **Late facts** (POS-visible, normative for the POS). The opening
        terminal does not know yet. For this shift every later `closeShift`
        from the device that holds it (any payload) and every `openShift`
        re-delivery under another `Idempotency-Key` is 409
        `shift_force_closed`; nothing is recorded. Any other device still gets
        the non-disclosing 404 `shift_not_found` on `closeShift`, as for any
        shift outside its device, so the code is no oracle for another
        terminal. An `openShift` re-delivered under the SAME key gets the
        stored open response (the shared interceptor answers it before the
        handler), not this code. A later NEW
        `recordCashMovement` keeps the existing 409 `shift_closed` (a
        movement recorded BEFORE the force close still replays as `200`). The
        POS treats `shift_force_closed` as final for that shift, not as a
        transient or a payload conflict (`shift_payload_conflict`): it stops
        sending that shift's facts and shows that a manager closed it. A POS
        change to do so is a separate ticket.


        **Idempotency.** `Idempotency-Key` is REQUIRED, scoped to the verified
        actor as on every shift write. The natural key is `shift_id` with the
        payload hash of `forcedReason`, never the actor: the same force close
        sent again under another key, even by another manager, is a `200`
        replay of the recorded fact. A different `forcedReason` for a shift
        already force-closed is 409 `shift_force_closed`.


        **Order.** Authentication, including the live manager/admin check
        (401), then scope (404 `shift_not_found`), then the
        natural-key replay (`200`) or, for a different `forcedReason`, 409
        `shift_force_closed`, then 409 `shift_closed`, then the stuck rule
        (409 `shift_not_stuck`). A same-key replay is answered by the shared
        `IdempotencyInterceptor` before the handler. A replay of a recorded
        force close is never answered `shift_not_stuck`.


        **Audit.** One audit event records the closing manager, the terminal
        the request came from, the terminal that opened the shift and the
        shift. The reason is stored with the fact and never logged.
      parameters:
        - $ref: "#/components/parameters/StoreShiftId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForceCloseShiftRequest"
            examples:
              forced:
                summary: A manager on terminal B clears a shift stuck on terminal A.
                value:
                  forcedReason: Cashier left without closing; shift opened on till A
      responses:
        "200":
          description: >
            Replay. Either the same `Idempotency-Key` again (the stored
            response with its stored status, RT-82 K4) or the same force
            close re-delivered under another key (`200` with the recorded
            projection). Both carry `Idempotent-Replayed: true`.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForceClosedShift"
              examples:
                forced:
                  $ref: "#/components/examples/ForceClosedShiftExample"
        "201":
          description: >
            Shift force-closed for the first time. A retry with the same
            `Idempotency-Key` replays this stored `201` with
            `Idempotent-Replayed: true`.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForceClosedShift"
              examples:
                forced:
                  $ref: "#/components/examples/ForceClosedShiftExample"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ShiftNotFoundInStore"
        "409":
          $ref: "#/components/responses/ForceCloseShiftConflict"
        "425":
          $ref: "#/components/responses/IdempotencyInProgress"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"
components:
  securitySchemes:
    # `operator-identity` is the role-named provider-identity scheme
    # (spec 030 / 028 DOC-1), replacing the provider-named `clerkJwt` key.
    # Identity proof only — NOT business authorization (028 §6 CM-1).
    operator-identity:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Provider-identity JWT (spec 030 / 028 §6 CM-1), presented as
        `Authorization: Bearer <jwt>`. Identity proof / sign-in evidence ONLY —
        it is NOT business authorization; role eligibility (manager / admin) is
        enforced server-side. The provider is Clerk today, named only as the
        current implementation; the scheme name is provider-neutral. Verified at
        the API edge; fail-closed. The token is not propagated past the verifier.
    # RT-17: the two schemes of `captureSale` (pos-sales/sales.yaml, RT-224),
    # copied because the contracts are loaded per file. Same type, scheme and
    # format; the contract test pins that they stay in step.
    operatorAuthorization:
      type: http
      scheme: bearer
      description: >
        The operator-authorization ENVELOPE (031 D1+D2), as on
        `pos-sales/sales.yaml`: an opaque, revocable, DP-2-issued
        `pos_operator` bearer presented as `Authorization: Bearer <envelope>`,
        minted at operator sign-in. An authorization credential, not an
        identity proof (it is not the identity-proof-only `operator-identity`
        JWT used by `GET /shifts/stuck`). The backend re-evaluates the full
        operator predicate (membership, device, store access, role, expiry)
        live on every request; its bound `(tenant_id, store_id, device_id,
        user_id)` supply the scope and the actor. Every refusal is the same
        generic 401. `bearerFormat` is omitted: the envelope is not a JWT.
    device:
      type: http
      scheme: bearer
      description: >
        RT-224 / RT-17: the paired terminal's opaque `devices` pairing token,
        presented as `Authorization: Bearer <device_token>` (the role-named
        scheme of `catalog/read-down.yaml`, `pos-cashier-admissions` and
        `captureSale`; NOT a JWT, so `bearerFormat` is omitted). Accepted on
        the cash-up operations only together with `operatorUserId` in the
        body: the device token is device-scoped and never proves who made a
        change. The device row supplies the authoritative `(tenant_id,
        store_id, device_id)`; the server then requires a covering cashier
        admission of that device, store and user, and re-checks the cashier
        live. A missing, invalid or revoked device token is the generic 401; a
        refused cashier claim from a valid device is the generic 403
        `refused`.
  schemas:
    StuckShift:
      type: object
      required:
        - shift_id
        - cashier_display_name
        - terminal_label
        - opened_at
        - duration_minutes
      properties:
        shift_id:
          type: string
          format: uuid
          description: Primary key of the shift row.
          example: "018f1234-0000-7000-8000-000000000001"
        cashier_display_name:
          type: string
          description: Display name of the operator who opened the shift.
          example: "Jane Smith"
        terminal_label:
          type: string
          description: Human-readable label of the terminal that opened the shift.
          example: "till-A"
        opened_at:
          type: string
          format: date-time
          description: ISO-8601 timestamp when the shift was opened.
          example: "2024-01-15T08:00:00Z"
        duration_minutes:
          type: integer
          minimum: 0
          description: >
            Minutes elapsed since the shift was opened, computed
            server-side at query time.
          example: 42
    StuckShiftsResponse:
      type: object
      required:
        - kind
        - shifts
      properties:
        kind:
          type: string
          enum: ["ok"]
        shifts:
          type: array
          items:
            $ref: "#/components/schemas/StuckShift"
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - request_id
          properties:
            code:
              type: string
              example: unauthorized
            message:
              type: string
              example: Unauthorized
            request_id:
              type: string
              nullable: true
              example: "018f1234-0000-7000-8000-000000000099"

    # -----------------------------------------------------------------------
    # RT-17 cash-up: money (the pos-sales/sales.yaml shapes; no float)
    # -----------------------------------------------------------------------
    NonNegativeDecimalAmount:
      type: string
      pattern: '^[0-9]{1,15}(\.[0-9]{1,4})?$'
      description: >
        Exact-decimal amount as a string, never negative (the
        `pos-sales/sales.yaml` component). At most 4 fractional digits on the
        wire (`numeric(19,4)` at rest), and at most the shift currency's
        ISO-4217 minor unit, else 400 `validation_error`.
    PositiveDecimalAmount:
      description: >
        A `NonNegativeDecimalAmount` greater than zero: it must contain a
        non-zero digit, so `"0"` and `"0.00"` are refused.
      allOf:
        - $ref: "#/components/schemas/NonNegativeDecimalAmount"
        - type: string
          pattern: "[1-9]"
    SignedDecimalAmount:
      type: string
      pattern: '^-?[0-9]{1,15}(\.[0-9]{1,4})?$'
      description: >
        Exact-decimal amount as a string that may be negative (the
        `pos-sales/sales.yaml` `DecimalAmount` shape). Used for `variance`: a
        shortage is negative, an overage positive. At most the shift
        currency's ISO-4217 minor unit of fractional digits.
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      description: >
        ISO-4217 alphabetic currency code. A code with no ISO-4217 minor unit
        is 400 `validation_error`.
    # -----------------------------------------------------------------------
    # RT-17 cash-up: requests (strict; no tenant / store / device field)
    # -----------------------------------------------------------------------
    OpenShiftRequest:
      type: object
      additionalProperties: false
      required: [shiftId, openedAt, openingUserId, currencyCode, openingFloat]
      description: >
        The `ShiftOpened` fact. Tenant, store and device come from the
        credential and are rejected if present (strict body). RT-384: the
        optional `frozenPolicy` is accepted from RT-387 (see `openShift`).
      properties:
        frozenPolicy:
          $ref: "#/components/schemas/FrozenPolicy"
        shiftId:
          type: string
          format: uuid
          description: >
            A client-generated UUID (UUIDv7 preferred; UUIDv4 fallback)
            identifying the shift; the natural key of the open and of the
            close. Any RFC 4122 UUID is accepted (`format: uuid`).
        openedAt:
          type: string
          format: date-time
          description: >
            When the shift was opened, on the POS clock (RFC 3339). Provenance
            and the attribution time on the device path; may lag the server's
            receipt time arbitrarily for an offline open.
        openingUserId:
          type: string
          format: uuid
          description: The `users.id` of the cashier who opened the shift.
        currencyCode:
          $ref: "#/components/schemas/CurrencyCode"
        openingFloat:
          $ref: "#/components/schemas/NonNegativeDecimalAmount"
        operatorUserId:
          type: string
          format: uuid
          description: >
            RT-224 attribution: the `users.id` of the cashier making the
            change (the `user_id` of the cashier admission the terminal
            holds). REQUIRED with the `device` scheme and MUST be absent with
            `operatorAuthorization` (an envelope request that carries it is
            the generic 401). A claim, never trusted on its own: accepted only
            if a cashier admission of the device's tenant, store and device
            for this user covers the fact's time and the cashier is still
            eligible (see the info description), else the generic 403
            `refused`. Not part of the fact's payload hash.
    RecordCashMovementRequest:
      type: object
      additionalProperties: false
      required: [movementId, kind, amount, reasonCode, occurredAt]
      description: >
        The `CashMovement` fact. The amount is in the shift's currency; there
        is no currency field.
      properties:
        movementId:
          type: string
          format: uuid
          description: >
            A client-generated UUID (UUIDv7 preferred; UUIDv4 fallback); the
            movement's natural key. Any RFC 4122 UUID is accepted
            (`format: uuid`).
        kind:
          type: string
          enum: [pay_in, pay_out]
          description: >
            `pay_in` puts cash into the drawer; `pay_out` takes cash out of it.
        amount:
          $ref: "#/components/schemas/PositiveDecimalAmount"
        reasonCode:
          type: string
          enum: [bank_drop, float_top_up, petty_expense, other]
          description: >
            Why the cash moved. `bank_drop` (cash removed to the safe or bank)
            and `petty_expense` are normally pay-outs and `float_top_up` a
            pay-in; the server does not pair reason and kind.
        note:
          type: string
          minLength: 1
          maxLength: 200
          description: >
            Optional free text, 1 to 200 characters, with no PII: no
            customer name, phone, card or other personal data. Never logged.
        occurredAt:
          type: string
          format: date-time
          description: >
            When the cash moved, on the POS clock (RFC 3339). The attribution
            time on the device path.
        operatorUserId:
          type: string
          format: uuid
          description: >
            RT-224 attribution: the `users.id` of the cashier making the
            change (the `user_id` of the cashier admission the terminal
            holds). REQUIRED with the `device` scheme and MUST be absent with
            `operatorAuthorization` (an envelope request that carries it is
            the generic 401). A claim, never trusted on its own: accepted only
            if a cashier admission of the device's tenant, store and device
            for this user covers the fact's time and the cashier is still
            eligible (see the info description), else the generic 403
            `refused`. Not part of the fact's payload hash.
    CloseShiftRequest:
      type: object
      additionalProperties: false
      required:
        - closedAt
        - closingUserId
        - closeKind
        - openingFloat
        - cashSalesTotal
        - cashRefundsTotal
        - payInTotal
        - payOutTotal
        - expectedCash
        - countedCash
        - variance
        - saleCount
        - cashRefundReturnRefs
      if:
        properties:
          closeKind:
            const: forced
        required: [closeKind]
      then:
        required: [forcedReason]
      else:
        not:
          required: [forcedReason]
      description: >
        The `ShiftClosed` fact: the POS cash-up, recorded verbatim. All
        amounts are in the shift's currency.


        Arithmetic invariant, checked on ingest in exact decimal:
        `expectedCash = openingFloat + cashSalesTotal − cashRefundsTotal + payInTotal − payOutTotal`
        and `variance = countedCash − expectedCash`, with `openingFloat` equal
        to the float recorded at open; else 422 `shift_cashup_inconsistent`.
        `forcedReason` is required when `closeKind` is `forced` and must be
        absent otherwise.
      properties:
        closedAt:
          type: string
          format: date-time
          description: >
            When the shift was closed, on the POS clock (RFC 3339). The
            attribution time on the device path.
        closingUserId:
          type: string
          format: uuid
          description: >
            The `users.id` of the user who closed the shift; may differ from
            the opening user.
        closeKind:
          type: string
          enum: [normal, forced]
          description: >
            `normal`: the cashier counted and closed. `forced`: a manager
            closed a shift the cashier could not close. Forced close is
            manager-envelope only: accepted with `operatorAuthorization`, and
            the generic 403 `refused` with the `device` scheme.
        forcedReason:
          type: string
          minLength: 1
          maxLength: 200
          description: >
            Why the shift was force-closed. Required if and only if
            `closeKind` is `forced`. 1 to 200 characters. No PII. Never
            logged.
        openingFloat:
          $ref: "#/components/schemas/NonNegativeDecimalAmount"
        cashSalesTotal:
          $ref: "#/components/schemas/NonNegativeDecimalAmount"
        cashRefundsTotal:
          $ref: "#/components/schemas/NonNegativeDecimalAmount"
        payInTotal:
          $ref: "#/components/schemas/NonNegativeDecimalAmount"
        payOutTotal:
          $ref: "#/components/schemas/NonNegativeDecimalAmount"
        expectedCash:
          $ref: "#/components/schemas/NonNegativeDecimalAmount"
        countedCash:
          $ref: "#/components/schemas/NonNegativeDecimalAmount"
        variance:
          $ref: "#/components/schemas/SignedDecimalAmount"
        saleCount:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: >
            Number of sales the POS counted in the shift (this device,
            finalized inside the shift). Recorded as reported; at most
            2147483647 (a database integer).
        cashRefundReturnRefs:
          type: array
          uniqueItems: true
          maxItems: 1000
          items:
            type: string
            format: uuid
          description: >
            The returns whose cash refund was paid from this drawer during
            the shift (their server return references); may be empty, at
            most 1000. Ids are case-insensitive (normalised to lower case,
            so one return in two spellings is a duplicate, 400). Each
            must resolve to a return of the caller's tenant and store with a
            cash refund tender not claimed by another shift's close, else 422
            `refund_ref_invalid`; one refunded in another currency is 422
            `currency_mismatch`. From the F-3 runtime each non-zero
            `recordReturn` return must also be fully settled by cash refund
            executions in this shift (422 `refund_ref_unsettled`), and `cashRefundsTotal` must
            equal the sum of those executions plus the cash refund tenders of
            any claimed credit-sale return (422
            `cash_refunds_total_mismatch`); see `closeShift`, Refund
            cross-check (R-9).
        varianceApprovedByUserId:
          type: string
          format: uuid
          description: >
            The `users.id` of the manager who approved the variance on the
            terminal. Recorded. It must be a user of the caller's tenant (a
            membership of any state: the manager may have left since the
            offline close), else 400 `validation_error`; the manager role
            is re-checked for the read-side flag only, and never refuses the
            close.
        operatorUserId:
          type: string
          format: uuid
          description: >
            RT-224 attribution: the `users.id` of the cashier making the
            change (the `user_id` of the cashier admission the terminal
            holds). REQUIRED with the `device` scheme and MUST be absent with
            `operatorAuthorization` (an envelope request that carries it is
            the generic 401). A claim, never trusted on its own: accepted only
            if a cashier admission of the device's tenant, store and device
            for this user covers the fact's time and the cashier is still
            eligible (see the info description), else the generic 403
            `refused`. Not part of the fact's payload hash.

    # -----------------------------------------------------------------------
    # RT-17 cash-up: projections (explicit wire shapes, never DB rows)
    # -----------------------------------------------------------------------
    Shift:
      type: object
      additionalProperties: false
      required:
        [shiftId, status, currencyCode, openingFloat, openedAt, openingUserId, receivedAt]
      if:
        properties:
          status:
            const: closed
        required: [status]
      then:
        required: [close]
      else:
        not:
          required: [close]
      allOf:
        - $ref: "#/components/schemas/ShiftPolicyMatchesClose"
      description: >
        A cash-up shift as recorded. `close` is required when `status` is
        `closed` and absent when it is `open` (enforced by the schema).
        Internal ids (tenant, store, device) are never returned. RT-384: from
        RT-387, a shift whose open carried a `frozenPolicy` echoes it, with
        its `policyFlags`, as `frozenPolicy`; a shift whose open carried none
        has no `frozenPolicy`.
      properties:
        frozenPolicy:
          $ref: "#/components/schemas/RecordedFrozenPolicy"
        shiftId:
          type: string
          format: uuid
        status:
          type: string
          enum: [open, closed]
        currencyCode:
          $ref: "#/components/schemas/CurrencyCode"
        openingFloat:
          $ref: "#/components/schemas/NonNegativeDecimalAmount"
        openedAt:
          type: string
          format: date-time
        openingUserId:
          type: string
          format: uuid
        receivedAt:
          type: string
          format: date-time
          description: When the server recorded the open (server clock).
        close:
          $ref: "#/components/schemas/ShiftClose"
    ShiftClose:
      type: object
      additionalProperties: false
      allOf:
        - $ref: "#/components/schemas/ApproverCheckMatchesApprover"
        - $ref: "#/components/schemas/ApprovalMissingMatches"
      required:
        - closedAt
        - closingUserId
        - closeKind
        - openingFloat
        - cashSalesTotal
        - cashRefundsTotal
        - payInTotal
        - payOutTotal
        - expectedCash
        - countedCash
        - variance
        - saleCount
        - cashRefundReturnRefs
        - receivedAt
      if:
        properties:
          closeKind:
            const: forced
        required: [closeKind]
      then:
        required: [forcedReason]
      else:
        not:
          required: [forcedReason]
      description: >
        The recorded close, verbatim from the POS, plus the server's receipt
        time. As on `CloseShiftRequest`, `forcedReason` is required when
        `closeKind` is `forced` and absent when it is `normal` (enforced by
        the schema). `varianceApprovedByUserId` is present only when it was
        sent. RT-384: from RT-387 every close also carries
        `approvalRequiredByPolicy`, `approvalMissing` (both `unknown` for a
        shift whose open carried no frozen policy) and the persisted
        `approverCheck`; until then they are absent.
      properties:
        closedAt:
          type: string
          format: date-time
        closingUserId:
          type: string
          format: uuid
        closeKind:
          type: string
          enum: [normal, forced]
        forcedReason:
          type: string
          minLength: 1
          maxLength: 200
        openingFloat:
          $ref: "#/components/schemas/NonNegativeDecimalAmount"
        cashSalesTotal:
          $ref: "#/components/schemas/NonNegativeDecimalAmount"
        cashRefundsTotal:
          $ref: "#/components/schemas/NonNegativeDecimalAmount"
        payInTotal:
          $ref: "#/components/schemas/NonNegativeDecimalAmount"
        payOutTotal:
          $ref: "#/components/schemas/NonNegativeDecimalAmount"
        expectedCash:
          $ref: "#/components/schemas/NonNegativeDecimalAmount"
        countedCash:
          $ref: "#/components/schemas/NonNegativeDecimalAmount"
        variance:
          $ref: "#/components/schemas/SignedDecimalAmount"
        saleCount:
          type: integer
          minimum: 0
          maximum: 2147483647
        cashRefundReturnRefs:
          type: array
          uniqueItems: true
          maxItems: 1000
          items:
            type: string
            format: uuid
        varianceApprovedByUserId:
          type: string
          format: uuid
        receivedAt:
          type: string
          format: date-time
          description: When the server recorded the close (server clock).
        approvalRequiredByPolicy:
          $ref: "#/components/schemas/PolicyTriState"
        approvalMissing:
          $ref: "#/components/schemas/PolicyTriState"
        approverCheck:
          $ref: "#/components/schemas/ApproverCheck"

    # -----------------------------------------------------------------------
    # RT-384: the shift variance policy on the open and the close
    # (AD-CASH-001 D-1 / D-6 / D-7). Shared shapes with
    # `cash-variance-policy.openapi.yaml` and `shift-closes.openapi.yaml`;
    # the contract tests pin that the copies stay identical.
    # -----------------------------------------------------------------------
    CashVariancePolicyValue:
      type: object
      additionalProperties: false
      required: [mode]
      if:
        properties:
          mode:
            const: limit
        required: [mode]
      then:
        required: [limitAmount, currencyCode]
      else:
        not:
          anyOf:
            - required: [limitAmount]
            - required: [currencyCode]
      description: >
        The policy value (AD-CASH-001 D-1), as in
        `cash-variance-policy.openapi.yaml`. `none`: the cashier always closes
        alone. `limit`: approval is required exactly when `|variance| >
        limitAmount`. On an open it is the frozen value; its currency is not
        checked here (a `limit` currency other than the shift's is accepted
        and flagged `policy_value_mismatch`).
      properties:
        mode:
          type: string
          enum: [none, limit]
        limitAmount:
          $ref: "#/components/schemas/NonNegativeDecimalAmount"
        currencyCode:
          $ref: "#/components/schemas/CurrencyCode"
    ApprovalMissingMatches:
      description: >
        RT-384: when present, `approvalMissing` follows from
        `approvalRequiredByPolicy` and the recorded approver: `unknown` exactly
        when `approvalRequiredByPolicy` is `unknown`; `no` when approval was
        not required, or was required and an approver was recorded; `yes`
        when approval was required and no approver was recorded
        (no `varianceApprovedByUserId` key on this projection). The three
        RT-384 close fields (`approvalRequiredByPolicy`, `approvalMissing`,
        `approverCheck`) are all present or all absent; whether
        `approvalRequiredByPolicy` is `unknown` follows from the shift's
        `frozenPolicy` (`ShiftPolicyMatchesClose` on `Shift`).
      allOf:
        - if:
            anyOf:
              - required: [approvalRequiredByPolicy]
              - required: [approvalMissing]
              - required: [approverCheck]
          then:
            required: [approvalRequiredByPolicy, approvalMissing, approverCheck]
        - if:
            properties:
              approvalRequiredByPolicy:
                const: unknown
            required: [approvalRequiredByPolicy, approvalMissing]
          then:
            properties:
              approvalMissing:
                const: unknown
        - if:
            properties:
              approvalRequiredByPolicy:
                const: "no"
            required: [approvalRequiredByPolicy, approvalMissing]
          then:
            properties:
              approvalMissing:
                const: "no"
        - if:
            properties:
              approvalRequiredByPolicy:
                const: "yes"
              varianceApprovedByUserId:
                type: string
            required: [approvalRequiredByPolicy, approvalMissing, varianceApprovedByUserId]
          then:
            properties:
              approvalMissing:
                const: "no"
        - if:
            properties:
              approvalRequiredByPolicy:
                const: "yes"
            required: [approvalRequiredByPolicy, approvalMissing]
            not:
              required: [varianceApprovedByUserId]
          then:
            properties:
              approvalMissing:
                const: "yes"
    ShiftPolicyMatchesClose:
      description: >
        RT-384: a close's `approvalRequiredByPolicy` is `unknown` exactly when
        its shift carries no `frozenPolicy` (the open carried none), so a
        legacy close never reads as "no exception"; with a `frozenPolicy` it
        is `yes` or `no`.
      allOf:
        - if:
            required: [close]
            not:
              required: [frozenPolicy]
            properties:
              close:
                required: [approvalRequiredByPolicy]
          then:
            properties:
              close:
                properties:
                  approvalRequiredByPolicy:
                    const: unknown
        - if:
            required: [close, frozenPolicy]
            properties:
              close:
                required: [approvalRequiredByPolicy]
          then:
            properties:
              close:
                properties:
                  approvalRequiredByPolicy:
                    enum: ["yes", "no"]
    ApproverCheckMatchesApprover:
      description: >
        RT-384: when `approverCheck` is present it agrees with the recorded
        approver: `not_applicable` exactly when no `varianceApprovedByUserId`
        was recorded (the key is absent on this projection), and `verified` or
        `unverified` when one was.
      allOf:
        - if:
            not:
              required: [varianceApprovedByUserId]
            required: [approverCheck]
          then:
            properties:
              approverCheck:
                properties:
                  status:
                    const: not_applicable
        - if:
            required: [varianceApprovedByUserId, approverCheck]
          then:
            properties:
              approverCheck:
                properties:
                  status:
                    enum: [verified, unverified]
    FrozenPolicy:
      type: object
      additionalProperties: false
      required: [policySource, policyRevisionId, policyValue]
      if:
        properties:
          policySource:
            enum: [tenant, store]
        required: [policySource]
      then:
        properties:
          policyRevisionId:
            type: string
      else:
        properties:
          policyRevisionId:
            type: "null"
      description: >
        RT-384: the shift variance policy the POS froze at this open
        (AD-CASH-001 D-6). All three members are required, so the policy is
        all-or-none by construction. `policyRevisionId` is a uuid for source
        `tenant` or `store` and `null` for `system` or `fallback`; anything
        else is 400 `validation_error`. Every policy-ground mismatch is
        accepted and flagged, never refused (see `openShift`).
      properties:
        policySource:
          type: string
          enum: [system, tenant, store, fallback]
          description: >
            The `policySource` of the POS policy read, or `fallback` for a
            terminal that never fetched it (the fail-closed `limit 0`, DR-6).
        policyRevisionId:
          type: [string, "null"]
          format: uuid
          description: >
            The frozen revision id from the policy read. An id Backend-Core
            does not know is accepted and flagged `policy_revision_unknown`,
            never a 400.
        policyValue:
          $ref: "#/components/schemas/CashVariancePolicyValue"
    RecordedFrozenPolicy:
      type: object
      additionalProperties: false
      required: [policySource, policyRevisionId, policyValue, policyFlags]
      if:
        properties:
          policySource:
            enum: [tenant, store]
        required: [policySource]
      then:
        properties:
          policyRevisionId:
            type: string
      else:
        properties:
          policyRevisionId:
            type: "null"
      description: >
        RT-384, from RT-387: the `FrozenPolicy` recorded with the open, plus
        its accept-and-flag findings (AD-CASH-001 D-6; empty when none, never
        a refusal). All four members are always present together.
      properties:
        policySource:
          type: string
          enum: [system, tenant, store, fallback]
        policyRevisionId:
          type: [string, "null"]
          format: uuid
        policyValue:
          $ref: "#/components/schemas/CashVariancePolicyValue"
        policyFlags:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PolicyFlag"
    PolicyFlag:
      type: string
      enum: [policy_revision_unknown, policy_revision_superseded, policy_value_mismatch]
      description: >
        AD-CASH-001 D-6 accept-and-flag findings. `policy_revision_unknown`:
        the frozen revision is not a revision of this tenant, or is a store
        revision of another store. `policy_revision_superseded`: it was not
        the revision effective for this store at `openedAt`, beyond the RT-224
        120 s clock-skew tolerance (an offline open on an older cached
        revision, DR-8). `policy_value_mismatch`: the frozen value differs
        from that revision's stored value (for `system`, from Backend-Core's
        System default), or a `limit` currency differs from the shift's. A
        `fallback` value other than the fail-closed `limit 0` (DR-6) is also
        `policy_value_mismatch`.
    PolicyTriState:
      type: string
      enum: ["yes", "no", "unknown"]
      description: >
        A derived yes / no, or `unknown` when the shift's open carried no
        frozen policy (a pre-upgrade or pre-RT-384 shift). `unknown` is never
        "no exception".
    ApproverCheck:
      type: object
      additionalProperties: false
      required: [status, reason]
      if:
        properties:
          status:
            const: unverified
        required: [status]
      then:
        properties:
          reason:
            type: string
      else:
        properties:
          reason:
            type: "null"
      description: >
        The persisted server finding on the close's recorded approver
        (AD-CASH-001 D-7, K-4). `not_applicable`: no approver was recorded.
        `verified`: the approver held a manager role with store access and was
        not the closer when checked. `unverified` with a `reason` otherwise.
        It never refuses the close. The close transaction writes
        `not_applicable` (no approver) or the placeholder `unverified` /
        `check_unavailable`; the awaited post-commit check overwrites the
        placeholder, and a failed lookup or write keeps it. A replay reads the
        stored value and never re-runs the check; there is no `pending`.
        Closes recorded before RT-385 (coordinator decision 4): no approver →
        `not_applicable`; an approver recorded but never checked →
        `unverified` / `check_unavailable`.
      properties:
        status:
          type: string
          enum: [not_applicable, verified, unverified]
        reason:
          type: [string, "null"]
          enum:
            - approver_is_closer
            - inactive_membership
            - not_manager
            - no_store_access
            - check_unavailable
            - null
    CashMovement:
      type: object
      additionalProperties: false
      required:
        [movementId, shiftId, kind, amount, currencyCode, reasonCode, occurredAt, recordedByUserId, receivedAt]
      description: A recorded pay-in or pay-out.
      properties:
        movementId:
          type: string
          format: uuid
        shiftId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [pay_in, pay_out]
        amount:
          $ref: "#/components/schemas/PositiveDecimalAmount"
        currencyCode:
          $ref: "#/components/schemas/CurrencyCode"
        reasonCode:
          type: string
          enum: [bank_drop, float_top_up, petty_expense, other]
        note:
          type: string
          minLength: 1
          maxLength: 200
        occurredAt:
          type: string
          format: date-time
        recordedByUserId:
          type: string
          format: uuid
          description: >
            The verified actor: the `operatorUserId` on the device path, the
            envelope operator on the envelope path.
        receivedAt:
          type: string
          format: date-time
          description: When the server recorded the movement (server clock).

    # -----------------------------------------------------------------------
    # RT-742: manager forced close of a stuck shift from any terminal of the
    # store, recorded as NOT COUNTED. A separate fact: neither a request nor a
    # response here is a `CloseShiftRequest` or a `ShiftClose`.
    # -----------------------------------------------------------------------
    ForceCloseShiftRequest:
      type: object
      additionalProperties: false
      required: [forcedReason]
      description: >
        RT-742. The only input is the reason. The actor is the envelope
        operator, the time is the server clock, and tenant, store and device
        come from the credential; the body carries none of them and no cash-up
        total (a force close records none).
      properties:
        forcedReason:
          type: string
          minLength: 1
          maxLength: 200
          description: >
            Why the manager closed the shift from another terminal. 1 to 200
            characters. No PII. Never logged. Part of the natural-key payload
            hash.
    ForcedCloseRecord:
      type: object
      additionalProperties: false
      required:
        - closedByUserId
        - closedAt
        - closedFromTerminalLabel
        - openedOnTerminalLabel
        - forcedReason
        - cashCount
      description: >
        The recorded force close. No cash-up is recorded, so no counted cash,
        expected cash, variance or other total exists on it. No internal id
        (tenant, store, device) is returned; terminals are named by their
        human-readable label, as on `GET /shifts/stuck`.
      properties:
        closedByUserId:
          type: string
          format: uuid
          description: The `users.id` of the closing manager (the envelope operator).
        closedAt:
          type: string
          format: date-time
          description: When the server recorded the force close (server clock).
        closedFromTerminalLabel:
          type: [string, "null"]
          description: >
            Label of the terminal the force-close request came from; `null`
            when that terminal has no label (a device label is optional).
        openedOnTerminalLabel:
          type: [string, "null"]
          description: >
            Label of the terminal that opened the shift (the stuck list's
            `terminal_label`); `null` when it has no label. The same terminal
            as above when the manager closed it from the terminal that opened
            it.
        forcedReason:
          type: string
          minLength: 1
          maxLength: 200
        cashCount:
          type: string
          const: not_counted
          description: >
            Always `not_counted`: the drawer was not counted by this close,
            and the server derives no figure for it.
    ForceClosedShift:
      type: object
      additionalProperties: false
      required:
        - shiftId
        - status
        - currencyCode
        - openingFloat
        - openedAt
        - openingUserId
        - receivedAt
        - forcedClose
      description: >
        RT-742. A shift closed by a manager as not counted. It is NOT a
        `Shift`: `status` is `force_closed`, never `closed`, and it carries
        `forcedClose` where a closed `Shift` carries a `close` (a `ShiftClose`
        cash-up). Internal ids (tenant, store, device) are never returned.
      properties:
        shiftId:
          type: string
          format: uuid
        status:
          type: string
          const: force_closed
        currencyCode:
          $ref: "#/components/schemas/CurrencyCode"
        openingFloat:
          $ref: "#/components/schemas/NonNegativeDecimalAmount"
        openedAt:
          type: string
          format: date-time
        openingUserId:
          type: string
          format: uuid
        receivedAt:
          type: string
          format: date-time
          description: When the server recorded the open (server clock).
        forcedClose:
          $ref: "#/components/schemas/ForcedCloseRecord"

    # -----------------------------------------------------------------------
    # RT-17 cash-up: canonical error envelope (pos-sales/sales.yaml `Error`).
    # The legacy `Error` above stays as it is for GET /shifts/stuck.
    # -----------------------------------------------------------------------
    ApiError:
      type: object
      required: [error]
      description: >
        Canonical error envelope, the same shape as `Error` in
        `pos-sales/sales.yaml`, `auth.openapi.yaml` and `outbox.openapi.yaml`.
        `error.code` is one of the codes documented on each response.
        Refusals never enumerate their cause; it is logged server-side under
        `request_id`.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
              description: Human-readable summary. No sensitive data, no cause enumeration.
            request_id:
              type: string
              format: uuid
              description: Server-side correlation id; the actual cause is recorded server-side.

    IdempotencyInProgressBody:
      type: object
      additionalProperties: false
      required: [error, retryAfterSec]
      description: >
        The body the shared `IdempotencyInterceptor` writes on a 425, as it is
        today. It is NOT the `ApiError` envelope: `error` is the bare code
        string and `retryAfterSec` repeats the `Retry-After` header.
      properties:
        error:
          type: string
          const: idempotency_in_progress
        retryAfterSec:
          type: integer
          minimum: 1
          description: Seconds to wait before retrying (currently always 2).

  parameters:
    PosBuildCommit:
      name: X-POS-Build-Commit
      in: header
      required: false
      schema:
        type: string
        minLength: 40
        maxLength: 40
        pattern: "^[0-9a-f]{40}$"
      description: >
        RT-719. The POS git commit the running build was made from: exactly
        40 characters of `[0-9a-f]` (the full SHA-1). Optional. A request that
        sends no valid commit records the device's build as unknown; it is
        never refused or slowed for it. Recorded only from a request to this
        operation that authenticates with the device token. See "Build identity report
        (RT-719)" in `pos-terminal-pairing.openapi.yaml`.
    PosAppVersion:
      name: X-POS-App-Version
      in: header
      required: false
      schema:
        type: string
        minLength: 5
        maxLength: 32
        pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
      description: >
        RT-719. The POS semantic version: at most 32 characters of
        `[0-9A-Za-z.-]`, without build metadata. Optional: send it only when the build has a release
        version (POS has no signed release yet). Ignored without a valid
        `X-POS-Build-Commit`. See "Build identity report (RT-719)" in
        `pos-terminal-pairing.openapi.yaml`.
    PosContractPin:
      name: X-POS-Contract-Pin
      in: header
      required: false
      schema:
        type: string
        minLength: 40
        maxLength: 40
        pattern: "^[0-9a-f]{40}$"
      description: >
        RT-719. The Backend-Core commit in the build's
        `contracts/backend-core/PIN` (the `commit` line): exactly 40
        characters of `[0-9a-f]`. Optional. Ignored without a valid `X-POS-Build-Commit`.
        See "Build identity report (RT-719)" in
        `pos-terminal-pairing.openapi.yaml`.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[\\x21-\\x7E]{16,128}$"
      description: >
        REQUIRED on every cash-up write. 16 to 128 printable ASCII characters
        with no whitespace, as the `IdempotencyInterceptor` enforces (RT-181,
        the `pos-sales/sales.yaml` rule); any other value is a 400. Keyed on
        `(method, route template, resolved path parameters, clientId = the
        verified actor's user id, key)` (RT-82 K1), so the same key on a
        different `shift_id` is a separate operation. An identical retry
        replays the stored response with its stored status and
        `Idempotent-Replayed: true`; key reuse with a different payload is 409
        `idempotency_key_conflict`; a key whose first request is still being
        processed is 425 `idempotency_in_progress`. A missing key is 400
        `idempotency_key_required`, a malformed one 400
        `idempotency_key_malformed`. No new idempotency primitive.
    ShiftId:
      name: shift_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: >
        The client-generated `shiftId` given to `openShift`. Resolves only to a
        shift of the caller's tenant, store and device; anything else is the
        non-disclosing 404 `shift_not_found`.
    StoreShiftId:
      name: shift_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: >
        RT-742. The `shiftId` of the shift to force-close. Resolves to a shift
        of the envelope's tenant and store opened on ANY device of that store
        (the `shift_id` that `GET /shifts/stuck` lists); anything else is the
        non-disclosing 404 `shift_not_found`.

  headers:
    DeviceTokenRotateAfter:
      description: >
        RT-639. Present only when this device credential has 15 days or less
        left: the ISO-8601 instant `expires_at - 15 days` (the same instant as
        `rotate_after` in the `posRotateTerminalToken` response). The terminal
        rotates at or after it. Absent while more than 15 days remain. Never
        carries token material. See `pos-terminal-pairing.openapi.yaml`,
        "Credential rotation".
      required: false
      schema:
        type: string
        format: date-time
    DeviceTokenRotateStage:
      description: >
        RT-639. Sent with `X-Device-Token-Rotate-After`: `notice` (15 days or
        less left), `warning` (10 or less), `urgent` (3 or less, or already
        past `expires_at`). The server keeps no per-device state, so it sends
        the stage on every response while it holds; the terminal shows each
        stage the first time it sees it.
      required: false
      schema:
        type: string
        enum: [notice, warning, urgent]
    IdempotentReplayed:
      description: >
        Present and `true` on every idempotent-replay response: a natural-key
        replay (`200`) and a same-`Idempotency-Key` replay, which carries the
        stored status (normally `201`, RT-82 K4). Clients MUST detect a replay
        by this header, not by the status code. Absent on a first-time record.
      schema:
        type: boolean
    RetryAfter:
      description: >
        Seconds the caller should wait before retrying, on a 429 (ADR 0009).
        Clamped to [1, 300]. A POS client treats a 429 as TRANSIENT, not as a
        dead-letter.
      schema:
        type: integer
        minimum: 1
        maximum: 300
    RetryAfterInProgress:
      description: >
        Seconds to wait before retrying a 425 with the same `Idempotency-Key`
        and body (the `IdempotencyInterceptor` sends `2`).
      schema:
        type: integer
        minimum: 1

  examples:
    ShiftOpen:
      summary: An open shift.
      value:
        shiftId: "0192f5a2-3b4c-7d8e-9f01-23456789ab01"
        status: open
        currencyCode: EGP
        openingFloat: "500.00"
        openedAt: "2026-10-05T08:00:00Z"
        openingUserId: "0190f5a2-3b4c-7d8e-9f01-23456789abcd"
        receivedAt: "2026-10-05T08:00:02Z"
    ShiftClosed:
      summary: A closed shift with its cash-up.
      value:
        shiftId: "0192f5a2-3b4c-7d8e-9f01-23456789ab01"
        status: closed
        currencyCode: EGP
        openingFloat: "500.00"
        openedAt: "2026-10-05T08:00:00Z"
        openingUserId: "0190f5a2-3b4c-7d8e-9f01-23456789abcd"
        receivedAt: "2026-10-05T08:00:02Z"
        close:
          closedAt: "2026-10-05T16:00:00Z"
          closingUserId: "0190f5a2-3b4c-7d8e-9f01-23456789abcd"
          closeKind: normal
          openingFloat: "500.00"
          cashSalesTotal: "2450.00"
          cashRefundsTotal: "75.00"
          payInTotal: "0.00"
          payOutTotal: "120.00"
          expectedCash: "2755.00"
          countedCash: "2750.00"
          variance: "-5.00"
          saleCount: 37
          cashRefundReturnRefs:
            - "0192f5a2-3b4c-7d8e-9f01-23456789ab03"
          varianceApprovedByUserId: "0190f5a2-3b4c-7d8e-9f01-23456789abce"
          receivedAt: "2026-10-05T16:00:03Z"
    ForceClosedShiftExample:
      summary: A shift opened on till A, force-closed by a manager on till B.
      value:
        shiftId: "0192f5a2-3b4c-7d8e-9f01-23456789ab01"
        status: force_closed
        currencyCode: EGP
        openingFloat: "500.00"
        openedAt: "2026-10-05T08:00:00Z"
        openingUserId: "0190f5a2-3b4c-7d8e-9f01-23456789abcd"
        receivedAt: "2026-10-05T08:00:02Z"
        forcedClose:
          closedByUserId: "0190f5a2-3b4c-7d8e-9f01-23456789abce"
          closedAt: "2026-10-06T09:10:00Z"
          closedFromTerminalLabel: till-B
          openedOnTerminalLabel: till-A
          forcedReason: Cashier left without closing; shift opened on till A
          cashCount: not_counted
    CashMovementPayOut:
      summary: A recorded pay-out.
      value:
        movementId: "0192f5a2-3b4c-7d8e-9f01-23456789ab02"
        shiftId: "0192f5a2-3b4c-7d8e-9f01-23456789ab01"
        kind: pay_out
        amount: "120.00"
        currencyCode: EGP
        reasonCode: petty_expense
        note: Cleaning supplies
        occurredAt: "2026-10-05T11:30:00Z"
        recordedByUserId: "0190f5a2-3b4c-7d8e-9f01-23456789abcd"
        receivedAt: "2026-10-05T11:30:01Z"

  responses:
    ValidationFailure:
      description: >
        400 `validation_error`: a malformed body, an unknown key (strict
        body), a missing required field, a bad enum, uuid or date-time, an
        amount that is not an exact-decimal string or has more fractional
        digits than the shift currency's ISO-4217 minor unit, a currency with
        no ISO-4217 minor unit, a close's `varianceApprovedByUserId` that is
        not a user of the caller's tenant, or an invalid `shift_id`:
        `error.code` is `validation_error`. A missing `Idempotency-Key` is
        `idempotency_key_required` and one that is not 16 to 128 printable
        ASCII characters is `idempotency_key_malformed` (the
        `IdempotencyInterceptor`'s codes). Deterministic; nothing is recorded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: >
        Generic 401 `unauthorized`: a missing, invalid, revoked or expired
        envelope or device token, a failed live re-check of the envelope
        operator, or an envelope request that carries `operatorUserId`. The
        body does not distinguish the causes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Refused:
      description: >
        Generic 403 `refused`. The credential is valid but the change is not
        accepted from this caller: on the device path, no covering cashier
        admission, an ineligible cashier, a fact outside the admission window
        or beyond the dating caps, an unknown or foreign `operatorUserId`, an
        `openingUserId` / `closingUserId` that is not the verified
        `operatorUserId`, or a forced close; on the envelope path, an
        `openingUserId` / `closingUserId` that is not a user of the tenant
        with access to the store. One body for every cause, revealing neither
        existence nor cause; never a sign that the device was revoked (that
        is a 401). Mirrors `captureSale` and the cashier-admissions API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ShiftNotFound:
      description: >
        404 `shift_not_found`: `shift_id` does not resolve to a shift of the
        caller's tenant, store and device. Non-disclosing: identical for an
        unknown id and for a shift of another tenant, another store or
        another device (Constitution §II, §XII).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    OpenShiftConflict:
      description: >
        409 on `openShift`. `error.code` is one of:
        `idempotency_key_conflict` (the same `Idempotency-Key` reused with a
        different payload); `shift_payload_conflict` (this `shiftId` is
        already recorded with a different payload); `shift_already_open`
        (this device already has an open shift with another `shiftId`; close
        it first); `shift_force_closed` (RT-742: this `shiftId` is a shift a
        manager closed with `forceCloseShift`, re-delivered under another
        `Idempotency-Key`; final for that shift).
        Deterministic; nothing is recorded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    CashMovementConflict:
      description: >
        409 on `recordCashMovement`. `error.code` is one of:
        `idempotency_key_conflict` (the same `Idempotency-Key` reused with a
        different payload); `shift_payload_conflict` (this `movementId` is
        already recorded with a different payload or on another shift);
        `shift_closed` (the shift is closed, so a new movement cannot be
        added; this includes a shift a manager closed with `forceCloseShift`,
        RT-742). Deterministic; nothing is recorded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    CloseShiftConflict:
      description: >
        409 on `closeShift`. `error.code` is one of:
        `idempotency_key_conflict` (the same `Idempotency-Key` reused with a
        different payload); `shift_payload_conflict` (the shift is already
        closed with a different close; a shift closes once);
        `shift_force_closed` (RT-742: a manager closed this device's shift
        with `forceCloseShift`, so it takes no close; final for that shift,
        the POS dead-letters the close as already closed by a manager; a shift
        of another device is 404 `shift_not_found`, never this code).
        Deterministic; nothing is recorded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ShiftNotFoundInStore:
      description: >
        404 `shift_not_found` on `forceCloseShift`: `shift_id` does not
        resolve to a shift of the envelope's tenant and store. Any device of
        the store qualifies. Non-disclosing: identical for an unknown id and
        for a shift of another store or another tenant (Constitution §II,
        §XII).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ForceCloseShiftConflict:
      description: >
        409 on `forceCloseShift`. `error.code` is one of:
        `idempotency_key_conflict` (the same `Idempotency-Key` reused with a
        different payload); `shift_not_stuck` (the shift is open but is not
        stuck now: it is younger than the staleness threshold, or its opening
        cashier has an active `pos_operator` session on the store other than
        the caller's own);
        `shift_closed` (the shift is already closed with a cash-up);
        `shift_force_closed` (the shift is already force-closed with a
        different `forcedReason`). Deterministic; nothing is recorded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    CloseShiftUnprocessable:
      description: >
        422 on `closeShift`. `error.code` is one of:
        `shift_cashup_inconsistent` (the arithmetic invariant does not hold,
        or `openingFloat` is not the float recorded at open);
        `currency_mismatch` (a `cashRefundReturnRefs` return was refunded in
        a currency other than the shift's); `refund_ref_invalid` (a
        `cashRefundReturnRefs` entry is not a cash-refunded return of the
        caller's tenant and store, or is already claimed by another shift's
        close; the same answer for each case); from the F-3 runtime (RT-490,
        R-9) `refund_ref_unsettled` (a claimed non-zero `recordReturn`
        return is not fully settled by cash refund executions in this
        shift) and
        `cash_refunds_total_mismatch` (`cashRefundsTotal` is not the sum of
        the claimed returns' settled cash executions in this shift plus the
        claimed credit-sale returns' cash refund tenders). Order:
        `shift_cashup_inconsistent`, then `refund_ref_invalid` /
        `currency_mismatch`, then `refund_ref_unsettled`, then
        `cash_refunds_total_mismatch`. Deterministic; nothing is recorded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: >
        429: the per-device write rate limit (ADR 0009), keyed on the bound
        device as on `captureSale`. `error.code` is the limiter's
        `RATE_LIMITED`. The `Retry-After` header carries the back-off; the
        POS treats it as transient, not as a dead-letter.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    IdempotencyInProgress:
      description: >
        425 Too Early, `idempotency_in_progress`: the first request with this
        `Idempotency-Key` (same route, `shift_id` and verified actor) is still
        being processed. Nothing is recorded by this request. Retry after
        `Retry-After` seconds with the same key and body; the retry gets the
        stored response once the first request completes. Transient, never a
        dead-letter. The body is the interceptor's own shape
        (`IdempotencyInProgressBody`), not the `ApiError` envelope.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfterInProgress"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IdempotencyInProgressBody"
          examples:
            inProgress:
              value:
                error: idempotency_in_progress
                retryAfterSec: 2
    SystemFailure:
      description: >
        500: an unexpected server error. The cause is recorded server-side
        under `request_id` and is never returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
