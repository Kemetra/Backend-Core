openapi: 3.1.0
info:
  title: Data-Pulse-2 POS Terminal Pairing API
  version: "1.2.0-draft"
  description: >
    POS-Pulse 002-terminal-pairing + 008-sale-finalization-and-receipts
    terminal pairing surface. Defines the single unauthenticated
    operation that bootstraps the trust relationship between a POS
    terminal and the backend, and (RT-369) the device-authenticated
    rotation of the credential that pairing issued.


    **Posture (RT-369).** `1.2.0-draft` adds one operation,
    `posRotateTerminalToken` (`POST /api/pos/v1/terminals/rotate`), and
    its schemas. It is `[GATED]` contract-first and carries
    `x-runtime-status: contract-only` until the RT-369 runtime ships.
    Additive: `posPairTerminal` is unchanged on the wire. See
    "Credential rotation" below.


    `posPairTerminal` accepts a short-lived `pairing_code` and — on
    success — returns the new device's `device_token` (SECRET)
    plus the terminal's full tenant + store binding + display +
    operational config. The endpoint is the ONLY backend operation
    that runs without any credential (see the "Authentication
    boundary" note below for the full auth posture). The terminal MUST store
    the returned `device_token` in OS-level secret storage (Electron
    `safeStorage` / DPAPI on Windows) and MUST NEVER log or echo it
    to the renderer.


    **Why this is unauthenticated**: pairing IS the bootstrap step.
    The terminal has no token before this call; the `pairing_code`
    itself is the one-time-use credential. Each successful pair
    burns the code server-side (state transition `pending → used`),
    so a code cannot be replayed. Rate-limiting is per source IP
    + per `pairing_code` to defeat brute-force enumeration.


    **POS-Pulse-consumed fields (Constitution §IV + POS-Pulse FR-014
    + 008 plan §AD-12)**:
      - `device_token`: opaque bearer bound to this device identity.
        SECRET — stored exclusively via `safeStorage`; redacted in every
        log sink. It is not permanent: it stops authenticating at once
        when the device is revoked (`devices.openapi.yaml`, RT-365), and
        it carries an expiry (`expires_at`).
      - `tenant_id`, `branch_id`, `terminal_id`, `terminal_label`:
        populate the single-row `terminal_assignment` table at the
        terminal. Lifetime: until clear-pairing.
      - `expires_at`: the device credential's expiry (RT-138 L2, 90
        days), populated by Backend-Core since RT-367. Not enforced
        until RT-370 turns enforcement on; POS-Pulse v1 ignores it, and
        the rotation client (RT-373) rotates before it.
      - `branch_name`, `branch_address`, `tenant_tax_registration_id`:
        terminal-resident copies of branch + tenant detail used by the
        POS receipt template (008 AD-6). The terminal does NOT re-fetch
        these per sale — they are pinned at pair-time and read from
        the local `terminal_assignment` row when finalising sales.
        Egyptian Tax Authority e-invoicing rules require the
        tax-registration number on every fiscal receipt; the field is
        a string so the format can evolve (current ETA spec: 9-digit
        numeric, but the contract is intentionally permissive at the
        string level).
      - `printer_vendor_id`, `printer_product_id`, `printer_com_port`:
        terminal-resident printer config used by the POS print pipeline
        (008 AD-1 / Slice 3). The vendor + product IDs are USB
        identifiers in hex string form (e.g. `0x04B8` for Epson) and
        are ALWAYS required — every supported printer model in
        008 v1 is USB-connected (per docs/hardware-matrix.md, the
        committed pair is Epson TM-T20III + APG VBS320, both USB).
        The `printer_com_port` is an OPTIONAL additional field set
        ONLY when an RS-232 serial path is also available alongside
        the USB connection (some Epson models expose both); it is
        sent as `null` for USB-only printers. The contract enforces:
        `printer_vendor_id` non-null, `printer_product_id` non-null,
        `printer_com_port` nullable string. A "COM-port-only" terminal
        config is NOT permitted by this contract in 008 v1; pure-serial
        printer support would require a future contract revision.


    Authentication boundary: `posPairTerminal` is the ONLY backend operation
    callable without `clerkJwt` or any device-bound bearer
    (`posRotateTerminalToken` requires the device bearer). Every other
    POS operation authenticates a person (an operator credential), a
    device (the device bearer: every route that resolves a device by
    token), or both. Backend-Core enforces both a durable
    per-`pairing_code` attempt budget and a Redis-backed per-source-IP
    window before code lookup. Source IP is derived using the deployment's
    explicit trusted-proxy configuration per FR-9.


    Identity model (RT-367 / RT-287 F9): every successful pairing mints a
    NEW device identity — a new `terminal_id` (= `devices.id`) in the
    code's store. `terminal_id` survives credential rotation (RT-369), not
    re-pairing: re-pairing a terminal, replacing a broken one or moving one
    to another store always redeems a fresh code and gets a fresh
    `terminal_id`. A code issued to replace or move a device
    (`consoleIssuePairingCode` with `replacesDeviceId`) revokes the
    replaced device in the same transaction as the pairing (reason
    `replaced` / `moved`), so the old credential never stays live; the old
    device keeps its history under its old store.


    Idempotency model: the contract does NOT require an
    `Idempotency-Key` header. Each `pairing_code` is server-side
    single-use; replaying a successful pair with the same code
    returns 410 `EXPIRED_CODE` (the code was consumed) rather than
    a replayed device_token. This is the deliberate choice in
    POS-Pulse spec 002 — a terminal that loses its token MUST
    request a fresh pairing code from a tenant admin, not re-pair
    with the same code.


    PII / secret discipline (POS-Pulse Constitution §VII + FR-9):
    the `device_token` MUST NOT appear in any log sink, support
    bundle, response body of any other endpoint, or audit-event
    payload. It is sourced ONLY from this endpoint's success
    response and is consumed ONLY by the terminal's `safeStorage`.
    The `pairing_code` itself is similarly sensitive in transit;
    it never appears in logs or audit events.


    **Credential rotation (RT-369; RT-138 L4 / DL-4, owner-ratified
    2026-10-02 with the grace clarification; contract decisions
    coordinator-approved under owner delegation 2026-10-17).**
    `posRotateTerminalToken` replaces the device's token with a new one.
    The caller is the paired terminal, authenticated by its current device
    token (the `device` scheme); there is no operator credential and no
    request body. In one transaction, under the server clock (`now()`):

      - a new random 32-byte token is minted and returned ONCE; only its
        SHA-256 is stored (`devices.token_hash`), as at pairing;
      - `expires_at` becomes `now() + 90 days` (RT-138 L2);
      - `terminal_id` (`devices.id`), the tenant, the store and the label
        are unchanged: rotation keeps the device identity (RT-287 F9).
        Live operator sessions bound to the device and its pending pairing
        codes are not touched.

    The 200 also carries the hint `rotate_after = expires_at - 15 days`
    (RT-138 L4: rotate when fewer than 15 days remain). A server hint on
    the other device routes is deferred to RT-370.


    **Overlap (10 minutes).** The previous token keeps authenticating for
    10 minutes (`devices.previous_token_hash` /
    `devices.previous_valid_until`), so a lost response does not lock the
    till out: it retries the rotation with the previous token and a NEW
    `Idempotency-Key` inside the window. Inside the window every route that
    resolves a device by token accepts either the new token or the previous
    one, for the same device and scope (the previous hash is honoured only
    on a device that is not revoked). After `previous_valid_until` the
    previous token is refused like an unknown one. The ratified 10-minute
    overlap is never closed early.

    Which hash becomes the previous one:

      - the call presented the current token: the current hash becomes
        `previous_token_hash` and `previous_valid_until = now() + 10 minutes`;
      - the call presented the previous token inside its window (the retry
        after a lost response): the current hash (a token the client never
        received) is replaced and dropped; `previous_token_hash` and
        `previous_valid_until` stay as they are, so the window is never
        extended.

    So at most two tokens authenticate a device at any time: the newest one
    and the previous one inside its window. Two concurrent rotations that
    present the same current token are serialized by the device lock
    (below): the first takes the current-token branch; the second then finds
    that token in the previous hash, inside its window, so it SUCCEEDS
    through the previous-token branch and replaces the first one's new
    token. They never leave two new tokens valid, and a previous token can
    never extend its own life.

    **Trade-off (named).** A previous-token rotation replaces the current
    token; this is what makes a lost response recoverable. The cost: a
    leaked previous token can rotate the device within its 10-minute window
    and take the credential from the till that holds the newest token (that
    till then gets 401 and must re-pair). The window is the bound.

    **Client rules (RT-373).** A terminal keeps at most one rotation in
    flight; it never rotates with the previous token once it has stored a
    200 from a rotation (it uses the new token from then on); it rotates at
    or after `rotate_after`; and a terminal that does not know its
    credential's expiry (it paired before `expires_at` was returned, or lost
    it) rotates once on its first start with the rotation client, to learn
    it.


    **Expiry and the rotate-only grace (7 days).** A rotation is accepted
    while `now() < expires_at + 7 days`. A token whose device is past
    `expires_at` but not revoked may rotate during those 7 days; after
    them it is refused (401) and the till must be re-paired. A revoked
    device, and so a retired one (retire implies revoke), never gets a
    grace: its tokens are refused at once. This is the literal ratified L4
    rule; it is NOT gated on `DEVICE_TOKEN_EXPIRY_ENFORCED`. Until RT-370
    turns that flag on, this operation is the ONLY one that reads
    `expires_at`: every other device-authenticated route still accepts an
    expired token. With enforcement on (RT-370's contract), an expired
    token, in its grace or not, is refused on every other route, so during
    the grace a till can only rotate.

    **Fleet expiry cluster (RT-370 / RT-373 sequencing).** Migration 0040
    gave every device that existed then the same `expires_at` (its apply
    time + 90 days), so that fleet's rotate-only grace ends together, 97
    days after 0040 was applied. RT-373 tills must be live before that
    date, or RT-370 must re-baseline expiry before it; a till past the
    grace can only re-pair.


    **Concurrency.** The runtime takes the device lifecycle lock (RT-365,
    the advisory lock on tenant + device that revoke, retire and shift open
    take), then locks the device row, then re-checks under the lock that
    the presented token still matches the device's current hash or its
    in-window previous hash, and that the device is still not revoked, not
    retired and inside the grace. A revoke or retire that commits first
    wins (the rotation is 401); a rotation that commits first is followed
    by the revoke as usual, which voids both hashes. The token comparison
    under the lock is constant-time.


    **Rate limit.** A per-device rotation budget (the ADR 0009 per-device
    limiter, keyed on the authenticated device) bounds how often a device
    can rotate: over it, 429 `RATE_LIMITED` with `Retry-After` (seconds,
    `[1, 300]`), nothing changed, no audit row. It is checked after device
    authentication and before the idempotency checks, and it fails open if
    the limiter's store is unavailable (ADR 0009 D3).

    Refusals are bounded too. Before a refused rotation writes
    `pos.device.rotation_rejected`, a per-device refusal-audit budget is
    checked on the matched device (the row the presented token matched,
    revoked, retired or expired as it may be), and the refusal spends from
    it. That budget is separate from the rotation budget, so a refused
    token can never make a valid rotation 429: a stale previous token held
    by someone else cannot starve the live till's rotations. While budget
    remains, the row is written; once it is spent the refusal is still the
    same 401 but writes no audit row (a log line counts the suppressed
    refusals instead). So a holder of a refused token cannot write audit
    rows without bound.


    **Idempotency.** `Idempotency-Key` is required and non-replayable
    (RT-82 K3 / RT-155): the new token is never stored for replay. A retry
    with the same key from the same device does not rotate again and never
    returns a token; it is 409 `idempotency_key_conflict`. The key is
    scoped to the authenticated device (tenant + device), not shared by the
    tenant's other devices. A client that lost the 200 rotates again with a
    NEW key and the previous token, inside the window.


    **Audit (RT-135 catalogue; RT-138 L8).** Neither row ever carries a
    token, a token hash, an `Idempotency-Key` or a request header.

      - `pos.device.rotated`, in the rotation's transaction. Target
        `device` / the device id; no actor user (the device acted, as for
        `pos.device.paired`). Metadata allowlist: `credential` (`current` |
        `previous`: which token authenticated the call), `in_grace`
        (boolean: the device was past `expires_at`), `expires_at` (the new
        expiry) and `previous_valid_until`.
      - `pos.device.rotation_rejected`, in its own transaction, when a
        refused rotation presented a token that matches (or, before the
        lock, matched) a device row, within the refusal-audit budget above. The row never
        rides on a rotation that rolls back: a refusal under the lock
        changes nothing on the device and commits only this row, so a
        refusal under the lock still records its row. Target `device` / the
        device id; no actor user. Metadata allowlist:
        `reason`, one of `revoked`, `retired`, `grace_elapsed`,
        `previous_expired` (the token is the device's previous one and its
        window has closed) or `token_replaced` (under the lock the token is
        neither the current nor the previous one: another rotation replaced
        it meanwhile).

    A token that matches no device row has no tenant to record under and
    writes no row; neither does a device of an inactive tenant (RT-213),
    which is refused like an unknown token. The 400 / 409 / 425 / 429
    answers write no row.

servers:
  - url: https://api.example.com

tags:
  - name: pos-terminal-pairing
    description: >
      POS Terminal Pairing — the single unauthenticated bootstrap
      operation that establishes the terminal's `device_token`
      and tenant/branch/printer binding, and (RT-369) the
      device-authenticated rotation of that token.

paths:
  /api/pos/v1/terminals/pair:
    post:
      summary: Pair a POS terminal using a short-lived pairing code.
      operationId: posPairTerminal
      tags: [pos-terminal-pairing]
      security: []
      description: >
        Consume a one-time `pairing_code` (issued out-of-band through
        the Console's `consoleIssuePairingCode`, or the owner-run
        bootstrap CLI) and bind the requesting terminal to the tenant +
        branch the code was scoped to, as a NEW device identity. The
        success response carries the new device's `device_token` plus
        the terminal's full operational config.


        **Failure-response error codes** (closed set, mirrors POS-Pulse
        `src/main/pairing/failure-mapping.ts` switch keys):
        `INVALID_CODE`, `EXPIRED_CODE`, `ALREADY_PAIRED`,
        `BRANCH_MISMATCH`, `REPLACEMENT_BLOCKED`, `RATE_LIMITED`,
        `validation_failure`.


        **State transitions**: on success the `pairing_code` row
        transitions `pending → used` and a new `devices` row is
        created with the code's `terminal_id`; a subsequent call with
        the same code returns 410 `EXPIRED_CODE`. Re-pairing is a new
        code and a new identity (see "Identity model" above), never a
        re-use of a `terminal_id`. 409 `ALREADY_PAIRED` /
        `BRANCH_MISMATCH` mean a live device already exists for the
        code's `terminal_id` (under the code's branch / another
        branch); with server-generated terminal ids this is only a
        race of two codes for one terminal id, not a re-pair signal.
        Neither clears nor replaces the existing device.


        **Replacement codes** (RT-367): for a code that replaces or
        moves a device, the pairing re-checks the Cash Session rule on
        the replaced device under its lifecycle lock (RT-287 D-Q4). If
        the replaced device is still active and a shift has opened on
        it since the code was issued (or the device was retired), the
        pairing is refused with 409 `REPLACEMENT_BLOCKED`, nothing is
        changed and the code stays pending (close the shift on the old
        till, let it sync, and enter the code again before it
        expires). The response never says which shift or device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalPairRequest"
      responses:
        "200":
          description: >
            Pairing succeeded. Body carries the new device's
            `device_token` (SECRET) plus the full terminal binding.
            The token MUST be persisted in OS-level secret storage
            and MUST NEVER be logged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalPairResponse"
        "400":
          description: >
            Validation failure. `error.code = "validation_failure"`.
            The request body did not match `TerminalPairRequest`
            (e.g. missing `pairing_code`, malformed shape).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            Pairing code not found for any active tenant.
            `error.code = "INVALID_CODE"`. Cross-tenant probes share
            this non-disclosing response per Data-Pulse-2
            Constitution §XIV.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Conflict, nothing changed. `error.code` is one of:
            `ALREADY_PAIRED` / `BRANCH_MISMATCH` — a live device
            already exists for the code's `terminal_id` (under the
            code's branch / another branch); neither clears nor
            replaces it. `REPLACEMENT_BLOCKED` — the code replaces or
            moves a device that now has an open shift (or is retired);
            the code stays pending (see "Replacement codes" above).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: >
            The pairing code is no longer redeemable (already used,
            or admin-cancelled). `error.code = "EXPIRED_CODE"`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: >
            Rate-limit exceeded for this pairing code or source IP.
            `error.code = "RATE_LIMITED"`. The `Retry-After` header
            carries the recommended back-off in seconds.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
                maximum: 300
              description: >
                Seconds to wait before retrying. POS-Pulse clamps this
                value to `[1, 300]` defensively per the
                `network.ts` parsing rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/pos/v1/terminals/rotate:
    post:
      summary: Rotate the calling terminal's device token.
      operationId: posRotateTerminalToken
      tags: [pos-terminal-pairing]
      x-idempotency: required
      x-runtime-status: contract-only
      x-runtime-note: >
        RT-369 contract-first ([GATED]). The route ships with the RT-369
        runtime PR, which removes this marker.
      security:
        - device: []
      description: >
        Replace the calling device's token with a new one and push its
        expiry to `now() + 90 days`, keeping `terminal_id`. The previous
        token keeps authenticating for 10 minutes; a device past
        `expires_at` may still rotate for 7 days; a revoked or retired
        device never can. See "Credential rotation" above for the overlap,
        the grace, the lock and the audit rows.


        **Refusal order.** Checked in this order; the first that applies
        answers:

          1. 401 `unauthorized` — device authentication, before anything
             else: a missing or malformed bearer, an unknown token, the
             previous token after its window, a revoked or retired device,
             a device of an inactive tenant, or a device past
             `expires_at + 7 days`. One body for every case
             (non-disclosing); to the POS every 401 here means "re-pair"
             (RT-138 L6).
          2. 429 `RATE_LIMITED` — the device's rotation budget is spent
             (`Retry-After`).
          3. 400 `idempotency_key_required` / `idempotency_key_malformed`.
          4. 425 `idempotency_in_progress` — a request with this key is
             still running.
          5. 409 `idempotency_key_conflict` — the key already completed a
             rotation of this device (never replayed: no second rotation,
             no token).
          6. 401 `unauthorized` — the re-check under the device lock: the
             presented token no longer matches the device's current hash or
             its in-window previous hash (another rotation replaced it
             meanwhile), or a revoke or retire committed first. A concurrent
             rotation that presented the same current token is NOT refused
             here: it succeeds through the previous-token branch.
          7. 200 — rotated.


        No request body is read. Retry rules: after a 5xx or a lost
        response, retry with a NEW `Idempotency-Key`, presenting the token
        the client still holds (the previous one stays valid for 10
        minutes after a rotation it did not see).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: >
            Rotated. The body carries the new `device_token` ONCE (SECRET):
            the terminal replaces its stored token in OS secret storage
            before any other call, and never logs it. Never cached
            (`Cache-Control: no-store`, `Pragma: no-cache`).
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalRotateResponse"
        "400":
          description: >
            `idempotency_key_required` (no `Idempotency-Key`) or
            `idempotency_key_malformed` (not 16–128 printable ASCII
            characters without whitespace).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateError"
        "401":
          description: >
            `unauthorized`, non-disclosing (see the refusal order). The
            token cannot be rotated: re-pair the terminal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateError"
        "409":
          description: >
            `idempotency_key_conflict`: this device already used the key,
            for a rotation that completed (a same-key retry is never
            replayed, because the token is never stored) or for a different
            request. This request changed nothing and returns no token.
            Rotate again with a NEW key, presenting the token the client
            holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateError"
        "425":
          description: >
            Too Early: a request with this `Idempotency-Key` is still in
            progress. Do not retry with the same key: once that request
            completes, a same-key retry is 409. After `Retry-After`
            seconds, rotate with a NEW key and the token the client holds.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdempotencyInProgress"
        "429":
          description: >
            `RATE_LIMITED`: the device's rotation budget is spent (the ADR
            0009 per-device limiter). Nothing changed; no audit row. Retry
            after `Retry-After` seconds, as the pair 429.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
                maximum: 300
              description: Seconds to wait before retrying, clamped to `[1, 300]`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateError"
        "500":
          description: >
            `internal_error`: unexpected server error; nothing was rotated
            (the transaction rolled back). The cause is recorded
            server-side under `request_id`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateError"

components:
  securitySchemes:
    # The role-named POS device-credential scheme (spec 030 / 028 DOC-1 /
    # DOC-4), as in catalog/read-down.yaml and pos-cashier-admissions: the
    # paired terminal's opaque device token, NOT a JWT. Used by
    # posRotateTerminalToken only; posPairTerminal stays `security: []`.
    device:
      type: http
      scheme: bearer
      description: >
        Opaque, device-scoped bearer token (spec 030 / 028 §6 CM-2). The POS
        terminal presents its device token as
        `Authorization: Bearer <device_token>` (NOT a JWT), with no operator
        credential. The token is hashed and matched against a `devices` row:
        its current hash, or its previous hash while
        `previous_valid_until` is in the future (RT-369 overlap). The row
        supplies the tenant, store and device; the request never does.
        Fail-closed and non-disclosing: every refusal is the same 401.

  headers:
    CacheControlNoStore:
      description: >
        `no-store` on the rotate 200: the body carries the new device token,
        so no shared or client cache may keep it.
      schema:
        type: string
        const: no-store
    PragmaNoCache:
      description: >
        `no-cache`, for HTTP/1.0 caches, on the rotate 200 (with
        `Cache-Control: no-store`).
      schema:
        type: string
        const: no-cache

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[\\x21-\\x7E]{16,128}$"
      description: >
        Client-generated opaque token (UUIDv7 recommended), scoped to the
        authenticated device. Missing → 400 `idempotency_key_required`;
        malformed → 400 `idempotency_key_malformed`. Non-replayable (RT-82
        K3): the new token is never stored, so a retry with the same key
        never rotates again and never returns a token; it is 409
        `idempotency_key_conflict`. A request still in progress under the
        key is 425. Never retry with the same key.

  schemas:
    TerminalRotateResponse:
      type: object
      additionalProperties: false
      description: >
        Successful rotation. `device_token` is a SECRET, returned once.
      required:
        - device_token
        - terminal_id
        - expires_at
        - rotate_after
      properties:
        device_token:
          type: string
          minLength: 32
          maxLength: 512
          description: >
            The new opaque device token (32 random bytes, base64url). It
            replaces the stored token. SECRET — stored exclusively via
            `safeStorage` (DPAPI on Windows); never logged, never in an
            audit payload, support bundle or any other response.
        terminal_id:
          type: string
          format: uuid
          description: >
            The device identity (`devices.id`), unchanged by rotation.
        expires_at:
          type: string
          format: date-time
          description: >
            The new credential expiry: `now() + 90 days` at the rotation
            (server clock).
        rotate_after:
          type: string
          format: date-time
          description: >
            The rotation hint (RT-138 L4): `expires_at - 15 days`. The
            terminal rotates again at or after this instant, i.e. once fewer
            than 15 days remain.

    RotateError:
      type: object
      additionalProperties: false
      required:
        - error
      description: >
        The canonical error envelope for `posRotateTerminalToken`. Its own
        closed `error.code` set; the pairing `Error` codes do not apply.
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              enum:
                - unauthorized
                - idempotency_key_required
                - idempotency_key_malformed
                - idempotency_key_conflict
                - RATE_LIMITED
                - internal_error
            message:
              type: string
              description: Human-readable summary; no sensitive data.
            request_id:
              type: string
              format: uuid
              nullable: true
              description: Server-assigned correlation id.

    IdempotencyInProgress:
      type: object
      additionalProperties: false
      required: [error, retryAfterSec]
      description: >
        The platform idempotency interceptor's 425 body (not the canonical
        envelope).
      properties:
        error:
          type: string
          enum: [idempotency_in_progress]
        retryAfterSec:
          type: integer
          minimum: 1

    TerminalPairRequest:
      type: object
      additionalProperties: false
      required:
        - pairing_code
      properties:
        pairing_code:
          type: string
          minLength: 6
          maxLength: 32
          description: >
            Short-lived pairing code, issued through the Console
            (`consoleIssuePairingCode`: 16 characters from an alphabet
            without look-alikes) or the owner-run bootstrap CLI (24
            base64url characters with `--generate`). Format is opaque to
            the POS terminal; send it exactly as entered. Single-use: a
            successful pair burns the code server-side.

    TerminalPairResponse:
      type: object
      additionalProperties: false
      description: >
        Successful pairing envelope. The `device_token` is a SECRET —
        stored only via the terminal's OS secret storage, never
        logged or echoed to any renderer. All other fields populate
        the single-row `terminal_assignment` table at the terminal
        and are read by the POS receipt + print pipelines.
      required:
        - device_token
        - tenant_id
        - branch_id
        - terminal_id
        - terminal_label
        - branch_name
        - branch_address
        - tenant_tax_registration_id
        - printer_vendor_id
        - printer_product_id
        - printer_com_port
      properties:
        device_token:
          type: string
          minLength: 32
          maxLength: 512
          description: >
            Opaque device-authentication token for this device
            identity. Valid until the device is revoked or the token is
            rotated (`posRotateTerminalToken`, RT-369: the previous token
            lasts 10 more minutes), and subject to `expires_at` once
            expiry is enforced (RT-370). SECRET —
            stored exclusively via `safeStorage` (DPAPI on Windows).
            MUST NEVER appear in any log sink, audit-event payload,
            support bundle, or response body of any other endpoint.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: >
            The device credential's expiry (`devices.expires_at`, RT-138
            L2: 90 days after pairing). Populated by Backend-Core since
            RT-367; older servers omitted it, so a client tolerates its
            absence. Reported, not enforced until RT-370. POS-Pulse v1
            ignores it; the rotation client (RT-373) rotates before it.
        tenant_id:
          type: string
          format: uuid
          description: >
            Tenant the terminal is bound to. Persisted in the local
            `terminal_assignment` row; included in every subsequent
            POS-authenticated request via the JWT principal.
        branch_id:
          type: string
          format: uuid
          description: >
            Branch (store) the terminal is bound to. Persisted in
            `terminal_assignment`. Cross-branch operations are
            refused at the backend per Data-Pulse-2 §II
            multi-tenant RLS.
        terminal_id:
          type: string
          format: uuid
          description: >
            The device identity this pairing created (`devices.id`).
            Stable across credential rotation (RT-369), NOT across
            re-pairing: every pairing, including a replace or move,
            mints a new `terminal_id` (RT-287 F9).
        terminal_label:
          type: string
          minLength: 1
          maxLength: 64
          description: >
            Human-readable terminal name (e.g. "Counter 1"). Printed
            on receipts per POS-Pulse 008 AD-7 sale-number format
            (`<terminal_label>-<YYYY-MM-DD>-<NNNNNN>`).
        branch_name:
          type: string
          minLength: 1
          maxLength: 256
          description: >
            Human-readable branch / store name (e.g. "Maadi Pharmacy
            Branch 3"). Printed on receipts per POS-Pulse 008 AD-6.
            Added 2026-05-28 to satisfy the Slice 1 closeout-gap
            audit finding.
        branch_address:
          type: string
          minLength: 1
          maxLength: 512
          description: >
            Human-readable branch address (free-form, multi-line
            permitted via `\n`). Printed on receipts per POS-Pulse
            008 AD-6. Added 2026-05-28 to satisfy the Slice 1
            closeout-gap audit finding.
        tenant_tax_registration_id:
          type: string
          minLength: 1
          maxLength: 64
          description: >
            Tenant's tax-registration identifier (Egyptian Tax
            Authority format: 9-digit numeric, but stored as string
            for forward compatibility with other jurisdictions and
            ETA spec evolution). Printed on every fiscal receipt
            per Egyptian e-invoicing rules. Added 2026-05-28 to
            satisfy the Slice 1 closeout-gap audit finding.
        printer_vendor_id:
          type: string
          minLength: 4
          maxLength: 8
          pattern: "^0x[0-9A-Fa-f]{4}$"
          description: >
            USB vendor ID of the receipt printer, as a hex string
            (e.g. `0x04B8` for Epson). Used by the POS print pipeline
            (008 Slice 3) to discover the printer at app startup.
            Added 2026-05-28 to satisfy the Slice 3 prep-audit
            finding on printer-config provenance.
        printer_product_id:
          type: string
          minLength: 4
          maxLength: 8
          pattern: "^0x[0-9A-Fa-f]{4}$"
          description: >
            USB product ID of the receipt printer, as a hex string
            (e.g. `0x0202` for Epson TM-T20III). Paired with
            `printer_vendor_id` to uniquely identify the device.
            Added 2026-05-28 to satisfy the Slice 3 prep-audit
            finding.
        printer_com_port:
          type: string
          nullable: true
          minLength: 1
          maxLength: 32
          description: >
            OPTIONAL additional COM port (e.g. `COM3` on Windows,
            `/dev/ttyS0` on Linux) set ONLY when an RS-232 serial path
            is also available alongside the required USB connection
            (some Epson models expose both). NULL for USB-only
            printers. `printer_vendor_id` + `printer_product_id`
            remain required regardless — a "COM-port-only" terminal
            config is NOT permitted by this contract in 008 v1. Added
            2026-05-28 to satisfy the Slice 3 prep-audit finding.

    Error:
      type: object
      additionalProperties: false
      required:
        - error
      description: >
        Canonical error envelope shared with `auth.openapi.yaml`,
        `outbox.openapi.yaml`, `catalog/unknown-items.yaml`,
        `pos-payments/vouchers.yaml`, and the other backend
        contracts. The `error.code` enum is the closed set
        documented per-operation above.
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              enum:
                - INVALID_CODE
                - EXPIRED_CODE
                - ALREADY_PAIRED
                - BRANCH_MISMATCH
                - REPLACEMENT_BLOCKED
                - RATE_LIMITED
                - validation_failure
            message:
              type: string
              description: Human-readable summary; no sensitive data.
            request_id:
              type: string
              format: uuid
              nullable: true
              description: Server-assigned correlation id.
