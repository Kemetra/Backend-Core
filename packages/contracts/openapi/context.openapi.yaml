openapi: 3.1.0
info:
  title: Data-Pulse-2 Active Context API
  version: "1.2.0-draft"
  description: >
    Server-side resolution and switching of active tenant + active store
    for an authenticated session. Per spec §6.6 and Q3 default A.

    RT-414 (1.1.0-draft, `[GATED]`, owner-approved 2026-10-12): a platform admin
    enters a tenant they are not a member of only through a support session
    (`platform-support-sessions.openapi.yaml`). `switchActiveTenant` refuses
    that case with 403 `support_session_required`, and `ContextResponse`
    gains `support_session`. Behavior for users who are not platform admins
    is unchanged. Both changes ship with the RT-414 runtime.


    **1.2.0-draft (RT-620, additive).** Every cookieAuth operation may
    return 429 `rate_limited` (`TooManyRequests`, with `Retry-After`)
    from the console rate limit (RT-574, RT-619). No other wire change.
servers:
  - url: https://api.example.com
paths:
  /api/v1/context/me:
    get:
      summary: Return the current user, available memberships, and active context.
      operationId: getActiveContext
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextResponse"
        "401":
          description: Unauthenticated.
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/context/tenant:
    post:
      summary: Switch the active tenant for the current session.
      operationId: switchActiveTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenant_id]
              properties:
                tenant_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: >
            Active tenant switched. Active store is cleared. Any current support
            session has ended, so `support_session` is null.
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ContextResponse"
                  - properties:
                      support_session: { type: "null" }
        "403":
          description: >
            `support_session_required` (RT-414): the caller is a platform admin
            and not an active member of this existing tenant. Enter it with
            `openSupportSession` instead. Never returned to a user who is not a
            platform admin. A successful switch ends any current support
            session (`end_reason: tenant_switched`).
            Also `origin_rejected` (RT-430): the request is authenticated by the
            `dp2_session` cookie and its `Origin` header is missing, or is
            neither the API's own origin nor listed in `ALLOWED_ORIGINS`.
        "404":
          description: Tenant does not exist OR user has no membership in it. Same response for both (FR-ISO-4).
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/context/store:
    post:
      summary: Switch the active store within the active tenant.
      operationId: switchActiveStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [store_id]
              properties:
                store_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Active store switched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextResponse"
        "403":
          description: >
            `origin_rejected` (RT-430): the request is authenticated by the
            `dp2_session` cookie and its `Origin` header is missing, or is
            neither the API's own origin nor listed in `ALLOWED_ORIGINS`.
        "404":
          description: Store does not belong to the active tenant OR user lacks access. Same response for both.
        "409":
          description: No active tenant set. Caller must switch tenant first.
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      summary: Clear the active store (tenant remains).
      operationId: clearActiveStore
      responses:
        "200":
          description: Active store cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextResponse"
        "403":
          description: >
            `origin_rejected` (RT-430): the request is authenticated by the
            `dp2_session` cookie and its `Origin` header is missing, or is
            neither the API's own origin nor listed in `ALLOWED_ORIGINS`.
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  schemas:
    ContextResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"
        active_tenant:
          $ref: "#/components/schemas/TenantSummary"
          nullable: true
        active_store:
          $ref: "#/components/schemas/StoreSummary"
          nullable: true
        active_role_code:
          type: string
          nullable: true
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/MembershipSummary"
        support_session:
          description: >
            RT-414: the caller's current support session (`active` or
            `expired`), or null. Always null for a user who is not a platform
            admin, and when the active tenant was entered through membership.
          oneOf:
            - $ref: "#/components/schemas/SupportSessionSummary"
            - type: "null"
    SupportSessionSummary:
      type: object
      additionalProperties: false
      required: [id, tenant_id, purpose, ticket_ref, status, expires_at, renewal_cap_at]
      description: >
        RT-414: the banner subset of `SupportSession` in
        `platform-support-sessions.openapi.yaml`; the field meanings and value
        sets are defined there.
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        purpose:
          type: string
          enum: [customer_support, incident, onboarding]
        ticket_ref:
          type: [string, "null"]
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:#/-]{0,63}$"
        status:
          type: string
          enum: [active, expired]
        expires_at: { type: string, format: date-time }
        renewal_cap_at: { type: string, format: date-time }
    UserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string, nullable: true }
        is_platform_admin: { type: boolean }
    TenantSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
    StoreSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    MembershipSummary:
      type: object
      properties:
        tenant_id: { type: string, format: uuid }
        tenant_name: { type: string }
        role_code: { type: string }
        store_access_kind:
          type: string
          enum: [all, specific]
        accessible_store_ids:
          type: array
          items:
            type: string
            format: uuid
    Error:
      description: The canonical error envelope (code, message, request_id).
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
              format: uuid
  headers:
    ConsoleRetryAfter:
      description: >
        Whole seconds the caller should wait before retrying, sent on every
        console 429 (RT-574 D5). Its own bound, 1 to 3600; it is not the POS
        `RetryAfter` header.
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 3600
  responses:
    TooManyRequests:
      description: >
        429 `rate_limited` (RT-574): the caller's per-user budget for this
        class of operation is spent. The body is the canonical error
        envelope with a non-disclosing message (no budget, class or window);
        its `request_id` equals the `X-Request-Id` response header. Honour
        `Retry-After`; never auto-retry a mutation. A 429 is not a 401: it
        never means the session ended. The console limit is
        server-configured and may not be enforced, so a client must handle a
        429 but must not expect one.
      headers:
        Retry-After:
          $ref: "#/components/headers/ConsoleRetryAfter"
        Cache-Control:
          description: Always `no-store` on a 429.
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
security:
  - cookieAuth: []
