openapi: 3.1.0
info:
  title: Data-Pulse-2 — Console Sync-Ops Read-Model API
  version: "1.2.0-draft"
  description: >
    Spec 025 — a READ-ONLY consolidation surface for the Retail Tower Console (a
    sibling SPA repo). It aggregates the ERPNext sync-ops state a human operator
    needs to see into one console-facing read API:

      1. `consoleGetSyncOpsSummary` — one tenant-scoped summary across the sync-ops
         domains: 015 posting health + 017 reconciliation health populated;
         **020 connector_health + 021 product_master present as `not_available`**
         (forward-compat stub, until those specs ship); plus the posting
         freshness facts and their `asOf` (1.2.0-draft, RT-565).
      2. `consoleListPostingBacklog` — a paginated read-through of the 015
         `erpnext_posting_status` dead-letter backlog (`permanently_rejected` rows
         only), with class / origin ref / provenance / structured reason /
         dead-letter time. NO repair affordance (repair stays in 017).
      3. `consoleListReconciliationRuns` — a paginated, newest-first read-through
         of 017 `erpnext_reconciliation_run` rows with trigger, status,
         timestamps, and a per-class mismatch summary.

    READ-NOT-MIRROR / compute-on-read: 025 reads the 015/017 rows in place,
    tenant-scoped under RLS (fail-closed). It owns NO table or migration of its
    own, NO worker, and exposes NO write/repair surface — write/repair stay in 017. It is
    the read-only consolidation of 017's operator surface for the console.

    AUTH (FR-007): the HUMAN `cookieAuth` (httpOnly `dp2_session`) scheme — gated
    by `DashboardAuthGuard` + `RolesGuard`, human-operator-only. NOT the machine
    `connectorBearer` (012/015), NOT the `dashboard_api` bearer, NOT the POS
    `clerkJwt` device scheme. A machine credential MUST be rejected. Required at
    the document level.

    PROJECTIONS (§IV): every response is an explicit wire shape with
    `additionalProperties: false` — no raw DB entity, no internal columns, no
    credential/hash material, no `tenant_id` (implicit in the session scope). The
    15/017 source tables carry NO money / valuation column, so this surface has
    NONE either (quantities, refs, counts, classes, timestamps only).

    Error envelope: the canonical `{ error: { code, message, request_id } }`,
    identical to the shared shape (`auth` / `outbox` / `pos-sales` /
    `erpnext-reconciliation`). Status mapping: 400 validation, 401 unauthenticated,
    403 insufficient-role, 404 not-found / cross-tenant (non-disclosing),
    429 `rate_limited` (console rate limit; honour `Retry-After`), 500 internal.

    Consumed by `apps/api/test/catalog/erpnext-sync-ops/erpnext-sync-ops.contract.spec.ts`,
    loaded with an explicit `dir` (the production `loadOpenApiContracts` helper is
    non-recursive, R9).

    SCOPE (025-CONTRACT): authors ONLY this YAML + its conformance spec. The
    read-model service + controller routes land in the US1/US2/US3 slices. Spec 025
    owns no table, worker or write path; RT-565 adds five read-only partial indexes
    (0057-0061) under `packages/db`.


    **1.1.0-draft (RT-620, additive).** Every cookieAuth operation may
    return 429 `rate_limited` (`TooManyRequests`, with `Retry-After`)
    from the console rate limit (RT-574, RT-619). No other wire change.


    **1.2.0-draft (RT-565, additive; `[GATED]` contract, owner-approved
    2026-10-19, RT-565 comment 12969).** `SyncOpsSummary` gains a required
    top-level `asOf` and a required `postingFreshness` object (D1–D7 of
    `docs/planning/rt-565-posting-freshness-read.md`): the latest ERP posting
    confirmation (`lastPosted`, with `state` `known` / `unknown` / `none`),
    the pending posting-intent count, and the creation instant and whole-second
    age of the oldest pending intent. Facts only: there is no current / behind
    verdict, and the `posting` `DomainSummary` rule (dead-letter driven) is
    unchanged. Roles, session, tenant RLS, the store filter, the operator store
    scope and the out-of-scope 404 are unchanged; no request parameter changes.
    Served by the RT-565 runtime on the 0057-0061 freshness indexes.

servers:
  - url: https://api.example.com

tags:
  - name: erpnext-sync-ops
    description: >
      Console-facing read-only consolidation of ERPNext sync-ops state (015
      posting + 017 reconciliation; 020/021 deferred). Spec 025.

security:
  - cookieAuth: []

paths:
  /api/v1/catalog/erpnext-sync-ops/summary:
    get:
      summary: Consolidated sync-ops summary across domains for the operator's tenant.
      operationId: consoleGetSyncOpsSummary
      tags: [erpnext-sync-ops]
      description: >
        One tenant-scoped summary aggregating 015 posting health + 017
        reconciliation health, with 020 connector_health + 021 product_master
        reported as `not_available` (forward-compat). Optional `store_id` narrows
        to one in-scope store. Tenant resolves server-side from the session.
        Also carries the posting freshness facts (`postingFreshness`) for the
        same scope and the instant they were read (`asOf`); facts only, no
        "posting is current" verdict (1.2.0-draft, RT-565).
      parameters:
        - $ref: "#/components/parameters/StoreIdQuery"
      responses:
        "200":
          description: The consolidated sync-ops summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOpsSummary"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/catalog/erpnext-sync-ops/posting-backlog:
    get:
      summary: Paginated read-through of the 015 posting dead-letter backlog.
      operationId: consoleListPostingBacklog
      tags: [erpnext-sync-ops]
      description: >
        The tenant's `permanently_rejected` 015 posting rows ONLY — projected with
        class, origin ref, provenance, structured rejection reason, and dead-letter
        time. Cursor-paginated, bounded page, deterministic order. READ-ONLY — no
        repair affordance (repair is a 017 operation).
      parameters:
        - $ref: "#/components/parameters/StoreIdQuery"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of dead-letter backlog items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostingBacklogPage"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

  /api/v1/catalog/erpnext-sync-ops/reconciliation-runs:
    get:
      summary: Paginated newest-first read-through of 017 reconciliation runs.
      operationId: consoleListReconciliationRuns
      tags: [erpnext-sync-ops]
      description: >
        The tenant's 017 `erpnext_reconciliation_run` rows, newest-first,
        cursor-paginated, projected with trigger source, status, timestamps, and a
        per-class mismatch summary. Optional `store_id` narrows to one store.
        READ-ONLY.
      parameters:
        - $ref: "#/components/parameters/StoreIdQuery"
        - $ref: "#/components/parameters/RunCursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of reconciliation runs (newest first).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationRunPage"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SystemFailure"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dp2_session
      description: >
        The human dashboard session cookie (httpOnly `dp2_session`), verified by
        `DashboardAuthGuard`. The ONLY accepted credential on this surface — a
        machine `connectorBearer` / `dashboard_api` bearer or a POS `clerkJwt` is
        rejected (FR-007). `RolesGuard` + `@Roles` gate the routes (default deny).

  parameters:
    StoreIdQuery:
      name: store_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: >
        Optional in-scope store filter. Validated against the operator's
        accessible stores; an out-of-scope id is a non-disclosing 404.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        pattern: "^[0-9]{1,18}$"
      description: >
        Opaque pagination cursor from a prior page's `nextCursor`. Opaque — do not
        decode or construct. Omit for the first page. The posting-backlog cursor is
        a numeric token (1–18 digits); anything else is a 400 `validation_error`.
    RunCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        # <startedAt>|<runId>: a real UTC instant (years 0001-9999, Gregorian
        # calendar incl. leap years, millisecond precision, `Z`), `|`, a UUID.
        pattern: '^(?:(?:000[1-9]|00[1-9][0-9]|0[1-9][0-9]{2}|[1-9][0-9]{3})-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12][0-9]|3[01])|(?:0[469]|11)-(?:0[1-9]|[12][0-9]|30)|02-(?:0[1-9]|1[0-9]|2[0-8]))|(?:[0-9]{2}(?:0[48]|[2468][048]|[13579][26])|(?:0[48]|[2468][048]|[13579][26])00)-02-29)T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\.[0-9]{3}Z\|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      description: >
        Opaque pagination cursor from a prior page's `nextCursor`. Opaque — do not
        decode or construct. Omit for the first page. The run-history cursor is
        `<startedAt>|<runId>`: a UTC instant in `YYYY-MM-DDTHH:mm:ss.sssZ` form
        that exists on the calendar (no Feb 30, month 13, hour 24 or year 0000),
        then `|`, then a UUID. Anything else is a 400 `validation_error`.
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Maximum items per page (bounded). The server MAY return fewer.

  schemas:
    SyncOpsSummary:
      type: object
      additionalProperties: false
      required: [domains, asOf, postingFreshness]
      description: >
        The consolidated sync-ops summary for one tenant (optionally one store).
        One `DomainSummary` per sync-ops domain, plus the posting freshness facts
        (1.2.0-draft, RT-565) and the instant they were read.
      properties:
        domains:
          type: array
          items:
            $ref: "#/components/schemas/DomainSummary"
          description: >
            One entry per sync-ops domain. v1 populates `posting` + `reconciliation`;
            `connector_health` + `product_master` are present as `not_available`.
        asOf:
          type: string
          format: date-time
          description: >
            Server instant of the posting-freshness read, taken inside the one
            statement that reads every `postingFreshness` fact. Every timestamp
            in `postingFreshness` is at or before it, and every age is measured
            against it. The other domain counts are read in the same request but
            by separate statements, so they may be one commit apart from it.
        postingFreshness:
          $ref: "#/components/schemas/PostingFreshness"

    PostingFreshness:
      type: object
      additionalProperties: false
      required: [lastPosted, pendingCount, oldestPendingAt, oldestPendingAgeSeconds]
      description: >
        Whether ERP posting is keeping up, for the tenant or the filtered store,
        within the caller's store scope. Facts only: there is no "current" or
        "behind" verdict. Covers materialized posting intents only: sales not
        yet turned into a posting intent, and reversals deferred before their
        sale's posting row exists, are not visible here. `lastPosted.state =
        none` with `pendingCount = 0` means no posting activity, NOT that
        posting is current. `pendingCount` is 0 exactly when `oldestPendingAt`
        and `oldestPendingAgeSeconds` are both null (the `if` / `then` /
        `else` below).
      if:
        properties:
          pendingCount:
            const: 0
      then:
        properties:
          oldestPendingAt:
            type: "null"
          oldestPendingAgeSeconds:
            type: "null"
      else:
        properties:
          oldestPendingAt:
            type: string
          oldestPendingAgeSeconds:
            type: integer
      properties:
        lastPosted:
          $ref: "#/components/schemas/LastPosted"
        pendingCount:
          type: integer
          minimum: 0
          description: >
            Posting intents in scope that are not yet posted and not
            dead-lettered, including intents held from the connector feed. Dead
            letters are the `posting` domain `headlineCount`, not counted here.
        oldestPendingAt:
          type: [string, "null"]
          format: date-time
          description: >
            Creation time of the oldest pending posting intent in scope (not its
            last retry; a repaired dead letter keeps its creation time). Null
            exactly when `pendingCount` is 0.
        oldestPendingAgeSeconds:
          type: [integer, "null"]
          minimum: 0
          description: >
            Whole seconds from `oldestPendingAt` to `asOf`, never negative. Null
            exactly when `pendingCount` is 0.

    LastPosted:
      type: object
      additionalProperties: false
      required: [state, at]
      description: >
        The latest ERP posting confirmation in scope, or why there is none.
        `at` is a date-time exactly when `state` is `known`, and null for
        `unknown` / `none` (the `if` / `then` / `else` below).
      if:
        properties:
          state:
            const: known
      then:
        properties:
          at:
            type: string
      else:
        properties:
          at:
            type: "null"
      properties:
        state:
          type: string
          enum: [known, unknown, none]
          description: >
            `known`: `at` is the latest ERP confirmation (posted-ack) time in
            scope. `unknown`: postings exist in scope but all predate
            confirmation-time capture, so the time is not recorded (no other
            timestamp is substituted). `none`: no posting has succeeded in scope.
        at:
          type: [string, "null"]
          format: date-time
          description: >
            Latest ERP confirmation (posted-ack) time in scope, at or before
            `asOf`. Non-null exactly when `state` is `known`.

    DomainSummary:
      type: object
      additionalProperties: false
      required: [domain, status]
      description: >
        Health of one sync-ops domain. `status` is the operator-facing rollup;
        `not_available` means the domain's source spec (020/021) is not yet built
        (forward-compat stub — the Console renders a deferred tile).
      properties:
        domain:
          type: string
          enum: [posting, reconciliation, connector_health, product_master]
          description: The sync-ops domain this summary describes.
        status:
          type: string
          enum: [ok, attention, not_available]
          description: >
            `ok` — nothing needs operator attention. `attention` — there is a
            backlog / open mismatch / failed run to look at. `not_available` — the
            domain's source is not yet built (020/021 in v1).
        headlineCount:
          type: [integer, "null"]
          description: >
            The single operator-facing count for the domain (e.g. dead-letter
            backlog size for `posting`; open-mismatch count for `reconciliation`).
            Null when `not_available`.
        detail:
          type: [string, "null"]
          description: >
            Short human-readable context (e.g. latest run outcome). Null when
            `not_available`. No PII, no internal identifiers.

    # Per-endpoint page schemas (NOT a shared oneOf envelope): each list op has a
    # homogeneous, fully-typed items array so the Console's openapi-typescript
    # generator produces precise per-endpoint types (no union narrowing/casting).
    PostingBacklogPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      description: A bounded page of posting dead-letter backlog items.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PostingBacklogItem"
        nextCursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; null on the last page.

    ReconciliationRunPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      description: A bounded page of reconciliation runs (newest first).
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationRunView"
        nextCursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; null on the last page.

    PostingBacklogItem:
      type: object
      additionalProperties: false
      required: [postingStatusId, kind, sourceSystem, externalId, status, deadLetteredAt]
      description: >
        One `permanently_rejected` 015 posting row, projected read-only. No write
        / repair field (repair is a 017 operation, not exposed here).
      properties:
        postingStatusId:
          type: string
          format: uuid
          description: The 015 `erpnext_posting_status` row id (operator reference).
        kind:
          type: string
          enum: [sale_post, reversal]
          description: Whether the posting was a sale post or a void/refund reversal.
        sourceSystem:
          type: string
          description: Provenance source system (correlation; mirrors 008/015).
        externalId:
          type: string
          description: POS-side identifier of the originating sale/terminal event.
        status:
          type: string
          enum: [permanently_rejected]
          description: Always `permanently_rejected` — the backlog is dead-letters only.
        rejectionClass:
          type: [string, "null"]
          description: >
            The 015 `rejection_category` (the nearest 012 RejectionReason.category),
            for grouping. Null if not recorded.
        deadLetteredAt:
          type: string
          format: date-time
          description: When the row reached its terminal rejected state (015 `updated_at`).

    ReconciliationRunView:
      type: object
      additionalProperties: false
      required: [runId, storeId, kind, trigger, status, startedAt]
      description: >
        One 017 `erpnext_reconciliation_run` row, projected read-only, with a
        per-class mismatch summary.
      properties:
        runId:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [stock]
          description: Stock-only in v1 (017 `run.kind`).
        trigger:
          type: string
          enum: [on_demand, scheduled]
        status:
          type: string
          enum: [running, completed, failed]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
          description: Null while `running`; set on a terminal status.
        mismatchSummary:
          type: [object, "null"]
          additionalProperties:
            type: integer
          description: >
            Per-mismatch-class counts (014 vocabulary keys → count), from the run's
            `summary` jsonb. Null if the run produced none. Counts only, no PII/money.

    Error:
      type: object
      required: [error]
      description: >
        Canonical error envelope, identical to the shared shape in `auth` /
        `outbox` / `pos-sales` / `erpnext-reconciliation`. Cross-tenant /
        out-of-scope refusals are non-disclosing (§II/§XII).
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >
                Stable machine-readable code. Closed set: validation_error |
                unauthorized | forbidden | not_found | system_failure |
                rate_limited (the console 429).
            message:
              type: string
              description: Human-readable summary. No sensitive data, no cause enumeration.
            request_id:
              type: string
              format: uuid
              description: Server-side correlation id; the cause is recorded server-side.

  responses:
    ValidationFailure:
      description: validation_error (400) — malformed query, unknown key (strict), bad cursor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: >
        Unauthorized (401) — missing / invalid session, OR a machine credential
        (connectorBearer / dashboard_api / clerkJwt) presented to this human-only
        surface. Non-disclosing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: forbidden (403) — authenticated human without the required tenant role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >
        not_found (404) — non-disclosing for a cross-tenant / out-of-scope
        `store_id` or resource. Identical for cross-tenant, out-of-scope, and
        genuinely-absent (§II/§XII).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SystemFailure:
      description: system_failure (500) — unexpected server error; cause recorded server-side.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: >
        429 `rate_limited` (RT-574): the caller's per-user budget for this
        class of operation is spent. The body is the canonical error
        envelope with a non-disclosing message (no budget, class or window);
        its `request_id` equals the `X-Request-Id` response header. Honour
        `Retry-After`; never auto-retry a mutation. A 429 is not a 401: it
        never means the session ended. The console limit is
        server-configured and may not be enforced, so a client must handle a
        429 but must not expect one.
      headers:
        Retry-After:
          $ref: "#/components/headers/ConsoleRetryAfter"
        Cache-Control:
          description: Always `no-store` on a 429.
          required: true
          schema:
            type: string
            enum: [no-store]
        X-Request-Id:
          description: >
            The request id, equal to `error.request_id` in the body: the
            inbound `X-Request-Id` when it is a well-formed UUID, otherwise a
            server-minted one.
          required: true
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  headers:
    ConsoleRetryAfter:
      description: >
        Whole seconds the caller should wait before retrying, sent on every
        console 429 (RT-574 D5). Its own bound, 1 to 3600; it is not the POS
        `RetryAfter` header.
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 3600
