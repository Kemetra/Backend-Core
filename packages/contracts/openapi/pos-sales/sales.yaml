  /api/pos/v1/sales/{saleRef}/void:
    post:
      summary: Record a void as a separate terminal event.
      operationId: recordVoid
      x-idempotency: required
      tags: [pos-sales]
      security:
        - operatorAuthorization: []
      description: >
        Create a void terminal event referencing the sale, stamping `voidedAt`
        from the server clock. The original `sales` row and its `sale_lines`
        are NEVER mutated (§X) — "voided" is derived from the presence of this
        terminal event. Object-level authz + non-disclosing 404 for
        cross-tenant / out-of-scope / unknown sales (FR-014, SI-004).

        Idempotency: the `Idempotency-Key` header is REQUIRED and the event is
        deduped on its own `(tenant, sourceSystem, externalId)` provenance — a
        re-delivery of the SAME void (same provenance) is a deterministic replay
        (200) with no duplicate record (FR-013).


        Reversal exclusivity (RT-14 D2): a sale has AT MOST ONE void, and a
        void excludes returns. A second, different void of an already-voided
        sale, or a void of a sale that has any return, is 409
        `already_reversed` (see `ReversalConflict`); nothing is recorded.

        Credit sales (RT-577, from the RT-577 runtime): a sale with payer
        responsibilities is refused with 403 `credit_sale_reversal_restricted`
        for every operator (see `CreditSaleReversalRestricted`), even with a
        valid manager approval; it is voided only through
        `recordCreditSaleReversal`. The refusal is decided after the sale resolves (404) and a provenance replay (200), and before reversal exclusivity (409) and every RT-530 check.
        Nothing is recorded.

        Manager approval (RT-530): a void is recorded only with a bound
        manager approval (`approval`) and the void's `businessDate`. Checks run
        in this order, after the sale resolves (404), a provenance replay
        (200) and reversal exclusivity (409):
        1. `approval` present, else 403 `void_approval_required`;
        2. `approval.action` is `sale.void`, `approval.saleRef` is the path's
           sale, `approval.amount` equals the sale's `posTotal` as an exact
           decimal, and `approval.approvedAt` is not in the future beyond
           120 s, else 422 `void_approval_invalid`;
        3. `businessDate` equals the sale's `businessDate`, else 422
           `void_outside_business_day` (after that day a return is used);
        4. `approval.requesterUserId` is the authenticated operator of the
           envelope (the `users.id` the server resolved; a body id is never
           trusted), else 403 `void_requester_mismatch`. A queued void is
           therefore sent under the original requester envelope;
        5. the approver is neither `approval.requesterUserId` nor the user
           who captured the sale, else 403 `void_self_approval`;
        6. the requester is a user of the tenant with an active membership
           and access to the sale's store, else 403
           `void_requester_not_eligible`;
        7. the approver holds `owner`, `tenant_admin` or `store_manager` in the
           tenant, with an active membership and access to the sale's store,
           else 403 `void_approver_not_eligible`.
        A replay (the same `(sourceSystem, externalId)`) answers before these
        checks and never re-runs them. An offline-queued void is checked on
        arrival with the same rules and may be refused; the approval age is
        not compared with the server clock. The approval `approvalId` is
        single-use within a tenant. `sale_voids` records the approver and the
        evidence, and the `sale.voided` audit event carries the approver,
        requester, approval id and policy version.
      parameters:
        - $ref: "#/components/parameters/SaleRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordVoidRequest"
      responses:
        "200":
          description: >
            Provenance replay — this void was already recorded with the same
            provenance, and no live replay entry exists for this
            `Idempotency-Key` (a different key, or the same key after its 72h
            replay window). Returns the identical terminal-event projection with
            `Idempotent-Replayed: true`; no duplicate record. A
            same-`Idempotency-Key` retry returns the stored `201` instead (RT-82
            K4).
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleTerminalEvent"
        "201":
          description: >
            Void terminal event recorded for the first time. A retry with the
            same `Idempotency-Key` on the same sale replays this stored `201`
            with `Idempotent-Replayed: true` (RT-82 K4).
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleTerminalEvent"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/VoidForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReversalConflict"
        "422":
          $ref: "#/components/responses/VoidUnprocessable"
        "500":
          $ref: "#/components/responses/SystemFailure"
