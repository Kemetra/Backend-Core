# SonarCloud automatic analysis settings.
#
# The Drizzle migrations (packages/db/drizzle) and the operations SQL under
# docs/operations/sql are Postgres SQL. The PL/SQL analyzer claims every .sql
# file and reports false findings on them. Automatic analysis cannot change the
# analyzer's file suffixes, so exclude the .sql files from analysis instead.
sonar.exclusions=**/*.sql
