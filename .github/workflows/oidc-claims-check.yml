# RT-722: print-only check of the GitHub Actions OIDC token claims for the
# aws-lab environment. It requests one token from GitHub, masks it, prints an
# allowlist of non-secret claims and compares them with the AWS trust policy
# values RT-532 (S2a v2) depends on. It calls no AWS API: no AWS CLI, no
# credentials action, no AWS_* variable, no secret, no artifact, no cache.
#
# The job names the owner-provisioned `aws-lab` environment on purpose: the
# claims (`sub`, `environment`) only exist for a job that runs in it, and the
# environment's required reviewer approves each run. GitHub creates a missing
# environment with no protection rules, so confirm the environment still has
# its reviewer (read-only `gh api repos/Kemetra/Backend-Core/environments/aws-lab`)
# right before the first dispatch.
#
# Temporary: remove this workflow before any permission is attached to the
# rt-gha-aws-lab-deploy role (RT-722 gate G5). The Actions log and step summary
# of a public repository are public; everything printed here is non-secret
# (repository IDs, environment name, ref, actor).
name: OIDC claims check

"on":
  workflow_dispatch:
    inputs:
      jira_key:
        description: Jira issue authorizing this run (RT-<number>)
        required: true
        type: string

permissions: {}

concurrency:
  group: oidc-claims-check
  cancel-in-progress: false

jobs:
  claims:
    name: claims (print only, no AWS)
    # No job-level `if` on purpose: a dispatch from any other ref must FAIL in
    # the guard step, not be silently skipped as a green run.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: aws-lab
    permissions:
      contents: read # checkout of main
      id-token: write # ask GitHub for the OIDC token; nothing else is granted
    steps:
      - name: Guard (main only, validated input)
        env:
          RUN_REF: ${{ github.ref }}
          JIRA_KEY: ${{ inputs.jira_key }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [ "$RUN_REF" = "refs/heads/main" ] || fail "must be dispatched from refs/heads/main"
          [[ "$JIRA_KEY" =~ ^RT-[1-9][0-9]*$ ]] || fail "jira_key must be RT-<number>"

      # No `ref:` on purpose: the helper runs from the dispatched main commit.
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Request the OIDC token, mask it, print and check the claims
        env:
          JIRA_KEY: ${{ inputs.jira_key }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] \
            || fail "no OIDC request variables: the job needs id-token: write"
          echo "::add-mask::$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

          RESPONSE="$(curl --silent --show-error --fail --max-time 20 \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")" || fail "the OIDC token request failed"
          TOKEN="$(jq -er .value <<<"$RESPONSE" 2>/dev/null)" || fail "the OIDC response held no token"
          echo "::add-mask::$TOKEN"

          printf '%s' "$TOKEN" | node deploy/lab/oidc-claims-check.cjs \
            --jira-key "$JIRA_KEY" --workflow-file oidc-claims-check.yml --summary "$GITHUB_STEP_SUMMARY"
