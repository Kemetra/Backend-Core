# RT-703 + RT-842: manual, approval-gated AWS lab deploy for Backend-Core.
#
# preflight (every run): verifies an already published, immutable Backend-Core
# release (see release-images.yml) and writes a planned deployment ledger as a
# workflow artifact. It deploys nothing: no AWS, no SSH, no SSM, no host
# access, no secrets beyond the read-only GITHUB_TOKEN, no environment.
#
# live (dry_run=false only, RT-532 S4): after a preflight with 0 refusals, the
# `aws-lab` environment's required reviewer approves the run, the job assumes
# the deploy role through GitHub OIDC (no stored AWS keys) and runs exactly two
# owner-created SSM Command documents: RT-BackendLabBackup on lab-02, then
# RT-BackendLabDeploy on lab-01 (deploy/lab/ssm/). No AWS-RunShellScript, no
# StartSession, no SSH. It fails closed while the environment variables
# AWS_ROLE_ARN / AWS_REGION are unset, so it does nothing until the owner has
# provisioned the OIDC provider, the role and the SSM registrations (S0/S2/S3).
#
# Fails closed: any guard or evidence that cannot be evaluated is a refusal.
name: Deploy lab

"on":
  workflow_dispatch:
    inputs:
      backend_release:
        description: Published release tag backend-core-<sha12> (any release reachable from main)
        required: true
        type: string
      jira_key:
        description: Jira issue authorizing this run (RT-<number>)
        required: true
        type: string
      target:
        description: Lab host (Backend-Core only)
        required: true
        type: choice
        options:
          - lab-01
        default: lab-01
      current_release:
        description: Release tag the host runs (required for a live run, where lab-01 must prove it; else operator-asserted)
        required: false
        type: string
        default: ""
      dry_run:
        description: Preflight only (default). false runs the live deploy after preflight, with aws-lab approval
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  group: deploy-aws-lab
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight (verify release, planned ledger, no deploy)
    # No job-level `if` on purpose: a dispatch from any other ref must FAIL in
    # the first step below, not be silently skipped as a green run.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout, release assets, compare
      checks: read # check runs on the release commit
      packages: read # GHCR login for attestation verification
      attestations: read # gh attestation verify
      actions: read # read (never create) the aws-lab environment
    # The verified plan, for the live job only (non-secret digests and the rollback rule).
    outputs:
      release_sha: ${{ steps.plan.outputs.release_sha }}
      api_digest: ${{ steps.plan.outputs.api_digest }}
      worker_digest: ${{ steps.plan.outputs.worker_digest }}
      migrate_digest: ${{ steps.plan.outputs.migrate_digest }}
      rollback_allowed: ${{ steps.plan.outputs.rollback_allowed }}
    steps:
      - name: Guard (main only, validated inputs, live runs name the current release)
        id: guard
        env:
          RUN_REF: ${{ github.ref }}
          BACKEND_RELEASE: ${{ inputs.backend_release }}
          JIRA_KEY: ${{ inputs.jira_key }}
          TARGET: ${{ inputs.target }}
          CURRENT_RELEASE: ${{ inputs.current_release }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [ "$RUN_REF" = "refs/heads/main" ] || fail "must be dispatched from refs/heads/main"
          [[ "$BACKEND_RELEASE" =~ ^backend-core-[0-9a-f]{12}$ ]] || fail "backend_release must be backend-core-<12 hex>"
          [[ "$JIRA_KEY" =~ ^RT-[1-9][0-9]*$ ]] || fail "jira_key must be RT-<number>"
          [ "$TARGET" = "lab-01" ] || fail "target must be lab-01"
          if [ -n "$CURRENT_RELEASE" ]; then
            [[ "$CURRENT_RELEASE" =~ ^backend-core-[0-9a-f]{12}$ ]] || fail "current_release must be empty or backend-core-<12 hex>"
          fi
          case "$DRY_RUN" in true | false) ;; *) fail "dry_run must be true or false" ;; esac
          # G-Prov: a live run plans the schema and rollback against the release lab-01 must prove it runs.
          if [ "$DRY_RUN" = "false" ] && [ -z "$CURRENT_RELEASE" ]; then
            fail "a live run (dry_run=false) needs current_release: the release lab-01 runs now"
          fi

      # No `ref:` on purpose: the verifier runs from the dispatched main commit,
      # never from the release under test. Full history and tags so `git ls-tree`
      # and `git rev-parse` can read any release reachable from main.
      - name: Checkout main
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Log in to GHCR (read-only, for attestation verification)
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect release evidence (read-only GitHub API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BACKEND_RELEASE: ${{ inputs.backend_release }}
          CURRENT_RELEASE: ${{ inputs.current_release }}
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/evidence"
          mkdir -p "$EVIDENCE/release" "$EVIDENCE/bundle"
          # Any early stop is recorded as evidence, so the verifier (which still
          # runs) puts it in the ledger as the first refusal.
          fail() { echo "::error::$*"; echo "$*" >> "$EVIDENCE/collect-error.txt"; exit 1; }
          trap 'echo "stopped at line $LINENO: $BASH_COMMAND" >> "$EVIDENCE/collect-error.txt"' ERR

          gh release view "$BACKEND_RELEASE" --repo "$REPO" \
            --json tagName,targetCommitish,isDraft,isPrerelease,isImmutable,assets > "$EVIDENCE/release.json"
          SHA="$(jq -r .targetCommitish "$EVIDENCE/release.json")"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || fail "release target is not a 40-hex commit SHA"
          # The git tag itself must point at that commit; the verifier compares them.
          git rev-parse --verify --quiet "refs/tags/$BACKEND_RELEASE^{commit}" > "$EVIDENCE/tag-commit.txt" || true

          # Verify the asset checksums before unpacking anything. SHA256SUMS must
          # cover both assets, and the tarball may hold only regular files and
          # directories under its one top-level directory: no links, devices,
          # absolute paths or `..`.
          BUNDLE="backend-core-release-${SHA:0:12}"
          TARBALL="$EVIDENCE/release/$BUNDLE.tar.gz"
          # Download only the three expected assets, each size-checked from the
          # release metadata first, so extra or oversized assets never reach disk.
          MAX_ASSET_BYTES=$((16 * 1024 * 1024))
          jq -e --arg tarball "$BUNDLE.tar.gz" --argjson max "$MAX_ASSET_BYTES" '
            ([.assets[].name] | sort) == ([$tarball, "release-manifest.json", "SHA256SUMS"] | sort)
            and all(.assets[]; (.size | type) == "number" and .size <= $max)' "$EVIDENCE/release.json" > /dev/null \
            || fail "release assets are not exactly $BUNDLE.tar.gz, release-manifest.json and SHA256SUMS, each within $MAX_ASSET_BYTES bytes"
          gh release download "$BACKEND_RELEASE" --repo "$REPO" --dir "$EVIDENCE/release" \
            --pattern "$BUNDLE.tar.gz" --pattern release-manifest.json --pattern SHA256SUMS
          # SHA256SUMS must name exactly the two assets, so sha256sum never opens
          # anything else (an extra entry such as /dev/zero would hang the check).
          awk -v t="$BUNDLE.tar.gz" '
            { h = substr($0, 1, 64); n = substr($0, 67) }
            length($0) < 67 || h !~ /^[0-9a-f]+$/ || substr($0, 65, 2) != "  " { bad = 1 }
            { seen[n]++; lines++ }
            END { exit !(!bad && lines == 2 && seen[t] == 1 && seen["release-manifest.json"] == 1) }' \
            "$EVIDENCE/release/SHA256SUMS" \
            || fail "SHA256SUMS must list exactly $BUNDLE.tar.gz and release-manifest.json"
          (cd "$EVIDENCE/release" && sha256sum --check --strict SHA256SUMS) \
            || fail "release assets do not match SHA256SUMS"
          # Bound the bundle before any tar call decompresses it: a real bundle is
          # well under 1 MiB expanded, so a gzip bomb stops here, reading at most
          # MAX_BUNDLE_BYTES + 1 bytes and writing nothing to disk.
          MAX_BUNDLE_BYTES=$((16 * 1024 * 1024))
          MAX_BUNDLE_ENTRIES=500
          EXPANDED="$(gzip -dc "$TARBALL" | head -c "$((MAX_BUNDLE_BYTES + 1))" | wc -c)" || true
          [[ "$EXPANDED" =~ ^[0-9]+$ ]] || fail "could not measure the expanded bundle size"
          [ "$EXPANDED" -le "$MAX_BUNDLE_BYTES" ] || fail "bundle expands beyond $MAX_BUNDLE_BYTES bytes"
          # Numeric owners keep the size in column 3 whatever the owner names say.
          LISTED="$(tar -tvzf "$TARBALL" --numeric-owner)"
          TYPES="$(cut -c1 <<<"$LISTED" | sort -u | tr -d '\n')"
          [[ "$TYPES" =~ ^[-d]+$ ]] || fail "bundle holds an entry that is not a regular file or directory"
          # A sparse member compresses to almost nothing, so cap the sizes tar reports too.
          LOGICAL="$(awk '{ s += $3 } END { printf "%d", s }' <<<"$LISTED")"
          [ "$LOGICAL" -le "$MAX_BUNDLE_BYTES" ] || fail "bundle members total more than $MAX_BUNDLE_BYTES bytes"
          ENTRIES="$(tar -tzf "$TARBALL")"
          [ "$(wc -l <<<"$ENTRIES")" -le "$MAX_BUNDLE_ENTRIES" ] || fail "bundle has more than $MAX_BUNDLE_ENTRIES entries"
          while IFS= read -r ENTRY; do
            case "$ENTRY" in "$BUNDLE"/*) ;; *) fail "bundle entry outside $BUNDLE/" ;; esac
            case "$ENTRY" in /* | *..* | *\\*) fail "unsafe bundle entry path" ;; *) ;; esac
          done <<<"$ENTRIES"
          tar -xzf "$TARBALL" -C "$EVIDENCE/bundle" --no-same-owner --no-same-permissions

          gh api "repos/$REPO/compare/$SHA...main" \
            --jq '{status, ahead_by, behind_by, merge_base: .merge_base_commit.sha}' > "$EVIDENCE/compare.json"
          gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | {name, conclusion, slug: .app.slug, started_at}' | jq -s . > "$EVIDENCE/check-runs.json"

          if git cat-file -e "$SHA^{commit}" 2>/dev/null; then
            git ls-tree "$SHA" packages/db/drizzle/ > "$EVIDENCE/migrations-target.txt"
            # Bundled files must be byte-for-byte the files at the release commit,
            # not just self-consistent. The archive is this repository's own git
            # objects, never release content; line endings are never converted.
            mkdir -p "$EVIDENCE/source"
            git -c core.autocrlf=false archive --format=tar "$SHA" | tar -x -C "$EVIDENCE/source"
          fi

          # A failed verification leaves no file; the verifier refuses on a missing attestation.
          for TARGET in api worker migrate; do
            DIGEST="$(jq -r --arg t "$TARGET" '.images[$t].digest // ""' "$EVIDENCE/release/release-manifest.json")"
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::warning::no valid $TARGET digest in the manifest"; continue; }
            if ! gh attestation verify "oci://ghcr.io/kemetra/backend-core-$TARGET@$DIGEST" \
              --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release-images.yml" \
              --source-digest "$SHA" \
              --source-ref refs/heads/main \
              --format json > "$EVIDENCE/attest-$TARGET.json"; then
              rm -f "$EVIDENCE/attest-$TARGET.json"
              echo "::warning::attestation verification failed for $TARGET"
            fi
          done

          # The operator-asserted current release gets the same tag and ancestry evidence.
          if [ -n "$CURRENT_RELEASE" ]; then
            if gh release view "$CURRENT_RELEASE" --repo "$REPO" \
              --json tagName,targetCommitish,isDraft,isPrerelease,isImmutable > "$EVIDENCE/current-release.json"; then
              CURRENT_SHA="$(jq -r .targetCommitish "$EVIDENCE/current-release.json")"
              if [[ "$CURRENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                git rev-parse --verify --quiet "refs/tags/$CURRENT_RELEASE^{commit}" > "$EVIDENCE/current-tag-commit.txt" || true
                gh api "repos/$REPO/compare/$CURRENT_SHA...main" \
                  --jq '{status, ahead_by, behind_by, merge_base: .merge_base_commit.sha}' > "$EVIDENCE/compare-current.json" \
                  || rm -f "$EVIDENCE/compare-current.json"
                if git cat-file -e "$CURRENT_SHA^{commit}" 2>/dev/null; then
                  git ls-tree "$CURRENT_SHA" packages/db/drizzle/ > "$EVIDENCE/migrations-current.txt"
                fi
              fi
            else
              rm -f "$EVIDENCE/current-release.json"
            fi
          fi

          # Report the approval gate; never create it. The token may not be allowed
          # to see environments, so a 404 is "not-visible", not proof it is missing.
          if OUT="$(gh api "repos/$REPO/environments/aws-lab" 2>&1)"; then
            jq '{status: "present", reviewers: ([.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length)}' \
              <<<"$OUT" > "$EVIDENCE/environment.json"
          elif grep -q "Not Found" <<<"$OUT"; then
            echo '{"status":"not-visible","reviewers":0}' > "$EVIDENCE/environment.json"
          else
            echo '{"status":"unknown","reviewers":0}' > "$EVIDENCE/environment.json"
          fi

      # Drops the registry credential however evidence collection ended, before
      # the verifier reads any release content.
      - name: Log out of GHCR
        id: logout
        if: always()
        run: |
          set -euo pipefail
          docker logout ghcr.io > /dev/null

      # Runs even when evidence collection stopped early, so every refusal ends
      # up in the ledger; never after a failed guard, checkout or logout.
      - name: Verify evidence and write the planned ledger (no deploy)
        id: verify
        if: ${{ !cancelled() && steps.guard.outcome == 'success' && steps.checkout.outcome == 'success' && steps.logout.outcome == 'success' }}
        env:
          BACKEND_RELEASE: ${{ inputs.backend_release }}
          JIRA_KEY: ${{ inputs.jira_key }}
          TARGET: ${{ inputs.target }}
          CURRENT_RELEASE: ${{ inputs.current_release }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node deploy/lab/verify-release.cjs \
            --evidence "$RUNNER_TEMP/evidence" --out "$RUNNER_TEMP/ledger" \
            --release "$BACKEND_RELEASE" --jira-key "$JIRA_KEY" --target "$TARGET" \
            --current-release "$CURRENT_RELEASE" \
            --actor "$ACTOR" --run-url "$RUN_URL" \
            --mode dry-run

      # Only a planned (0-refusal) ledger reaches here; its non-secret plan feeds the live job.
      - name: Export the verified plan for the live job
        id: plan
        run: |
          set -euo pipefail
          LEDGER="$RUNNER_TEMP/ledger/ledger.json"
          jq -e '.outcome == "planned" and (.refusals | length) == 0' "$LEDGER" > /dev/null || { echo "::error::ledger is not a planned, 0-refusal ledger"; exit 1; }
          SHA="$(jq -r '.release.sha' "$LEDGER")"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::ledger release SHA is not 40 hex"; exit 1; }
          echo "release_sha=$SHA" >> "$GITHUB_OUTPUT"
          for TARGET in api worker migrate; do
            DIGEST="$(jq -r --arg t "$TARGET" '.images[$t].digest // ""' "$LEDGER")"
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::ledger has no $TARGET digest"; exit 1; }
            echo "${TARGET}_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          done
          # App-only rollback only when the verifier compared the two releases and found no schema change.
          ROLLBACK="$(jq -r '(.plan.migrations.added != null and .plan.migrations.rollback.allowed == true) | tostring' "$LEDGER")"
          echo "rollback_allowed=$ROLLBACK" >> "$GITHUB_OUTPUT"

      - name: Add the ledger to the run summary
        if: always()
        run: |
          set -euo pipefail
          SUMMARY="$RUNNER_TEMP/ledger/summary.md"
          if [ -f "$SUMMARY" ]; then cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the planned ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-lab-ledger-${{ github.run_id }}
          path: ${{ runner.temp }}/ledger/
          if-no-files-found: warn
          retention-days: 30

  live:
    name: live deploy (aws-lab, OIDC, SSM backup + deploy)
    # Only after a preflight with 0 refusals, and never for a dry run: a dry run
    # never reaches the environment, so it never asks for an approval.
    needs: preflight
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: aws-lab
    permissions:
      contents: read # checkout of main for the claim printer
      id-token: write # the OIDC token for the deploy role; nothing else is granted
    steps:
      - name: Guard (main only, live run, verified plan)
        env:
          RUN_REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
          BACKEND_RELEASE: ${{ inputs.backend_release }}
          CURRENT_RELEASE: ${{ inputs.current_release }}
          JIRA_KEY: ${{ inputs.jira_key }}
          TARGET: ${{ inputs.target }}
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          API_DIGEST: ${{ needs.preflight.outputs.api_digest }}
          WORKER_DIGEST: ${{ needs.preflight.outputs.worker_digest }}
          MIGRATE_DIGEST: ${{ needs.preflight.outputs.migrate_digest }}
          ROLLBACK_ALLOWED: ${{ needs.preflight.outputs.rollback_allowed }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [ "$RUN_REF" = "refs/heads/main" ] || fail "must be dispatched from refs/heads/main"
          [ "$DRY_RUN" = "false" ] || fail "the live job runs only when dry_run=false"
          [[ "$BACKEND_RELEASE" =~ ^backend-core-[0-9a-f]{12}$ ]] || fail "backend_release must be backend-core-<12 hex>"
          [[ "$CURRENT_RELEASE" =~ ^backend-core-[0-9a-f]{12}$ ]] || fail "a live run needs current_release backend-core-<12 hex>"
          [[ "$JIRA_KEY" =~ ^RT-[1-9][0-9]{0,5}$ ]] || fail "jira_key must be RT-<number>"
          [ "$TARGET" = "lab-01" ] || fail "target must be lab-01"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "${RELEASE_SHA:0:12}" = "${BACKEND_RELEASE#backend-core-}" ] \
            || fail "preflight plan does not name the release commit"
          for DIGEST in "$API_DIGEST" "$WORKER_DIGEST" "$MIGRATE_DIGEST"; do
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "preflight plan lacks a registry digest"
          done
          [[ "$ROLLBACK_ALLOWED" =~ ^(true|false)$ ]] || fail "preflight plan lacks the rollback rule"

      # Fails closed until the owner sets both non-secret variables on the aws-lab
      # environment (RT-532 S2). Runs before any token is requested.
      - name: Check the deploy variables (fail closed when unset)
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [ -n "${AWS_ROLE_ARN:-}" ] || fail "AWS_ROLE_ARN is not set on the aws-lab environment: the live deploy stays off until the owner provisions the OIDC role (RT-532 S2)"
          [ -n "${AWS_REGION:-}" ] || fail "AWS_REGION is not set on the aws-lab environment: the live deploy stays off until the owner sets it (RT-532 S2)"
          [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,128}$ ]] \
            || fail "AWS_ROLE_ARN must be an IAM role ARN (never root, a user or an access key)"
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]$ ]] || fail "AWS_REGION must be a region name such as us-east-1"

      # No `ref:` on purpose: the claim printer runs from the dispatched main commit.
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # RT-532 c12879: print the non-secret trust-policy claims before the first
      # assume, so a deny is diagnosed from claims, not guessed. Informational:
      # AWS STS decides; the token itself is masked and never printed.
      - name: Print the OIDC claims (non-secret, informational)
        env:
          JIRA_KEY: ${{ inputs.jira_key }}
        run: |
          set -euo pipefail
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] \
            || { echo "::error::no OIDC request variables: the job needs id-token: write"; exit 1; }
          echo "::add-mask::$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          RESPONSE="$(curl --silent --show-error --fail --max-time 20 \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")" || { echo "::error::the OIDC token request failed"; exit 1; }
          TOKEN="$(jq -er .value <<<"$RESPONSE" 2>/dev/null)" || { echo "::error::the OIDC response held no token"; exit 1; }
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" | node deploy/lab/oidc-claims-check.cjs \
            --jira-key "$JIRA_KEY" --workflow-file deploy-lab.yml --summary "$GITHUB_STEP_SUMMARY" \
            || echo "::warning::a claim differs from the RT-532 trust design; see the step summary (AWS STS still decides)"

      - name: Assume the deploy role (GitHub OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: rt-deploy-lab-${{ github.run_id }}
          role-duration-seconds: 3600

      # Exactly two document runs: the lab-02 backup, then the lab-01 deploy. The
      # documents print only fixed RT_* lines; only lines matching the strict
      # pattern below ever reach this public log or the ledger.
      - name: Run the SSM gates (backup on lab-02, then deploy on lab-01)
        id: ssm
        env:
          BACKEND_RELEASE: ${{ inputs.backend_release }}
          CURRENT_RELEASE: ${{ inputs.current_release }}
          JIRA_KEY: ${{ inputs.jira_key }}
          API_DIGEST: ${{ needs.preflight.outputs.api_digest }}
          WORKER_DIGEST: ${{ needs.preflight.outputs.worker_digest }}
          MIGRATE_DIGEST: ${{ needs.preflight.outputs.migrate_digest }}
          ROLLBACK_ALLOWED: ${{ needs.preflight.outputs.rollback_allowed }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          LIVE="$RUNNER_TEMP/live"
          mkdir -p "$LIVE"
          fail() { echo "::error::$*"; echo "$*" > "$LIVE/failure.txt"; exit 1; }
          RESULT_RE='^RT_(GATE|FAIL|PRIOR|TARGET|BACKUP|REVERT|DONE)( [A-Za-z0-9=:._/-]+)*$'

          # One Online managed node per lab host, found by its owner-set tags.
          node_for() {
            local ids
            ids="$(aws ssm describe-instance-information \
              --filters "Key=tag:Environment,Values=lab" "Key=tag:Host,Values=$1" "Key=PingStatus,Values=Online" \
              --query 'InstanceInformationList[].InstanceId' --output text)" || return 1
            [[ "$ids" =~ ^mi-[0-9a-f]{17}$ ]] || return 1
            printf '%s' "$ids"
          }

          # run_document <label> <node> <document> <params file> <deadline seconds>
          run_document() {
            local label="$1" node="$2" doc="$3" params="$4" limit="$5" cmd status deadline
            cmd="$(aws ssm send-command --instance-ids "$node" --document-name "$doc" --document-version '$DEFAULT' \
              --parameters "file://$params" --timeout-seconds 600 --comment "deploy-lab run $RUN_ID $JIRA_KEY" \
              --query Command.CommandId --output text)" || fail "$label: send-command was refused"
            [[ "$cmd" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || fail "$label: no command ID"
            echo "$label: command $cmd on $node"
            status=Pending
            deadline=$(( $(date +%s) + limit ))
            while [ "$(date +%s)" -lt "$deadline" ]; do
              sleep 15
              status="$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$node" \
                --query Status --output text 2>/dev/null || echo Pending)"
              case "$status" in Success | Failed | Cancelled | TimedOut | Undeliverable | Terminated) break ;; *) ;; esac
            done
            echo "$status" > "$LIVE/$label.status"
            # The raw output never reaches the log: only strict RT_* lines are kept.
            aws ssm get-command-invocation --command-id "$cmd" --instance-id "$node" \
              --query StandardOutputContent --output text 2>/dev/null \
              | grep -E "$RESULT_RE" > "$LIVE/$label.lines" || true
            cat "$LIVE/$label.lines"
            [ "$status" = Success ] || fail "$label: document ended $status"
          }

          LAB01="$(node_for lab-01)" || fail "no single Online SSM node tagged Environment=lab, Host=lab-01"
          LAB02="$(node_for lab-02)" || fail "no single Online SSM node tagged Environment=lab, Host=lab-02"

          jq -n --arg t "$BACKEND_RELEASE" --arg c "$CURRENT_RELEASE" --arg j "$JIRA_KEY" \
            '{ReleaseTag: [$t], CurrentRelease: [$c], JiraKey: [$j]}' > "$LIVE/backup-params.json"
          run_document backup "$LAB02" RT-BackendLabBackup "$LIVE/backup-params.json" 960

          BACKUP_LINE="$(grep -E '^RT_BACKUP name=rtlab-[0-9a-f]{12}-to-[0-9a-f]{12}-[0-9]{8}T[0-9]{6}Z\.dump sha256=[0-9a-f]{64}$' "$LIVE/backup.lines" || true)"
          [ "$(grep -c . <<<"$BACKUP_LINE" || true)" = 1 ] || fail "backup: no single backup reference reported"
          BACKUP_NAME="$(sed -E 's/^RT_BACKUP name=([^ ]+) sha256=.*$/\1/' <<<"$BACKUP_LINE")"
          BACKUP_SHA256="$(sed -E 's/^.* sha256=([0-9a-f]{64})$/\1/' <<<"$BACKUP_LINE")"

          jq -n --arg t "$BACKEND_RELEASE" --arg c "$CURRENT_RELEASE" --arg j "$JIRA_KEY" \
            --arg a "$API_DIGEST" --arg w "$WORKER_DIGEST" --arg m "$MIGRATE_DIGEST" \
            --arg bn "$BACKUP_NAME" --arg bs "$BACKUP_SHA256" --arg r "$ROLLBACK_ALLOWED" \
            '{ReleaseTag: [$t], CurrentRelease: [$c], JiraKey: [$j], ApiDigest: [$a], WorkerDigest: [$w],
              MigrateDigest: [$m], BackupName: [$bn], BackupSha256: [$bs], RollbackAllowed: [$r]}' > "$LIVE/deploy-params.json"
          # Each poll window is its document's timeoutSeconds (900 / 1800) plus a minute; both fit the 3600 s
          # role session. The host auto-revert covers a run this job stops waiting for.
          run_document deploy "$LAB01" RT-BackendLabDeploy "$LIVE/deploy-params.json" 1860
          grep -qx "RT_DONE release=$BACKEND_RELEASE" "$LIVE/deploy.lines" || fail "deploy: the document did not report completion"

      # The live ledger: prior/target digests, backup reference, gate results and
      # the failure boundary, built only from the strict RT_* lines. No secrets.
      - name: Write the live ledger
        if: always()
        env:
          BACKEND_RELEASE: ${{ inputs.backend_release }}
          CURRENT_RELEASE: ${{ inputs.current_release }}
          JIRA_KEY: ${{ inputs.jira_key }}
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          ROLLBACK_ALLOWED: ${{ needs.preflight.outputs.rollback_allowed }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SSM_OUTCOME: ${{ steps.ssm.outcome }}
        run: |
          set -euo pipefail
          LIVE="$RUNNER_TEMP/live"
          OUT="$RUNNER_TEMP/live-ledger"
          mkdir -p "$LIVE" "$OUT"
          lines() { if [ -f "$LIVE/$1.lines" ]; then cat "$LIVE/$1.lines"; fi; }
          FAILURE="$(cat "$LIVE/failure.txt" 2>/dev/null || true)"
          if [ -z "$FAILURE" ] && [ "$SSM_OUTCOME" != success ]; then
            FAILURE="live job stopped before the SSM gates (outcome: ${SSM_OUTCOME:-not-run})"
          fi
          jq -n \
            --arg release "$BACKEND_RELEASE" --arg sha "$RELEASE_SHA" --arg current "$CURRENT_RELEASE" \
            --arg jira "$JIRA_KEY" --arg actor "$ACTOR" --arg run "$RUN_URL" --arg rollback "$ROLLBACK_ALLOWED" \
            --arg failure "$FAILURE" --arg backup "$(lines backup)" --arg deploy "$(lines deploy)" '
            def kv: split(" ")[1:] | map(capture("^(?<key>[^=]+)=(?<value>.*)$")) | from_entries;
            def rows: split("\n") | map(select(length > 0));
            (($backup | rows) + ($deploy | rows)) as $all
            | {
                schemaVersion: 1,
                kind: "rt842-lab-live-ledger",
                mode: "live",
                outcome: (if $failure == "" and ($all | any(. == "RT_DONE release=" + $release)) then "deployed" else "failed" end),
                jiraKey: $jira, actor: $actor, runUrl: $run, generatedAt: (now | todate),
                target: {host: "lab-01", environment: "aws-lab"},
                release: {tag: $release, sha: $sha},
                current: {tag: $current, source: "host-verified by RT-BackendLabDeploy G-Host"},
                prior: ([$all[] | select(startswith("RT_PRIOR ")) | kv] | first),
                targetDigests: ([$all[] | select(startswith("RT_TARGET ")) | kv] | first),
                backup: ([$all[] | select(startswith("RT_BACKUP ")) | kv] | first),
                rollbackAllowed: ($rollback == "true"),
                gates: [$all[] | select(startswith("RT_GATE ")) | split(" ") | {gate: .[1], result: .[2]}],
                revert: [$all[] | select(startswith("RT_REVERT "))],
                failureBoundary: ([$all[] | select(startswith("RT_FAIL ")) | kv] | first // (if $failure == "" then null else {reason: $failure} end))
              }' > "$OUT/ledger.json"
          {
            echo "## Lab deploy live: $(jq -r '.outcome | ascii_upcase' "$OUT/ledger.json")"
            echo
            echo "Release $BACKEND_RELEASE ($RELEASE_SHA) over $CURRENT_RELEASE on lab-01, $JIRA_KEY. App-only rollback allowed: $ROLLBACK_ALLOWED."
            echo
            echo '```'
            lines backup
            lines deploy
            echo '```'
            if [ -n "$FAILURE" ]; then echo; echo "Failure boundary: $FAILURE"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the live ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-lab-live-ledger-${{ github.run_id }}
          path: ${{ runner.temp }}/live-ledger/
          if-no-files-found: warn
          retention-days: 90
