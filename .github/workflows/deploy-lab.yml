# RT-703: manual, approval-gated AWS lab deploy for Backend-Core, slice 1.
#
# THIS SLICE IS A PREFLIGHT / DRY RUN ONLY. It verifies an already published,
# immutable Backend-Core release (see release-images.yml) and writes a planned
# deployment ledger as a workflow artifact. It deploys nothing: no AWS, no SSH,
# no SSM, no host access, no secrets beyond the read-only GITHUB_TOKEN.
#
# No job references a GitHub Environment on purpose. GitHub creates a missing
# environment, with no protection rules, the first time a job names it, which
# would silently create an unprotected `aws-lab` gate. A live path needs the
# owner-provisioned `aws-lab` environment with a required reviewer and an
# approved OIDC -> IAM role -> SSM transport first (separate owner gates), so
# `dry_run: false` is refused by the guard below.
#
# Fails closed: any guard or evidence that cannot be evaluated is a refusal.
name: Deploy lab

"on":
  workflow_dispatch:
    inputs:
      backend_release:
        description: Published release tag backend-core-<sha12> (any release reachable from main)
        required: true
        type: string
      jira_key:
        description: Jira issue authorizing this run (RT-<number>)
        required: true
        type: string
      target:
        description: Lab host (Backend-Core only)
        required: true
        type: choice
        options:
          - lab-01
        default: lab-01
      current_release:
        description: Optional release tag the host is believed to run (operator-asserted, used for the migration/rollback plan)
        required: false
        type: string
        default: ""
      dry_run:
        description: Preflight only. Must stay true; live deploy is not enabled in this slice
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  group: deploy-aws-lab
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight (verify release, planned ledger, no deploy)
    # No job-level `if` on purpose: a dispatch from any other ref must FAIL in
    # the first step below, not be silently skipped as a green run.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout, release assets, compare
      checks: read # check runs on the release commit
      packages: read # GHCR login for attestation verification
      attestations: read # gh attestation verify
      actions: read # read (never create) the aws-lab environment
    steps:
      - name: Guard (main only, validated inputs, dry run only)
        id: guard
        env:
          RUN_REF: ${{ github.ref }}
          BACKEND_RELEASE: ${{ inputs.backend_release }}
          JIRA_KEY: ${{ inputs.jira_key }}
          TARGET: ${{ inputs.target }}
          CURRENT_RELEASE: ${{ inputs.current_release }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [ "$RUN_REF" = "refs/heads/main" ] || fail "must be dispatched from refs/heads/main"
          [[ "$BACKEND_RELEASE" =~ ^backend-core-[0-9a-f]{12}$ ]] || fail "backend_release must be backend-core-<12 hex>"
          [[ "$JIRA_KEY" =~ ^RT-[1-9][0-9]*$ ]] || fail "jira_key must be RT-<number>"
          [ "$TARGET" = "lab-01" ] || fail "target must be lab-01"
          if [ -n "$CURRENT_RELEASE" ]; then
            [[ "$CURRENT_RELEASE" =~ ^backend-core-[0-9a-f]{12}$ ]] || fail "current_release must be empty or backend-core-<12 hex>"
          fi
          [ "$DRY_RUN" = "true" ] || fail "live deploy not enabled: RT-703 slice 1 is dry run only; a live run needs the aws-lab environment, a required reviewer and an approved transport (separate owner gate)"

      # No `ref:` on purpose: the verifier runs from the dispatched main commit,
      # never from the release under test. Full history and tags so `git ls-tree`
      # and `git rev-parse` can read any release reachable from main.
      - name: Checkout main
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Log in to GHCR (read-only, for attestation verification)
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect release evidence (read-only GitHub API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BACKEND_RELEASE: ${{ inputs.backend_release }}
          CURRENT_RELEASE: ${{ inputs.current_release }}
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/evidence"
          mkdir -p "$EVIDENCE/release" "$EVIDENCE/bundle"
          # Any early stop is recorded as evidence, so the verifier (which still
          # runs) puts it in the ledger as the first refusal.
          fail() { echo "::error::$*"; echo "$*" >> "$EVIDENCE/collect-error.txt"; exit 1; }
          trap 'echo "stopped at line $LINENO: $BASH_COMMAND" >> "$EVIDENCE/collect-error.txt"' ERR

          gh release view "$BACKEND_RELEASE" --repo "$REPO" \
            --json tagName,targetCommitish,isDraft,isPrerelease,isImmutable,assets > "$EVIDENCE/release.json"
          SHA="$(jq -r .targetCommitish "$EVIDENCE/release.json")"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || fail "release target is not a 40-hex commit SHA"
          # The git tag itself must point at that commit; the verifier compares them.
          git rev-parse --verify --quiet "refs/tags/$BACKEND_RELEASE^{commit}" > "$EVIDENCE/tag-commit.txt" || true

          # Verify the asset checksums before unpacking anything. SHA256SUMS must
          # cover both assets, and the tarball may hold only regular files and
          # directories under its one top-level directory: no links, devices,
          # absolute paths or `..`.
          BUNDLE="backend-core-release-${SHA:0:12}"
          TARBALL="$EVIDENCE/release/$BUNDLE.tar.gz"
          # Download only the three expected assets, each size-checked from the
          # release metadata first, so extra or oversized assets never reach disk.
          MAX_ASSET_BYTES=$((16 * 1024 * 1024))
          jq -e --arg tarball "$BUNDLE.tar.gz" --argjson max "$MAX_ASSET_BYTES" '
            ([.assets[].name] | sort) == ([$tarball, "release-manifest.json", "SHA256SUMS"] | sort)
            and all(.assets[]; (.size | type) == "number" and .size <= $max)' "$EVIDENCE/release.json" > /dev/null \
            || fail "release assets are not exactly $BUNDLE.tar.gz, release-manifest.json and SHA256SUMS, each within $MAX_ASSET_BYTES bytes"
          gh release download "$BACKEND_RELEASE" --repo "$REPO" --dir "$EVIDENCE/release" \
            --pattern "$BUNDLE.tar.gz" --pattern release-manifest.json --pattern SHA256SUMS
          # SHA256SUMS must name exactly the two assets, so sha256sum never opens
          # anything else (an extra entry such as /dev/zero would hang the check).
          awk -v t="$BUNDLE.tar.gz" '
            { h = substr($0, 1, 64); n = substr($0, 67) }
            length($0) < 67 || h !~ /^[0-9a-f]+$/ || substr($0, 65, 2) != "  " { bad = 1 }
            { seen[n]++; lines++ }
            END { exit !(!bad && lines == 2 && seen[t] == 1 && seen["release-manifest.json"] == 1) }' \
            "$EVIDENCE/release/SHA256SUMS" \
            || fail "SHA256SUMS must list exactly $BUNDLE.tar.gz and release-manifest.json"
          (cd "$EVIDENCE/release" && sha256sum --check --strict SHA256SUMS) \
            || fail "release assets do not match SHA256SUMS"
          # Bound the bundle before any tar call decompresses it: a real bundle is
          # well under 1 MiB expanded, so a gzip bomb stops here, reading at most
          # MAX_BUNDLE_BYTES + 1 bytes and writing nothing to disk.
          MAX_BUNDLE_BYTES=$((16 * 1024 * 1024))
          MAX_BUNDLE_ENTRIES=500
          EXPANDED="$(gzip -dc "$TARBALL" | head -c "$((MAX_BUNDLE_BYTES + 1))" | wc -c)" || true
          [[ "$EXPANDED" =~ ^[0-9]+$ ]] || fail "could not measure the expanded bundle size"
          [ "$EXPANDED" -le "$MAX_BUNDLE_BYTES" ] || fail "bundle expands beyond $MAX_BUNDLE_BYTES bytes"
          # Numeric owners keep the size in column 3 whatever the owner names say.
          LISTED="$(tar -tvzf "$TARBALL" --numeric-owner)"
          TYPES="$(cut -c1 <<<"$LISTED" | sort -u | tr -d '\n')"
          [[ "$TYPES" =~ ^[-d]+$ ]] || fail "bundle holds an entry that is not a regular file or directory"
          # A sparse member compresses to almost nothing, so cap the sizes tar reports too.
          LOGICAL="$(awk '{ s += $3 } END { printf "%d", s }' <<<"$LISTED")"
          [ "$LOGICAL" -le "$MAX_BUNDLE_BYTES" ] || fail "bundle members total more than $MAX_BUNDLE_BYTES bytes"
          ENTRIES="$(tar -tzf "$TARBALL")"
          [ "$(wc -l <<<"$ENTRIES")" -le "$MAX_BUNDLE_ENTRIES" ] || fail "bundle has more than $MAX_BUNDLE_ENTRIES entries"
          while IFS= read -r ENTRY; do
            case "$ENTRY" in "$BUNDLE"/*) ;; *) fail "bundle entry outside $BUNDLE/" ;; esac
            case "$ENTRY" in /* | *..* | *\\*) fail "unsafe bundle entry path" ;; *) ;; esac
          done <<<"$ENTRIES"
          tar -xzf "$TARBALL" -C "$EVIDENCE/bundle" --no-same-owner --no-same-permissions

          gh api "repos/$REPO/compare/$SHA...main" \
            --jq '{status, ahead_by, behind_by, merge_base: .merge_base_commit.sha}' > "$EVIDENCE/compare.json"
          gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | {name, conclusion, slug: .app.slug, started_at}' | jq -s . > "$EVIDENCE/check-runs.json"

          if git cat-file -e "$SHA^{commit}" 2>/dev/null; then
            git ls-tree "$SHA" packages/db/drizzle/ > "$EVIDENCE/migrations-target.txt"
            # Bundled files must be byte-for-byte the files at the release commit,
            # not just self-consistent. The archive is this repository's own git
            # objects, never release content; line endings are never converted.
            mkdir -p "$EVIDENCE/source"
            git -c core.autocrlf=false archive --format=tar "$SHA" | tar -x -C "$EVIDENCE/source"
          fi

          # A failed verification leaves no file; the verifier refuses on a missing attestation.
          for TARGET in api worker migrate; do
            DIGEST="$(jq -r --arg t "$TARGET" '.images[$t].digest // ""' "$EVIDENCE/release/release-manifest.json")"
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::warning::no valid $TARGET digest in the manifest"; continue; }
            if ! gh attestation verify "oci://ghcr.io/kemetra/backend-core-$TARGET@$DIGEST" \
              --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release-images.yml" \
              --source-digest "$SHA" \
              --source-ref refs/heads/main \
              --format json > "$EVIDENCE/attest-$TARGET.json"; then
              rm -f "$EVIDENCE/attest-$TARGET.json"
              echo "::warning::attestation verification failed for $TARGET"
            fi
          done

          # The operator-asserted current release gets the same tag and ancestry evidence.
          if [ -n "$CURRENT_RELEASE" ]; then
            if gh release view "$CURRENT_RELEASE" --repo "$REPO" \
              --json tagName,targetCommitish,isDraft,isPrerelease,isImmutable > "$EVIDENCE/current-release.json"; then
              CURRENT_SHA="$(jq -r .targetCommitish "$EVIDENCE/current-release.json")"
              if [[ "$CURRENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                git rev-parse --verify --quiet "refs/tags/$CURRENT_RELEASE^{commit}" > "$EVIDENCE/current-tag-commit.txt" || true
                gh api "repos/$REPO/compare/$CURRENT_SHA...main" \
                  --jq '{status, ahead_by, behind_by, merge_base: .merge_base_commit.sha}' > "$EVIDENCE/compare-current.json" \
                  || rm -f "$EVIDENCE/compare-current.json"
                if git cat-file -e "$CURRENT_SHA^{commit}" 2>/dev/null; then
                  git ls-tree "$CURRENT_SHA" packages/db/drizzle/ > "$EVIDENCE/migrations-current.txt"
                fi
              fi
            else
              rm -f "$EVIDENCE/current-release.json"
            fi
          fi

          # Report the approval gate; never create it. The token may not be allowed
          # to see environments, so a 404 is "not-visible", not proof it is missing.
          if OUT="$(gh api "repos/$REPO/environments/aws-lab" 2>&1)"; then
            jq '{status: "present", reviewers: ([.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length)}' \
              <<<"$OUT" > "$EVIDENCE/environment.json"
          elif grep -q "Not Found" <<<"$OUT"; then
            echo '{"status":"not-visible","reviewers":0}' > "$EVIDENCE/environment.json"
          else
            echo '{"status":"unknown","reviewers":0}' > "$EVIDENCE/environment.json"
          fi

      # Drops the registry credential however evidence collection ended, before
      # the verifier reads any release content.
      - name: Log out of GHCR
        id: logout
        if: always()
        run: |
          set -euo pipefail
          docker logout ghcr.io > /dev/null

      # Runs even when evidence collection stopped early, so every refusal ends
      # up in the ledger; never after a failed guard, checkout or logout.
      - name: Verify evidence and write the planned ledger (no deploy)
        if: ${{ !cancelled() && steps.guard.outcome == 'success' && steps.checkout.outcome == 'success' && steps.logout.outcome == 'success' }}
        env:
          BACKEND_RELEASE: ${{ inputs.backend_release }}
          JIRA_KEY: ${{ inputs.jira_key }}
          TARGET: ${{ inputs.target }}
          CURRENT_RELEASE: ${{ inputs.current_release }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node deploy/lab/verify-release.cjs \
            --evidence "$RUNNER_TEMP/evidence" --out "$RUNNER_TEMP/ledger" \
            --release "$BACKEND_RELEASE" --jira-key "$JIRA_KEY" --target "$TARGET" \
            --current-release "$CURRENT_RELEASE" \
            --actor "$ACTOR" --run-url "$RUN_URL" \
            --mode dry-run

      - name: Add the ledger to the run summary
        if: always()
        run: |
          set -euo pipefail
          SUMMARY="$RUNNER_TEMP/ledger/summary.md"
          if [ -f "$SUMMARY" ]; then cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the planned ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-lab-ledger-${{ github.run_id }}
          path: ${{ runner.temp }}/ledger/
          if-no-files-found: warn
          retention-days: 30
