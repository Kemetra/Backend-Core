# Backend-Core CI (T305, risk tiers RT-582).
#
# Job graph:
#   changes         : classifies the PR's changed paths into a risk tier with
#                     .github/scripts/ci-tier.sh (Low / Medium / High; unmatched
#                     paths are High). Non-PR events are always High.
#   fast            : no Docker. Static checks + build all workspaces plus
#                     Docker-free unit tests for worker / shared / auth.
#                     Medium and High.
#   db-integration  : Docker/Testcontainers. The apps/api RLS / audit / auth
#                     suites with the coverage gate (one shared Postgres, RT-815).
#                     Medium and High. Keeps its name: the ruleset requires it.
#   db-package      : Docker/Testcontainers. packages/db migration UP/DOWN cycles
#                     and the worker outbox DB suites, in parallel with
#                     db-integration (RT-816). Same gate as db-integration.
#                     Release gates require it by name too (release-images.yml,
#                     deploy/lab/verify-release.cjs).
#   oasdiff         : OpenAPI breaking-change gate (RT-52). Every PR, any tier.
#   schemathesis    : API fuzz over the cookieAuth surface (RT-59). PRs that are
#                     High, or Medium outside apps/worker/. Nightly full run on
#                     main: api-fuzz.yml. Four parallel schemathesis-shard jobs
#                     (RT-809), then this required check as their fail-closed fan-in.
#   ci              : always-reporting aggregate. Fails when a job the tier
#                     requires failed, was cancelled or was skipped.
#
# Gating rules (RT-582):
#   - Job-level `if:` only, never workflow-level `paths:`. A skipped job still
#     reports its check run, so the four required contexts always report.
#   - The four required jobs keep their exact `name:` values: ruleset 24169937
#     matches them by name, and release-images.yml reads fast + db-integration.
#   - Fail-open: a gated job is skipped ONLY when `changes` says 'false'. If
#     `changes` fails or emits nothing, everything runs (and `ci` goes red).
#
# Notes:
#   - MIGRATION_TEST_ALLOW_SKIP is intentionally NOT set anywhere. CI must fail if
#     Testcontainers cannot start (the soft-skip is a local-Docker-less escape hatch
#     only, per constitution.md).
#   - `pnpm lint` is the repository's no-emit TypeScript static-analysis gate.
#     `pnpm lint:eslint` is a separate ESLint gate (recommended rules + the
#     tenant-scope rule) on apps/api/src and apps/worker/src.
#   - `pnpm typecheck` (RT-129) type-checks the api/worker TEST files too
#     (tsconfig.json includes test/**); jest itself does not type-check.

name: CI

"on":
  pull_request:
  push:
    branches: [main]

concurrency:
  # push runs on main get a per-SHA group so each commit keeps its own completed
  # run (attribution / bisect); PR runs stay per-ref and are still superseded.
  group: ci-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes (risk tier)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      run_fast: ${{ steps.tier.outputs.run_fast }}
      run_db: ${{ steps.tier.outputs.run_db }}
      run_schemathesis: ${{ steps.tier.outputs.run_schemathesis }}
    steps:
      # pull_request checks out the synthetic merge commit; depth 2 makes its
      # first parent (the base-branch tip) available, so HEAD^1..HEAD is
      # exactly the PR's change set.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Self-test the tier rules
        run: bash .github/scripts/ci-tier.test.sh

      - name: Classify changed paths
        id: tier
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tier.out"
          paths="$RUNNER_TEMP/paths.txt"
          : >"$paths"
          if [ "$EVENT" != "pull_request" ]; then
            echo "Event $EVENT: full CI (high)."
            printf 'tier=high\nrun_fast=true\nrun_db=true\nrun_schemathesis=true\n' >"$out"
          else
            # --no-renames: a rename lists its old path too, so moving a High
            # file into docs/ cannot hide it.
            git diff -z --no-renames --name-only HEAD^1 HEAD >"$RUNNER_TEMP/changed.z"
            bash .github/scripts/ci-tier.sh <"$RUNNER_TEMP/changed.z" >"$out" 2>"$paths"
          fi
          cat "$out"
          cat "$out" >>"$GITHUB_OUTPUT"
          fence='```'
          {
            echo "### Risk tier (RT-582)"
            echo "$fence"
            cat "$out"
            echo "$fence"
            if [ -s "$paths" ]; then
              echo "<details><summary>Per-path tiers</summary>"
              echo
              echo "$fence"
              cat "$paths"
              echo "$fence"
              echo "</details>"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

  fast:
    name: fast (build + Docker-free tests)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_fast != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack and pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build all workspaces
        run: pnpm -r run build

      # MUST run after the build: `lint` is a --noEmit typecheck, and each
      # workspace resolves its siblings through their published `types`
      # entrypoints under dist/. On a cold checkout those .d.ts files only
      # exist once `build` has emitted them, so linting first fails with
      # TS2307 "Cannot find module '@data-pulse-2/shared'".
      - name: Static checks
        run: pnpm lint

      - name: ESLint
        run: pnpm lint:eslint

      - name: Typecheck tests (api + worker)
        run: pnpm typecheck

      - name: ESLint rule smoke test
        run: node --test tools/eslint-rules/__tests__/no-unscoped-tenant-query.spec.js

      - name: oasdiff consumer-impact spec
        run: node --test tools/oasdiff/__tests__/consumer-impact.spec.mjs

      - name: Test @data-pulse-2/worker (Docker-free suites)
        # The Testcontainers-backed outbox suites
        # (retry-budget / idempotent-consumer / tenant-context) are excluded
        # by default in apps/worker/jest.config.cjs. They run in the
        # db-integration job below with WORKER_INCLUDE_DB_TESTS=1.
        run: pnpm --filter @data-pulse-2/worker test

      - name: Test @data-pulse-2/shared
        run: pnpm --filter @data-pulse-2/shared test

      - name: Test @data-pulse-2/auth
        run: pnpm --filter @data-pulse-2/auth test

  db-integration:
    name: db-integration (Testcontainers + RLS + migrations)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_db != 'false' }}
    runs-on: ubuntu-latest
    # 40 (was 25): measured locally (WSL Docker), the full api suite runs ~16.5
    # min WITH coverage on a 2-core host — over the old 25-min ceiling once the
    # cold-runner build/pull (~4 min) + db (~3) + worker (~0.5) steps are added.
    # The now-retired self-hosted box this budget was tuned to was faster. 40
    # gives margin so a slow cold run reports a real verdict instead of being
    # cancelled mid-api-step (which wasted the already-green db + worker steps).
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack and pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build workspaces required by db/api/worker tests
        run: >-
          pnpm
          --filter @data-pulse-2/shared
          --filter @data-pulse-2/auth
          --filter @data-pulse-2/db
          --filter @data-pulse-2/worker
          run build

      - name: Pre-pull postgres:16-alpine
        run: docker pull postgres:16-alpine

      # RT-816: the packages/db and worker DB suites run in the parallel
      # `db-package` job, so they no longer wait in front of the api suite.

      - name: Test @data-pulse-2/api (RLS + audit + auth suites)
        # #618 G2 — coverage is collected and the Jest threshold gates this
        # job. The floors live in apps/api/jest.config.cjs (statements 95,
        # branches 84, lines 96, measured in CI); a 90 branch floor had forced this step
        # to drop --coverage. Codecov stays informational. ESLint is still not
        # the `pnpm lint` command (that remains tsc --noEmit).
        #
        # (Note: --coverage is NOT the runtime bottleneck — covered vs uncovered
        # differ by only ~2 min. The reliability fix is the 40-min timeout +
        # --forceExit below; see the open-handle note.)
        #
        # The Jest threshold in apps/api/jest.config.cjs is what fails this
        # job. Codecov remains informational.
        #
        # --forceExit: the api suite has a pre-existing whole-suite open-handle
        # leak (Jest prints "did not exit one second after the test run" — likely
        # the audit enqueuer's Redis/BullMQ fallback when PG_POOL is unset). On a
        # green run the tests finish (~16.5 min) but Jest then hangs until the job
        # times out — this, not coverage, is what cancelled CI twice. --forceExit
        # makes Jest exit cleanly once tests complete. The leak is real and
        # tracked as a separate pre-existing follow-up (NOT a 009 regression);
        # --forceExit masks it so CI is usable now. No test semantics changed.
        run: pnpm --filter @data-pulse-2/api test -- --coverage --forceExit

      - name: Check API lcov report exists (informational)
        id: api_lcov
        # RT-470 — never fails the job. Emits a warning and skips the upload
        # when Jest produced no lcov report (the upload step is gated on this).
        if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          if [ -s apps/api/coverage/lcov.info ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::apps/api/coverage/lcov.info is missing or empty; skipping Codecov upload (RT-470)."
          fi

      - name: Upload API coverage to Codecov (non-blocking)
        # RT-470 — restores the Codecov v5 upload removed in #257, strictly
        # non-blocking: it runs only after the API tests pass, so it can never
        # mask or cause a test/threshold failure. continue-on-error is on THIS
        # step only (Codecov quota exhaustion / network errors such as a TCP
        # AggregateError must not turn CI red). Fork PRs are skipped because
        # repository secrets are unavailable to them. Coverage gating stays in
        # apps/api/jest.config.cjs; Codecov remains informational (codecov.yml).
        if: ${{ success() && steps.api_lcov.outputs.present == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        timeout-minutes: 3
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: apps/api/coverage/lcov.info
          flags: api
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # RT-816: split out of db-integration so these suites run in parallel with
  # the api suite instead of in front of it. Same tier gate as db-integration.
  # The name is a required check in release-images.yml and
  # deploy/lab/verify-release.cjs; keep the three in step.
  db-package:
    name: db-package (packages/db migrations + worker DB suites)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_db != 'false' }}
    runs-on: ubuntu-latest
    # Measured on PR #909: db 193 s + worker 47 s, plus ~2 min install/build.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack and pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build workspaces required by db/worker tests
        run: >-
          pnpm
          --filter @data-pulse-2/shared
          --filter @data-pulse-2/auth
          --filter @data-pulse-2/db
          --filter @data-pulse-2/worker
          run build

      - name: Pre-pull postgres:16-alpine
        run: docker pull postgres:16-alpine

      - name: Test @data-pulse-2/db (migrations + Testcontainers)
        run: pnpm --filter @data-pulse-2/db test

      - name: Test @data-pulse-2/worker (Testcontainers outbox suites)
        # T561 / T562 / T563 — drainer-level retry budget, idempotent consumer,
        # and tenant-context RLS proof. WORKER_INCLUDE_DB_TESTS=1 lifts the
        # default `jest.config.cjs` exclusion of the three Testcontainers-
        # backed outbox specs (which the fast job skips for lack of Docker).
        # This step re-runs the full worker suite — the unit tier overlap
        # with `fast` is a few seconds of duplicate work and is intentional:
        # it keeps the CI yaml uniform and avoids a brittle regex inclusion
        # filter on the CLI (regex escapes round-trip badly through pnpm /
        # PowerShell / bash). The integration coverage is what matters here.
        env:
          WORKER_INCLUDE_DB_TESTS: "1"
        run: pnpm --filter @data-pulse-2/worker test

  # Moved here from openapi-breaking.yml (RT-582) so `ci` can depend on it.
  # Compares packages/contracts/openapi/** at the PR merge-base with the PR
  # head, in oasdiff composed mode, and fails on WARN or higher. Configuration
  # and the acknowledgement workflow live in tools/oasdiff/ (see its README).
  # Runs on every PR regardless of tier (it needs no install, DB or Docker) and
  # does not wait for `changes`. A push to main has no merge-base to compare.
  oasdiff:
    name: oasdiff (breaking changes vs merge-base)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OASDIFF_VERSION: "1.32.1"
      # sha256 of oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz from the release checksums.txt
      OASDIFF_SHA256: "7c8939fc49b75ee11fec66a5b83b37a2fca6aee109fed85013b1ba2ac2a1ee7f"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install oasdiff (pinned, checksum-verified)
        run: |
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/$archive"
          echo "${OASDIFF_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oasdiff"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/oasdiff" oasdiff
          echo "$RUNNER_TEMP/oasdiff" >> "$GITHUB_PATH"

      - name: Check for breaking changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          oasdiff --version
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          echo "Comparing against merge-base $base"
          bash tools/oasdiff/check.sh "$base"

  # Moved here from api-fuzz.yml (RT-582) so `ci` can depend on it; sharded 4 ways
  # by RT-809. Every shard boots its own ephemeral Backend-Core stack on its own
  # runner (fresh Postgres + Redis, documented DB roles, throwaway owner and
  # platform sessions, no worker), then runs Schemathesis over its share of the
  # cookieAuth contract files in packages/contracts/openapi:
  #
  #   - gate:   not_a_server_error. Fails on any 5xx that is not in
  #             tools/schemathesis/5xx-baseline.json.
  #   - report: positive_data_acceptance. Findings never fail the job; they are
  #             listed in the job summary.
  #
  # Either step fails if Schemathesis could not run (schema, network or tool
  # error). @PlatformAdminOnly operations run with a platform-admin session.
  # PR-only; main gets the nightly full run in api-fuzz.yml, which stays single
  # node and serial. Everything a shard creates is local to its runner; see
  # tools/schemathesis/README.md. The plan is computed from ops.py at this SHA
  # (tools/schemathesis/shards.py): the shards partition the files and the
  # fan-in below proves they ran every file exactly once.
  #
  # To change the shard count, change the matrix and SHARD_TOTAL in BOTH jobs
  # together; tools/schemathesis/__tests__/ci-wiring.test.py fails if they differ.
  schemathesis-shard:
    name: schemathesis shard ${{ matrix.shard }}
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.run_schemathesis != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard reports, so a failed one does not hide the others' evidence.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      # The scripts write to $RUNNER_TEMP/api-fuzz (the runner context is not
      # available in job-level env, so the path is not set here).
      FUZZ_PROJECT: api-fuzz
      SHARD_TOTAL: "4"
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Plan this shard's contract files
        run: bash tools/schemathesis/shard.sh plan

      - name: Start ephemeral stack
        timeout-minutes: 10
        run: bash tools/schemathesis/stack-up.sh

      - name: "Gate: no 5xx (not_a_server_error)"
        timeout-minutes: 20
        run: bash tools/schemathesis/shard.sh run gate

      # Findings never fail this step; it fails only if Schemathesis could not run.
      - name: "Report (non-gating findings): positive_data_acceptance"
        if: always()
        timeout-minutes: 15
        run: bash tools/schemathesis/shard.sh run report

      # Plan, manifests, exit codes, SHA and findings only: no raw logs (their
      # curl reproductions carry the session cookie) and nothing if a credential
      # shows up in them. Runs before the teardown removes $RUNNER_TEMP/api-fuzz.
      - name: Collect shard evidence
        if: always()
        run: bash tools/schemathesis/shard.sh collect

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schemathesis-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/st-shard/artifact
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Tear down
        if: always()
        run: |
          out="$RUNNER_TEMP/api-fuzz"
          if [ -f "$out/stack.env" ]; then
            set -a; . "$out/stack.env"; set +a
            export API_IMAGE=api-fuzz-api:local
            docker compose -p "$FUZZ_PROJECT" -f tools/schemathesis/compose.yml down -v
          fi
          rm -rf "$out"

  # Fail-closed fan-in under the ORIGINAL job id and name: the required check
  # context `schemathesis (cookieAuth surface)` (ruleset 24169937 and any old
  # per-job contexts) and the `ci` aggregate below keep working unchanged. The
  # `if:` is the pre-RT-809 expression, so a Low-tier or worker-only PR still
  # skips it, and it still runs (and fails) when `changes` breaks. It fails unless
  # all shard jobs succeeded and the shards' artifacts prove that every
  # (group, contract file, operationIds) of the inventory regenerated here ran
  # exactly once in gate and in report, at this SHA, with no unbaselined 5xx.
  schemathesis:
    name: schemathesis (cookieAuth surface)
    needs: [changes, schemathesis-shard]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.run_schemathesis != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHARD_TOTAL: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-test the shard planner and fan-in
        run: python3 tools/schemathesis/__tests__/shards.test.py

      # A failed or missing download is not a verdict: the fan-in below fails on
      # any shard artifact that is absent, so this step may not decide anything.
      - name: Download shard evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: schemathesis-shard-*
          path: ${{ runner.temp }}/st-shard/downloaded

      - name: Fan-in (coverage + gate)
        env:
          SHARDS_RESULT: ${{ needs.schemathesis-shard.result }}
        run: bash tools/schemathesis/shard.sh fanin

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schemathesis-merged
          path: ${{ runner.temp }}/st-shard/merged/schemathesis-merged.md
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  # Always-reporting aggregate (RT-582), modelled on Kemetra/POS ci.yml. RT-583
  # makes `ci` the only required check, so its name must not change.
  # oasdiff's requirement comes from the event alone, so a broken `changes`
  # cannot waive it; the other jobs are required unless `changes` said 'false'.
  ci:
    name: ci
    needs: [changes, fast, db-integration, db-package, oasdiff, schemathesis]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ needs.changes.result }}
          TIER: ${{ needs.changes.outputs.tier }}
          RUN_FAST: ${{ needs.changes.outputs.run_fast }}
          RUN_DB: ${{ needs.changes.outputs.run_db }}
          RUN_SCHEMATHESIS: ${{ needs.changes.outputs.run_schemathesis }}
          FAST: ${{ needs.fast.result }}
          DB: ${{ needs.db-integration.result }}
          DB_PACKAGE: ${{ needs.db-package.result }}
          OASDIFF: ${{ needs.oasdiff.result }}
          SCHEMATHESIS: ${{ needs.schemathesis.result }}
        run: |
          set -u
          echo "event=$EVENT changes=$CHANGES tier=$TIER"
          echo "run_fast=$RUN_FAST run_db=$RUN_DB run_schemathesis=$RUN_SCHEMATHESIS"
          echo "fast=$FAST db-integration=$DB db-package=$DB_PACKAGE oasdiff=$OASDIFF schemathesis=$SCHEMATHESIS"
          failed=0
          err() { echo "::error::$*"; failed=1; }

          [ "$CHANGES" = "success" ] || err "changes result is '$CHANGES' (expected success)"
          case "$TIER" in
            low | medium | high) ;;
            *) err "changes emitted no valid tier ('$TIER')" ;;
          esac

          pr=false
          [ "$EVENT" = "pull_request" ] && pr=true
          want_schemathesis=false
          [ "$pr" = true ] && [ "$RUN_SCHEMATHESIS" != "false" ] && want_schemathesis=true

          # check <job> <required: true|false> <result>
          check() {
            if [ "$2" = true ]; then
              [ "$3" = "success" ] || err "$1 is required (tier '$TIER') but its result is '$3'"
            else
              case "$3" in
                success | skipped) ;;
                *) err "$1 result is '$3'" ;;
              esac
            fi
          }
          check fast "$([ "$RUN_FAST" != "false" ] && echo true || echo false)" "$FAST"
          check db-integration "$([ "$RUN_DB" != "false" ] && echo true || echo false)" "$DB"
          check db-package "$([ "$RUN_DB" != "false" ] && echo true || echo false)" "$DB_PACKAGE"
          check oasdiff "$pr" "$OASDIFF"
          check schemathesis "$want_schemathesis" "$SCHEMATHESIS"
          exit "$failed"
