name: Update LOC Badge

# The badge is published to the `badges` branch, never to `main` (RT-81), so
# `main` can require PRs and status checks. Only the `publish` job can write,
# and it runs no repository code.

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-loc-badge
  cancel-in-progress: true

jobs:
  count:
    name: Count LOC
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Count LOC and generate badge
        run: node scripts/update-loc-badge.mjs

      - name: Upload badge
        uses: actions/upload-artifact@v4
        with:
          name: loc-badge
          path: docs/assets/badges/loc.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish badge to badges branch
    needs: count
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # Actions in this write-scoped job are pinned to commit SHAs. The artifact
    # is downloaded before checkout, so no credentials exist while it runs.
    steps:
      - name: Download badge
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: loc-badge
          path: ${{ runner.temp }}/loc-badge

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Commit badge to badges branch if changed
        shell: bash
        run: |
          set -euo pipefail
          # ls-remote exits 2 only when the branch is missing; any other
          # failure must stop the job instead of starting a new orphan.
          rc=0
          git ls-remote --exit-code --heads origin badges > /dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            git fetch --depth=1 origin badges
            git switch -C badges FETCH_HEAD
          elif [ "$rc" -eq 2 ]; then
            git switch --orphan badges
          else
            echo "::error::git ls-remote failed (exit $rc); not publishing."
            exit "$rc"
          fi
          cp "$RUNNER_TEMP/loc-badge/loc.svg" loc.svg
          git add loc.svg
          if git diff --cached --quiet; then
            echo "Badge unchanged."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update LOC badge [skip ci]"
          git push origin HEAD:refs/heads/badges
