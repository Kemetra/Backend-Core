# RT-613 — ONE manual cross-repo Linux CI acceptance batch. Not a migration,
# not a gate, no cutover. GitHub Actions stays the only CI of record.
#
# Manual-only: the only workflow runs when `run_rt613` is true (default false),
# so push-created pipelines have no jobs. Launch with:
#   circleci pipeline run --project gh/Kemetra/Backend-Core \
#     --definition-id <id> --branch <this-branch> --param run_rt613=true
#
# All four repos are public. The other three are cloned over HTTPS at pinned
# full SHAs inside their own jobs; nothing is written to them. Backend-Core jobs
# clone $CIRCLE_SHA1 (main + this config-only commit). No secrets, no Codecov.
#
# Every long command is wrapped in `timeout` so each job has a hard cap.

version: 2.1

parameters:
  run_rt613: {type: boolean, default: false}
  bc_main_sha: {type: string, default: "55b3d84619e96b6cd005595b9abc89d5abb496ae"}
  pos_sha: {type: string, default: "dfa65dcf381c439c09fdd6e6a59ba8d49fc599b9"}
  ac_sha: {type: string, default: "f8c972a437ea3d695641193e9339799f0bf7b4a1"}
  ec_sha: {type: string, default: "13bbb9daf6de5d77af06f0c06c0ea8950d4ea2c7"}
  api_shards: {type: integer, default: 2}
  pos_shards: {type: integer, default: 3}

executors:
  vm:
    parameters:
      size: {type: string, default: large}
    machine:
      image: ubuntu-2404:2025.09.1
    resource_class: << parameters.size >>
  py:
    docker:
      - image: cimg/python:3.11
    resource_class: medium

commands:
  clone:
    parameters:
      repo: {type: string}
      sha: {type: string}
    steps:
      - run:
          name: Clone << parameters.repo >> over HTTPS at << parameters.sha >>
          command: |
            git clone https://github.com/Kemetra/<< parameters.repo >>.git .
            git checkout --detach "<< parameters.sha >>"
            test "$(git rev-parse HEAD)" = "$(git rev-parse "<< parameters.sha >>^{commit}")"
            git log -1 --oneline
  node:
    parameters:
      version: {type: string}
      pnpm: {type: boolean, default: false}
    steps:
      - run:
          name: Node << parameters.version >> on PATH for every step
          command: |
            nvm install << parameters.version >>
            echo "export PATH=\"$(dirname "$(nvm which << parameters.version >>)"):\$PATH\"" >> "$BASH_ENV"
            echo "nproc=$(nproc) mem=$(free -g | awk '/Mem:/{print $2}')G"
      - when:
          condition: << parameters.pnpm >>
          steps:
            - run:
                name: pnpm 9.15.0 (same pin as the repos)
                command: |
                  corepack enable
                  corepack prepare pnpm@9.15.0 --activate
      - run:
          name: Check tools persist into a fresh step
          command: node --version && (<< parameters.pnpm >> && pnpm --version || npm --version)
  bc-setup:
    steps:
      - clone:
          repo: Backend-Core
          sha: $CIRCLE_SHA1
      - node: {version: "22", pnpm: true}
      - run: {name: Install dependencies, command: pnpm install --frozen-lockfile --ignore-scripts}
  bc-build:
    steps:
      - run:
          name: Build workspaces required by api/db/worker tests
          command: >-
            pnpm --filter @data-pulse-2/shared --filter @data-pulse-2/auth
            --filter @data-pulse-2/db --filter @data-pulse-2/worker run build
      - run: {name: Pre-pull postgres:16-alpine, command: docker pull postgres:16-alpine}

jobs:
  # Fails fast on bad SHAs, a non-config diff, Docker/Compose, resource class or flags.
  preflight:
    executor: {name: vm, size: medium}
    steps:
      - run:
          name: Verify pinned SHAs, diff scope and runner prerequisites
          command: |
            set -e
            echo "nproc=$(nproc) mem=$(free -g | awk '/Mem:/{print $2}')G"
            docker --version && docker compose version
            # Host tools the Schemathesis scripts and jobs call (python runs inside containers).
            for t in git curl openssl sed awk mktemp timeout sudo; do command -v "$t" >/dev/null || { echo "missing host tool: $t"; exit 1; }; done
            for r in POS:<< pipeline.parameters.pos_sha >> Admin-Console:<< pipeline.parameters.ac_sha >> ERPNext-Connector:<< pipeline.parameters.ec_sha >> Backend-Core:<< pipeline.parameters.bc_main_sha >>; do
              repo="${r%%:*}"; sha="${r##*:}"
              [ "${#sha}" = 40 ] || { echo "$repo pin is not a full SHA: $sha"; exit 1; }
              d=$(mktemp -d); git -C "$d" init -q
              git -C "$d" fetch -q --depth=1 "https://github.com/Kemetra/$repo.git" "$sha"
              echo "$repo pin OK: $sha (remote main: $(git ls-remote "https://github.com/Kemetra/$repo.git" refs/heads/main | cut -c1-40))"
            done
            git clone -q https://github.com/Kemetra/Backend-Core.git bc && cd bc
            git checkout -q --detach "$CIRCLE_SHA1"
            changed=$(git diff --name-only << pipeline.parameters.bc_main_sha >> "$CIRCLE_SHA1")
            echo "$changed"
            echo "$changed" | grep -v '^\.circleci/' && { echo "diff vs pinned main is not .circleci-only"; exit 1; } || true
            test -f apps/api/jest.config.cjs && test -f tools/schemathesis/run.sh

  bc-api-jest:
    executor: {name: vm, size: large}
    parallelism: << pipeline.parameters.api_shards >>
    steps:
      - bc-setup
      - bc-build
      - run:
          name: API Jest shard (threshold enforced once, in bc-api-gate)
          working_directory: ~/project/apps/api
          no_output_timeout: 15m
          command: |
            OUT="/tmp/ws/api/node-$CIRCLE_NODE_INDEX"; mkdir -p "$OUT"
            pnpm exec jest --listTests | sed "s#^$PWD/##" | sort > "$OUT/all-tests.txt"
            test -s "$OUT/all-tests.txt"
            timeout 15m circleci tests run --verbose --split-by=timings --timings-type=filename \
              --command="tee $OUT/shard-files.txt | xargs -r pnpm exec jest --runTestsByPath --coverage --coverageThreshold='{}' --coverageReporters=json --coverageDirectory=$OUT --forceExit --json --outputFile=$OUT/jest.json" \
              < "$OUT/all-tests.txt"
            test -s "$OUT/shard-files.txt"
      - run:
          name: Shard JUnit
          when: always
          command: node .circleci/scripts/jest-json-to-junit.cjs "/tmp/ws/api/node-$CIRCLE_NODE_INDEX/jest.json" /tmp/junit/bc-api.xml "$PWD/apps/api"
      - store_test_results: {path: /tmp/junit}
      - persist_to_workspace: {root: /tmp/ws, paths: [api]}

  bc-api-gate:
    executor: {name: vm, size: medium}
    steps:
      - bc-setup
      - attach_workspace: {at: /tmp/ws}
      - run:
          name: Inventory + merged coverage gate (no unsplit control; RT-594 is the baseline)
          command: node .circleci/scripts/coverage-gate.cjs apps/api /tmp/ws/api << pipeline.parameters.api_shards >>

  bc-db-worker:
    executor: {name: vm, size: large}
    steps:
      - bc-setup
      - bc-build
      - run:
          name: "@data-pulse-2/db (migrations + Testcontainers)"
          no_output_timeout: 15m
          command: mkdir -p /tmp/ws/dbw && timeout 15m pnpm --filter @data-pulse-2/db test -- --json --outputFile=/tmp/ws/dbw/db.json
      - run:
          name: "@data-pulse-2/worker (Testcontainers outbox suites)"
          no_output_timeout: 10m
          environment: {WORKER_INCLUDE_DB_TESTS: "1"}
          command: timeout 10m pnpm --filter @data-pulse-2/worker test -- --json --outputFile=/tmp/ws/dbw/worker.json
      - run:
          name: JUnit for db and worker (reporting only)
          when: always
          command: |
            node .circleci/scripts/jest-json-to-junit.cjs /tmp/ws/dbw/db.json /tmp/junit/bc-db.xml "$PWD/packages/db" || true
            node .circleci/scripts/jest-json-to-junit.cjs /tmp/ws/dbw/worker.json /tmp/junit/bc-worker.xml "$PWD/apps/worker" || true
      - store_test_results: {path: /tmp/junit}

  bc-schemathesis:
    executor: {name: vm, size: large}
    environment: {FUZZ_PROJECT: api-fuzz}
    steps:
      - clone: {repo: Backend-Core, sha: $CIRCLE_SHA1}
      # Step caps sum to 28 min, about GitHub's whole-job timeout-minutes: 30.
      # Schemathesis emits no JUnit here; its result is the step exit code and log.
      - run: {name: Start ephemeral stack, no_output_timeout: 8m, command: timeout 8m bash tools/schemathesis/stack-up.sh}
      - run: {name: "Gate: no 5xx (not_a_server_error)", no_output_timeout: 14m, command: timeout 14m bash tools/schemathesis/run.sh gate}
      - run: {name: "Report (non-gating findings)", when: always, no_output_timeout: 6m, command: timeout 6m bash tools/schemathesis/run.sh report}
      - run:
          name: Tear down
          when: always
          command: |
            out="${TMPDIR:-/tmp}/api-fuzz"
            if [ -f "$out/stack.env" ]; then
              set -a; . "$out/stack.env"; set +a
              export API_IMAGE=api-fuzz-api:local
              docker compose -p "$FUZZ_PROJECT" -f tools/schemathesis/compose.yml down -v
            fi

  ac-build-test-e2e:
    executor: {name: vm, size: large}
    steps:
      - clone: {repo: Admin-Console, sha: << pipeline.parameters.ac_sha >>}
      - node: {version: "22", pnpm: true}
      - run: {name: Install, command: pnpm install --frozen-lockfile --ignore-scripts}
      - run: {name: Fetch pinned Backend-Core contracts, command: .github/scripts/fetch-pinned-contracts.sh /tmp/backend-core}
      - run:
          name: Regenerate API client and check drift
          environment: {DATA_PULSE_2_REPO: /tmp/backend-core}
          command: |
            pnpm generate:client
            git diff --exit-code --stat src/generated/
      - run: {name: Build, command: timeout 5m pnpm build}
      - run: {name: Lint, command: pnpm lint}
      - run: {name: Unit tests, command: timeout 5m pnpm test}
      - run: {name: Install Playwright Chromium, command: pnpm exec playwright install --with-deps chromium}
      - run:
          name: E2E tests (existing config; JUnit added; retries kept)
          no_output_timeout: 10m
          # Both env-name spellings are set: Admin-Console pins Playwright 1.60.0
          # and only the 1.64 source was inspected. JUnit is reporting only.
          environment:
            PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report/e2e-results.json
            PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/e2e-results.json
            PLAYWRIGHT_JUNIT_OUTPUT_FILE: /tmp/junit/ac-e2e.xml
            PLAYWRIGHT_JUNIT_OUTPUT_NAME: /tmp/junit/ac-e2e.xml
          command: timeout 10m pnpm test:e2e --reporter=list,json,junit
      - run: {name: Report E2E retries, when: always, command: node .github/scripts/report-flaky-e2e.mjs || true}
      - store_test_results: {path: /tmp/junit}

  pos-static:
    executor: {name: vm, size: medium}
    steps:
      - clone: {repo: POS, sha: << pipeline.parameters.pos_sha >>}
      - node: {version: "24"}
      - run: {name: Install (no lifecycle scripts), command: npm ci --ignore-scripts}
      - run: {name: Backend-Core contract conformance, command: npm test -- tests/contract/backend-core --reporter=default --reporter=junit --outputFile.junit=/tmp/junit/pos-contract.xml}
      - run: {name: Verify OpenAPI codegen drift, command: npm run codegen:verify}
      - run: {name: Build renderer (vite), command: npm run build:renderer}
      - run: {name: Typecheck, command: npm run typecheck}
      - run: {name: Lint, command: npm run lint}
      - store_test_results: {path: /tmp/junit}

  pos-test-shard:
    executor: {name: vm, size: large}
    parallelism: << pipeline.parameters.pos_shards >>
    steps:
      - clone: {repo: POS, sha: << pipeline.parameters.pos_sha >>}
      - node: {version: "24"}
      - run: {name: Install (no lifecycle scripts), command: npm ci --ignore-scripts}
      - run:
          name: Vitest shard (coverage collected, thresholds evaluated once in pos-test-merge)
          no_output_timeout: 10m
          command: >-
            timeout 10m npm test -- --coverage --config vitest.shard.config.ts
            --exclude 'tests/contract/backend-core/**'
            --shard=$((CIRCLE_NODE_INDEX+1))/$CIRCLE_NODE_TOTAL
            --reporter=default --reporter=blob --reporter=junit
            --outputFile.junit=/tmp/junit/pos-shard-$CIRCLE_NODE_INDEX.xml
      - run:
          name: Stage blob report
          command: mkdir -p /tmp/ws/pos && cp -r .vitest-reports "/tmp/ws/pos/blob-$CIRCLE_NODE_INDEX"
      - store_test_results: {path: /tmp/junit}
      - persist_to_workspace: {root: /tmp/ws, paths: [pos]}

  pos-test-merge:
    executor: {name: vm, size: medium}
    steps:
      - clone: {repo: POS, sha: << pipeline.parameters.pos_sha >>}
      - node: {version: "24"}
      - run: {name: Install (no lifecycle scripts), command: npm ci --ignore-scripts}
      - attach_workspace: {at: /tmp/ws}
      - run:
          name: All shard blobs present, then merge + coverage thresholds (unmodified vitest.config.ts)
          command: |
            mkdir -p .vitest-reports && cp /tmp/ws/pos/blob-*/* .vitest-reports/
            count=$(find .vitest-reports -maxdepth 1 -name 'blob-*.json' | wc -l)
            [ "$count" = "<< pipeline.parameters.pos_shards >>" ] || { echo "expected << pipeline.parameters.pos_shards >> blobs, found $count"; exit 1; }
            timeout 6m npm test -- --merge-reports --coverage

  ec-test:
    executor: py
    steps:
      - run:
          name: Clone ERPNext-Connector over HTTPS at << pipeline.parameters.ec_sha >>
          command: |
            git clone https://github.com/Kemetra/ERPNext-Connector.git .
            git checkout --detach "<< pipeline.parameters.ec_sha >>"
      - run: {name: Install test tools, command: python -m pip install pytest==9.1.1 pytest-cov==7.1.0 ruff==0.15.20}
      - run: {name: Lint, command: python -m ruff check retail_tower_erpnext_connector}
      - run:
          name: Unit tests (frappe-free; test_foundation.py needs a bench and is NOT run)
          command: >-
            timeout 8m python -m pytest -q retail_tower_erpnext_connector/tests
            --ignore=retail_tower_erpnext_connector/tests/test_foundation.py
            --cov=retail_tower_erpnext_connector --cov-report=xml:coverage.xml
            --junitxml=/tmp/junit/ec.xml
      - store_test_results: {path: /tmp/junit}

workflows:
  rt613-acceptance:
    when: << pipeline.parameters.run_rt613 >>
    jobs:
      - preflight
      - bc-api-jest: {requires: [preflight]}
      - bc-api-gate: {requires: [bc-api-jest]}
      - bc-db-worker: {requires: [preflight]}
      - bc-schemathesis: {requires: [preflight]}
      - ac-build-test-e2e: {requires: [preflight]}
      - pos-static: {requires: [preflight]}
      - pos-test-shard: {requires: [preflight]}
      - pos-test-merge: {requires: [pos-test-shard]}
      - ec-test: {requires: [preflight]}
