# Backend-Core heavy-CI measurement run (RT-613, scoped to Backend-Core only).
# Not a migration, not a gate, no cutover. GitHub Actions stays the only CI of record.
#
# Manual-only: the only workflow runs when `run_bc_ci` is true (default false),
# so push-created pipelines have no jobs and spend no credits. Launch with:
#   circleci pipeline run --project gh/Kemetra/Backend-Core \
#     --definition-id <id> --branch <this-branch> --param run_bc_ci=true
#
# Mirrors the heavy parts of .github/workflows/ci.yml at the pinned main SHA:
#   bc-api-jest      : `pnpm --filter @data-pulse-2/api test -- --coverage --forceExit`,
#                      split over N nodes, per-shard threshold off.
#   bc-api-gate      : fan-in. Fails unless every shard reported, the executed spec
#                      files equal `jest --listTests` exactly once each, and the MERGED
#                      coverage meets apps/api/jest.config.cjs (read from the file).
#   bc-db-worker     : db migrations + worker Testcontainers suites (db-integration).
#   bc-schemathesis  : split over `fuzz_shards` nodes (RT-806), each with its own ephemeral
#                      stack and sessions; runs the 5xx gate, then the non-gating report,
#                      on its contract files (deterministic LPT split, see scripts/).
#   bc-schemathesis-fanin : fails unless every shard reported, each (group, file) from
#                      ops.py at this SHA ran exactly once per mode, and every gate passed;
#                      publishes the merged report.
# `fast` and `oasdiff` stay on GitHub only (light, no Docker).
#
# Public repo: cloned anonymously over HTTPS, pinned to the pipeline commit.
# No secrets, no Codecov. Every long command is wrapped in `timeout`.

version: 2.1

parameters:
  run_bc_ci: {type: boolean, default: false}
  bc_main_sha: {type: string, default: "7a56b5828db9542e07a0ee6edbfccd204152f96b"}
  api_shards: {type: integer, default: 2}
  fuzz_shards: {type: integer, default: 3}

executors:
  vm:
    parameters:
      size: {type: string, default: large}
    machine:
      image: ubuntu-2404:2025.09.1
    resource_class: << parameters.size >>

commands:
  clone:
    steps:
      - run:
          name: Clone Backend-Core over HTTPS, pinned to the pipeline commit
          command: |
            git clone https://github.com/Kemetra/Backend-Core.git .
            git checkout --detach "$CIRCLE_SHA1"
            test "$(git rev-parse HEAD)" = "$(git rev-parse "$CIRCLE_SHA1^{commit}")"
            git log -1 --oneline
  node:
    steps:
      - run:
          name: Node 22 + pnpm 9.15.0 on PATH for every step
          command: |
            nvm install 22
            echo "export PATH=\"$(dirname "$(nvm which 22)"):\$PATH\"" >> "$BASH_ENV"
            echo "nproc=$(nproc) mem=$(free -g | awk '/Mem:/{print $2}')G"
      - run:
          name: pnpm 9.15.0 (same pin as ci.yml)
          command: |
            corepack enable
            corepack prepare pnpm@9.15.0 --activate
      - run:
          name: Check tools persist into a fresh step
          command: node --version && pnpm --version
  bc-setup:
    steps:
      - clone
      - node
      - run: {name: Install dependencies, command: pnpm install --frozen-lockfile --ignore-scripts}
  bc-build:
    steps:
      - run:
          name: Build workspaces required by api/db/worker tests
          command: >-
            pnpm --filter @data-pulse-2/shared --filter @data-pulse-2/auth
            --filter @data-pulse-2/db --filter @data-pulse-2/worker run build
      - run: {name: Pre-pull postgres:16-alpine, command: docker pull postgres:16-alpine}

jobs:
  # Fails fast on a bad pin, a non-config diff, Docker/Compose or missing host tools.
  preflight:
    executor: {name: vm, size: medium}
    steps:
      - run:
          name: Verify pinned SHA, diff scope and runner prerequisites
          command: |
            set -e
            echo "nproc=$(nproc) mem=$(free -g | awk '/Mem:/{print $2}')G"
            docker --version && docker compose version
            # Host tools the Schemathesis scripts and jobs call (python runs inside containers).
            for t in git curl openssl sed awk mktemp timeout sudo python3; do command -v "$t" >/dev/null || { echo "missing host tool: $t"; exit 1; }; done
            sha="<< pipeline.parameters.bc_main_sha >>"
            [ "${#sha}" = 40 ] || { echo "pin is not a full SHA: $sha"; exit 1; }
            git clone -q https://github.com/Kemetra/Backend-Core.git bc && cd bc
            echo "remote main: $(git rev-parse origin/main)"
            git checkout -q --detach "$CIRCLE_SHA1"
            changed=$(git diff --name-only "$sha" "$CIRCLE_SHA1")
            echo "$changed"
            echo "$changed" | grep -v '^\.circleci/' && { echo "diff vs pinned main is not .circleci-only"; exit 1; } || true
            test -f apps/api/jest.config.cjs && test -f tools/schemathesis/run.sh
            # Lane-only shard scripts live under .circleci/scripts, so the diff rule above holds.
            [ << pipeline.parameters.fuzz_shards >> -ge 1 ] || { echo "fuzz_shards must be >= 1"; exit 1; }

  bc-api-jest:
    executor: {name: vm, size: large}
    parallelism: << pipeline.parameters.api_shards >>
    steps:
      - bc-setup
      - bc-build
      - run:
          name: API Jest shard (threshold enforced once, in bc-api-gate)
          working_directory: ~/project/apps/api
          no_output_timeout: 15m
          command: |
            OUT="/tmp/ws/api/node-$CIRCLE_NODE_INDEX"; mkdir -p "$OUT"
            pnpm exec jest --listTests | sed "s#^$PWD/##" | sort > "$OUT/all-tests.txt"
            test -s "$OUT/all-tests.txt"
            timeout 15m circleci tests run --verbose --split-by=timings --timings-type=filename \
              --command="tee $OUT/shard-files.txt | xargs -r pnpm exec jest --runTestsByPath --coverage --coverageThreshold='{}' --coverageReporters=json --coverageDirectory=$OUT --forceExit --json --outputFile=$OUT/jest.json" \
              < "$OUT/all-tests.txt"
            test -s "$OUT/shard-files.txt"
      - run:
          name: Shard JUnit
          when: always
          command: node .circleci/scripts/jest-json-to-junit.cjs "/tmp/ws/api/node-$CIRCLE_NODE_INDEX/jest.json" /tmp/junit/bc-api.xml "$PWD/apps/api"
      - store_test_results: {path: /tmp/junit}
      - persist_to_workspace: {root: /tmp/ws, paths: [api]}

  bc-api-gate:
    executor: {name: vm, size: medium}
    steps:
      - bc-setup
      - attach_workspace: {at: /tmp/ws}
      - run:
          name: Inventory + merged coverage gate
          command: node .circleci/scripts/coverage-gate.cjs apps/api /tmp/ws/api << pipeline.parameters.api_shards >>

  bc-db-worker:
    executor: {name: vm, size: large}
    steps:
      - bc-setup
      - bc-build
      - run:
          name: "@data-pulse-2/db (migrations + Testcontainers)"
          no_output_timeout: 15m
          command: mkdir -p /tmp/ws/dbw && timeout 15m pnpm --filter @data-pulse-2/db test -- --json --outputFile=/tmp/ws/dbw/db.json
      - run:
          name: "@data-pulse-2/worker (Testcontainers outbox suites)"
          no_output_timeout: 10m
          environment: {WORKER_INCLUDE_DB_TESTS: "1"}
          command: timeout 10m pnpm --filter @data-pulse-2/worker test -- --json --outputFile=/tmp/ws/dbw/worker.json
      - run:
          name: JUnit for db and worker (reporting only)
          when: always
          command: |
            node .circleci/scripts/jest-json-to-junit.cjs /tmp/ws/dbw/db.json /tmp/junit/bc-db.xml "$PWD/packages/db" || true
            node .circleci/scripts/jest-json-to-junit.cjs /tmp/ws/dbw/worker.json /tmp/junit/bc-worker.xml "$PWD/apps/worker" || true
      - store_test_results: {path: /tmp/junit}

  bc-schemathesis:
    executor: {name: vm, size: large}
    parallelism: << pipeline.parameters.fuzz_shards >>
    environment: {FUZZ_PROJECT: api-fuzz, SHARD_WS: /tmp/ws/st}
    steps:
      - clone
      - run: {name: Shard plan from ops.py + run.sh file filter (lane only), command: bash .circleci/scripts/schemathesis-shard.sh plan}
      # Step caps sized from measured GitHub runs (2026-10-21: stack 1.3, gate 13-14, report 10.6-10.8 min).
      # GitHub caps only the whole job (30 min); CircleCI has no job cap, so each step gets headroom.
      # Gate and report record their exit code; the verdict step and the fan-in fail on it,
      # so the manifest and findings are persisted first.
      - run: {name: Start ephemeral stack, no_output_timeout: 8m, command: timeout 8m bash tools/schemathesis/stack-up.sh}
      - run: {name: "Gate: no 5xx (not_a_server_error), this shard", no_output_timeout: 20m, command: bash .circleci/scripts/schemathesis-shard.sh run gate 20m}
      - run: {name: "Report (non-gating findings), this shard", when: always, no_output_timeout: 16m, command: bash .circleci/scripts/schemathesis-shard.sh run report 16m}
      - run: {name: Manifest, findings and secret guard, when: always, command: bash .circleci/scripts/schemathesis-shard.sh collect}
      - store_artifacts: {path: /tmp/st-artifacts}
      - persist_to_workspace: {root: /tmp/ws, paths: [st]}
      - run:
          name: Tear down
          when: always
          command: |
            out="${TMPDIR:-/tmp}/api-fuzz"
            if [ -f "$out/stack.env" ]; then
              set -a; . "$out/stack.env"; set +a
              export API_IMAGE=api-fuzz-api:local
              docker compose -p "$FUZZ_PROJECT" -f tools/schemathesis/compose.yml down -v
            fi
      - run: {name: Shard verdict, when: always, command: bash .circleci/scripts/schemathesis-shard.sh verdict}

  bc-schemathesis-fanin:
    executor: {name: vm, size: medium}
    steps:
      - clone
      - attach_workspace: {at: /tmp/ws}
      - run:
          name: Coverage + gate fan-in, merged report
          command: |
            mkdir -p /tmp/st-merged
            bash .circleci/scripts/schemathesis-shard.sh inventory /tmp/st-merged/inventory.txt
            set +e
            python3 .circleci/scripts/schemathesis-shards.py check /tmp/st-merged/inventory.txt \
              << pipeline.parameters.fuzz_shards >> .circleci/scripts/schemathesis-timings.json /tmp/ws/st /tmp/st-merged/schemathesis-merged.md
            echo $? > /tmp/fanin.rc
      - store_artifacts: {path: /tmp/st-merged}
      - run: {name: Fan-in verdict, command: 'exit "$(cat /tmp/fanin.rc)"'}

workflows:
  bc-heavy-ci:
    when: << pipeline.parameters.run_bc_ci >>
    jobs:
      - preflight
      - bc-api-jest: {requires: [preflight]}
      - bc-api-gate: {requires: [bc-api-jest]}
      - bc-db-worker: {requires: [preflight]}
      - bc-schemathesis: {requires: [preflight]}
      # Runs after a failed shard too, so the merged report shows what went wrong.
      - bc-schemathesis-fanin: {requires: [{bc-schemathesis: [success, failed]}]}
